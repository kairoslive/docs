name: Sync dynamic docs

on:
  schedule:
    # Daily at 06:15 UTC. Regenerates OpenAPI specs, live fee tiers, and geo restrictions.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dynamic-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate dynamic pages
        run: node scripts/sync-dynamic.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi trading/fees.mdx compliance/geo-restrictions.mdx
          git commit -m "chore: sync dynamic docs (openapi, fees, geo restrictions)"
          git push

      properties:
        homePoints:
          type: integer
        awayPoints:
          type: integer
        lastPlay:
          type: string
        status:
          type: string
      example:
        homePoints: 88
        awayPoints: 91
        lastPlay: 3-pointer made
        status: in_progress
        period: 4
        periodType: quarter
        periodRemaining: 02:14
        possession: away

  /pnl/{user_id}:
    get:
      operationId: getUserPnl
      summary: Get merged PnL data for a user across one or more wallets/providers
      tags:
      - PnL
      x-kairos-auth: api-key
      x-kairos-scope: position:read
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      description: |
        Fetches and merges PnL records/summary across the wallets supplied for this user via the general-purpose PnL path — not the real-time pipeline used by `/pnl/hover` and `/pnl/wallet-totals`. At least one of `polymarket_wallet`, `kalshi_wallet`, or `hyperliquid_wallet` is required — the request is rejected with 400 if none are supplied. `polymarket_wallet` and `hyperliquid_wallet` must be valid Ethereum addresses (normalized/lower-cased); `kalshi_wallet` is treated as an opaque user-id string (Kalshi is a CEX with internal, non-address identifiers). `provider` (repeatable query param, up to 16 items) filters the merged result down to specific provider(s); when omitted, all providers implied by the supplied wallets are used. Kalshi and Hyperliquid PnL are served only through this aggregate endpoint; neither is available from `/pnl/hover` or `/pnl/wallet-totals`. Hyperliquid open-position and unrealized PnL use HIP-4 balances and mark prices, while realized PnL and fee fields are currently zero. The caller-supplied `{user_id}` MUST match the authenticated principal's own id (JWT `sub`, or `user_id` for API-key auth) — mismatches are rejected with 403; this endpoint can only ever return the caller's own PnL. `limit`/`offset` paginate the merged record list; internally up to `min(limit + offset, 1000)` records per provider are fetched, so `total`/`has_more` in the response describe the page relative to that ceiling, not an authoritative full-history count. For API-key callers, each requested provider must additionally have its API access enabled; JWT/admin callers are exempt.
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
        description: Kairos internal user id. Must match the authenticated caller's own id.
        example: usr_9f3c2a1b
      - name: polymarket_wallet
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
        description: Polymarket (Ethereum) wallet address.
        example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
      - name: kalshi_wallet
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
        description: Kalshi user ID (opaque internal identifier, not a wallet address).
      - name: hyperliquid_wallet
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
        description: Hyperliquid EVM address (HIP-4 positions key off this same deposit/trade address).
        example: '0x2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c'
      - name: provider
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          maxItems: 16
          items:
            type: string
        description: Filter merged PnL to these provider(s). Repeatable query param.
        example:
        - polymarket
        - hyperliquid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
        description: Records per page.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Records to skip.
      responses:
        '200':
          description: Merged PnL summary and records for the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlUserPnlResponse'
        '400':
          description: |
            Missing/oversized `user_id`, an invalid wallet address, an invalid `provider` filter, or no wallet address supplied at all.
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          description: The `user_id` does not match the authenticated caller, the API key is missing the
            `position:read` scope, or platform API access is disabled.
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '503':
          description: Per-venue API-access flag could not be read or validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /pnl/hover/{provider_id}/{wallet}/{contract_id}:
    get:
      operationId: getWalletMarketPnl
      summary: Live per-market PnL for a (wallet, market) pair
      tags:
      - PnL
      x-kairos-auth: api-key
      x-kairos-scope: position:read
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      description: |
        Live "hover" PnL for a single wallet on a single market, sourced from a fast real-time pipeline — quick regardless of how far back the wallet's earliest trade goes. Returns one row per token held on the contract (e.g. YES + NO for a binary market) plus aggregate totals across those tokens. Only providers on this pipeline are supported: `polymarket`, `opinion`, `predictfun`; `kalshi` and `hyperliquid` are rejected with 400 and must use `/pnl/{user_id}`. When the underlying pipeline is disabled (e.g. while a backfill is ramping), the endpoint returns a well-formed zero/empty payload (`tokens: []`, all totals `0.0`) instead of erroring, matching the "no data" state the frontend already renders gracefully. For API-key callers, the requested provider must additionally have its API access enabled.
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 32
          enum:
          - polymarket
          - opinion
          - predictfun
        description: MV-pipeline provider id. `kalshi`, `hyperliquid`, and any other registered-but-non-MV provider are
          rejected with 400.
        example: polymarket
      - name: wallet
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
        description: Wallet address (opaque string; trimmed, length-checked — not format-validated at
          this layer).
        example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
        description: Market/condition (contract) id.
        example: 0xabc123condition
      responses:
        '200':
          description: |
            Per-token PnL rows and aggregate totals for the wallet on this market. Returns an empty/zeroed payload (not a 404) when the underlying PnL pipeline is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlWalletMarketPnlResponse'
        '400':
          description: Missing/oversized `wallet`/`contract_id`, or `provider_id` is not a valid MV-pipeline
            provider (e.g. kalshi or hyperliquid).
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          description: API key missing `position:read` scope, or platform API access disabled for this
            provider.
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Unexpected error fetching hover PnL.
        '503':
          description: Per-venue API-access flag could not be read or validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /pnl/wallet-totals/{provider_id}/{wallet}:

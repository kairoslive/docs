    PerpetualInstrument:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - venue
      - integration_id
      - environment
      - venue_instrument_id
      - display_symbol
      - base_asset_id
      - quote_asset_id
      - collateral_asset_id
      - settlement_asset_id
      - native_quantity_unit
      - contract_multiplier
      - status
      - isolated_only
      - max_leverage
      - price_increment
      - size_increment
      - metadata
      properties:
        instrument_id:
          type: string
          description: |
            Stable Kairos instrument identity. Hyperliquid standard assets use
            `hl-mainnet-{base}-usdt`; HYPE and PURR use the USDC exception.
          examples:
          - hl-mainnet-btc-usdt
          - hl-mainnet-hype-usdc
          - hl-mainnet-purr-usdc
        venue:
          $ref: '#/components/schemas/PerpetualVenue'
        integration_id:
          type: string
          description: Product-specific routing and credential boundary.
        environment:
          type: string
        venue_instrument_id:
          type: string
          description: Exact identifier accepted by the venue and Market Data API snapshot endpoint.
        display_symbol:
          type: string
          examples:
          - BTC-USDT
          - HYPE-USDC
          - PURR-USDC
        base_asset_id:
          type: string
        quote_asset_id:
          type: string
          description: Hyperliquid uses USDT except for HYPE and PURR, which use USDC.
          examples:
          - USDT
          - USDC
        collateral_asset_id:
          type: string
        settlement_asset_id:
          type:
          - string
          - 'null'
        native_quantity_unit:
          type: string
          enum:
          - base_asset
          - contracts
        contract_multiplier:
          type:
          - string
          - 'null'
          description: Exact decimal string, or null when no authoritative conversion exists.
        status:
          type: string
          enum:
          - active
          - inactive
          - closed
          - delisted
          - unknown
        isolated_only:
          type:
          - boolean
          - 'null'
          description: Null when the venue does not publish an authoritative mode.
        max_leverage:
          type:
          - string
          - 'null'
          description: Exact decimal string when published by the venue.
        price_increment:
          type:
          - string
          - 'null'
          description: Exact venue price increment; null when not established.
        size_increment:
          type:
          - string
          - 'null'
          description: Exact venue quantity increment; null when not established.
        metadata:
          $ref: '#/components/schemas/PublicInstrumentMetadata'

  /sports/upcoming-events:
    get:
      operationId: getSportsUpcomingEvents
      summary: Upcoming (not-yet-live) sports events within a time window
      description: Resolves the target league slugs from `category` (expands to every league in that catalog
        category), else `league` (single slug), else `series` (comma-separated slugs), else every catalog
        slug. Fetches Polymarket events for the resolved series and Kalshi events for supported sports
        concurrently, filtering to events whose actual `gameStartTime` falls in `[now, now+windowHours]`.
        Cross-matches Kalshi events to Polymarket events by date-scoped title/abbreviation matching;
        matched Kalshi sides become a `matchingMarkets` provider entry, unmatched ones are appended
        as standalone events. Also cross-matches Predict.fun. Annotates combo eligibility on primary
        markets where available. Responses are briefly cached; returns 502 if every upstream fetch
        fails.
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: windowHours
        in: query
        required: false
        description: Look-ahead window, in hours, for upcoming game start times.
        schema:
          type: integer
          minimum: 1
          maximum: 720
          default: 24
        example: 24
      - name: category
        in: query
        required: false
        description: Sports-catalog category id (e.g. "basketball"). Expands to every league slug in that
          category and takes priority over league/series.
        schema:
          type: string
        example: basketball
      - name: league
        in: query
        required: false
        description: Single league slug filter (e.g. "nba"). Used only if category is not supplied or
          does not resolve.
        schema:
          type: string
        example: nba
      - name: series
        in: query
        required: false
        description: Comma-separated league slugs. Used only if neither category nor league resolves.
        schema:
          type: string
        example: nba,nhl
      - name: limitPerSeries
        in: query
        required: false
        description: Maximum number of events fetched per resolved series.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 12
        example: 12
      responses:
        '200':
          description: 'Upcoming events within the window, plus matched cross-provider markets. Returns
            `{"events": [], "matchingMarkets": {}}` on a genuine no-data result.'
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30, s-maxage=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsUpcomingEventsResponse'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '502':
          description: All upstream event-source fetches failed while building a cold cache entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: All upstream fetches failed
  /sports/futures:

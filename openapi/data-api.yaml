      - name: trade_limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        description: Max trades to fetch per page.
      - name: trade_offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Offset for trade pagination.
      - name: provider

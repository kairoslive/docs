        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /sports/poly-kalshi-pairings:
    get:
      operationId: getSportsPolyKalshiPairings
      summary: Live game pairings between Polymarket and Kalshi
      description: 'Cross-references currently-live Polymarket games against currently-live Kalshi
        games, grouped by a Kalshi-league -> Polymarket-sport crosswalk and matched via a multi-step
        heuristic (ticker-code match, team-name/alias substring match, derived-code prefix match, letter-subset
        fallback). **Price scale note:** Kalshi market prices in the `kalshiMarkets` array are rescaled
        to a 0-100 range (not the 0-1 scale used elsewhere in this API) to match a legacy response
        shape. Falls back to a recent last-known-good snapshot if the live Kalshi data is unavailable.

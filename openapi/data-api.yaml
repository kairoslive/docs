    SportsLiveEvent:
      type: object
      required:
      - gameId
      - sport
      - homeTeam
      - awayTeam
      - homeScore
      - awayScore
      - status
      - period
      - elapsed
      - live
      - ended
      - slug
      - matchingSlug
      - ts
      - urgencyScore
      - stale
      - primaryMarket
      - marketsCount
      - timing
      properties:
        timing:
          $ref: '#/components/schemas/SportsTiming'
        gameId:
          type: string
          example: '12345678'
        sport:
          type: string
          description: Lowercased league abbreviation.
          example: nba
        homeTeam:
          type: string
          example: Boston Celtics
        awayTeam:
          type: string
          example: Los Angeles Lakers
        homeScore:
          type: integer
          description: Series score if the game has one, else the game score.
          example: 88
        awayScore:
          type: integer
          example: 91
        status:
          type: string
          example: live
        period:
          type:
          - string
          - 'null'
          example: Q4
        elapsed:
          description: Opaque provider clock string; direction, period resets, and overtime semantics are not verified.
          nullable: true
          example: 02:14
        live:
          type: boolean
        ended:
          type: boolean
        slug:
          type:
          - string
          - 'null'
          example: nba-lal-bos-2026-01-15
        matchingSlug:
          type:
          - string
          - 'null'
          description: Slug used as the key into matchingMarkets.
          example: nba-lal-bos-2026-01-15
        ts:
          type: string
          format: date-time
          description: Game-state observation timestamp; source observation time when available, otherwise time received by Kairos.
          example: '2026-07-22T23:14:05Z'
        urgencyScore:
          type: integer
          description: Candidate-ranking heuristic for fresh games explicitly in play. Zero for stale,
            stopped, ended, unknown-status, and schedule-only games. Not a remaining-time signal.
          example: 160
        stale:
          type: boolean
          description: True for state older than 120 seconds, invalid or future timestamps,
            timestamps without a timezone, or absence of a live score feed. Evaluated at timing.evaluatedAt.
        primaryMarket:
          oneOf:
          - $ref: '#/components/schemas/SportsNormalizedMarket'
          - type: 'null'
        marketsCount:
          type: integer
          example: 6
        markets:
          type: array
          description: Present only when include_markets=true.
          items:
            $ref: '#/components/schemas/SportsNormalizedMarket'
    SportsTiming:
      type: object
      description: Conservative timing evidence. Polymarket elapsed is not normalized to remaining time.
        Predict.fun schedule windows do not establish live score freshness. Consumers must age
        stateAgeSeconds from evaluatedAt because responses can be cached.
      required:
      - source
      - status
      - clock
      - clockDirection
      - clockRunning
      - periodRemainingSeconds
      - gameRemainingSeconds
      - overtime
      - stateAgeSeconds
      - evaluatedAt
      - staleAfterSeconds
      - stale
      - usableForLateGame
      - unavailableReason
      properties:
        source:
          type: string
          enum: [polymarket, predictfun]
        status:
          type: string
          enum: [scheduled, live, break, overtime, shootout, suspended, delayed, postponed, cancelled, final, unknown]
        clock:
          type: [string, 'null']
        clockDirection:
          type: string
          enum: [unknown]
        clockRunning:
          type: [boolean, 'null']
          description: Currently null; running state is not established.
        periodRemainingSeconds:
          type: [number, 'null']
          description: Currently null; do not derive this from elapsed without verified clock semantics.
        gameRemainingSeconds:
          type: [number, 'null']
          description: Currently null; overtime and eventual completion cannot be inferred from regulation time.
        overtime:
          type: [boolean, 'null']
          description: True for explicit OT or extra-time evidence, false for regulation final FT,
            otherwise null. Completion after overtime is not active overtime.
        stateAgeSeconds:
          type: [number, 'null']
          minimum: 0
        evaluatedAt:
          type: string
          format: date-time
        staleAfterSeconds:
          type: integer
          const: 120
        stale:
          type: boolean
        usableForLateGame:
          type: boolean
          const: false
          description: No authoritative countdown is currently available from these sources.
        unavailableReason:
          type: string
          enum: [unknown_clock_semantics, missing_clock, game_not_in_play, stale_state, invalid_timestamp, no_live_score_feed]
    SportsNormalizedMarket:
      type: object
      description: Upstream market normalized into a common shape used across the live-events, event-markets,
        and upcoming-events endpoints.
      required:
      - id
      - question
      - slug
      - conditionId
      - tokenId
      - outcomePrices
      - outcomes
      - volumeNum
      - liquidityNum
      - acceptingOrders
      - sportsMarketType
      - groupItemTitle
      - bestBid
      - bestAsk
      - spread
      - provider
      - image
      - icon
      properties:
        id:
          type: string
          example: '587234'
        question:
          type: string
          example: Will the Celtics win?
        slug:
          type: string
          example: nba-lal-bos-2026-01-15-bos
        conditionId:
          type: string
          example: 0xabc123...
        tokenId:
          type: string
          description: First clobTokenId for the market.
          example: 10897234...
        outcomePrices:
          type: array
          items:
            type: number
            format: double
          example:
          - 0.6
          - 0.4
        outcomes:
          type: array
          items:
            type: string
          example:
          - 'Yes'
          - 'No'
        volumeNum:
          type: number
          format: double
          example: 128432.1
        liquidityNum:
          type: number
          format: double
          example: 42311.0
        acceptingOrders:
          type: boolean
        sportsMarketType:
          type:
          - string
          - 'null'
          example: moneyline
        groupItemTitle:
          type:
          - string
          - 'null'
          example: Celtics
        gameStartTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Scheduled fixture kickoff used for cross-provider live-game matching.
        bestBid:
          type:
          - number
          - 'null'
          format: double
          example: 0.59
        bestAsk:
          type:

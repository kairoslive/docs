    SportsKalshiLiveData:
      type: object
      description: 'Live game-state block. Always includes homePoints, awayPoints, lastPlay, status. The
        remaining fields vary by milestone type: soccer_tournament_multi_leg adds statusText/half/time;
        esports_match adds format/currentMap; hockey_tournament adds period/periodRemaining; basketball_game
        adds period/periodType/periodRemaining/possession; baseball_game adds inning/inningHalf/balls/strikes/outs/bases;
        football_game adds quarter/clock/down/yardsToFirst/yardline/possessionTeamId.'

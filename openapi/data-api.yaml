        yesPositionId:
          type: string
          example: 10897234...
        noPositionId:
          type: string
          example: 10897235...
        slug:
          type: string
          example: nba-lal-bos-2026-01-15-bos
        title:
          type: string
          example: Celtics -4.5
        tags:
          type: array
          items:

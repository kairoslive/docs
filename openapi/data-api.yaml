          $ref: '#/components/responses/DataRateLimited'
  /sports/live-events:
    get:
      operationId: getSportsLiveEvents
      summary: Active sports games with urgency scores and cross-provider prices
      description: 'Returns active game IDs plus, when the provider indexing gate has `predictfun`
        enabled, open Predict.fun fixtures inside their scheduled start/end window. The gate is
        re-checked on every request (including cache hits); a gate lookup failure excludes Predict.fun
        (fail closed) without dropping Polymarket/Kalshi rows. Hydrates current state, drops ended
        games idle for more than a few minutes, and computes an `urgencyScore`/`stale` flag per game.
        Enriches each event with cached primary-market data, falling back to a live provider lookup
        when the cache is cold. Resolves each event''s matching Polymarket/Kalshi slug and attaches the
        corresponding cross-venue match record into `matchingMarkets`. If no matched entry anywhere
        carries a Kalshi side, synthesizes one from a team-name-matching fallback lookup. Results are
        sorted by most-recent update, then by `urgencyScore` descending. Responses are cacheable.'
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: include_markets
        in: query
        required: false
        description: When true, includes the full markets list (not just the primary market) for every
          event.
        schema:
          type: boolean
          default: false
        example: false
      responses:
        '200':
          description: Active games ordered by recency then urgency, plus their matched cross-provider
            markets.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=10, s-maxage=10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsLiveEventsResponse'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /sports/event-markets:
    get:
      operationId: getSportsEventMarkets
      summary: All markets for a single sports event
      description: Resolves markets for one game. If `game_id` is given, tries a cached lookup first,
        falling back to a live Polymarket lookup on a miss. If only `slug` is given, first resolves
        the event's `gameId` via a live Polymarket lookup, then performs the same event-markets lookup.

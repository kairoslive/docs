      required:
      - id
      - creator
      - mod
      properties:
        id:
          type: string
          example: usr_polymarket_884211
        creator:
          type: boolean
          description: Whether this user record has market-creator privileges.
        mod:
          type: boolean
          description: Whether this user record has moderator privileges.
    TraderSearchProfile:
      type: object
      description: Public trader profile fields returned by the upstream provider.
      required:
      - displayUsernamePublic
      - verifiedBadge
      - users
      properties:
        proxyWallet:
          type: string
          nullable: true
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        name:
          type: string
          nullable: true
          example: Jane Trader
        pseudonym:
          type: string
          nullable: true
          example: QuietFalcon-2201
        bio:
          type: string
          nullable: true
          example: Macro and elections.
        profileImage:
          type: string
          nullable: true
          example: https://cdn.polymarket.com/avatars/jane.png
        xUsername:
          type: string
          nullable: true
          example: janetrades
        verifiedBadge:
          type: boolean
        displayUsernamePublic:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
          example: '2023-11-02T18:20:44Z'
        users:
          type: array
          items:
            $ref: '#/components/schemas/TraderSearchUserInfo'
    TraderSearchResponse:
      type: object
      description: |
        Result of a trader-profile search. `profile` is null (with `error` populated) when the provider found no profile for the address.
      required:
      - provider
      - address
      - profile
      - error

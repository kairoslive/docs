        when the combo eligibility store has data for the leg's marketId; when the store is empty, legs are
        left unannotated (no eligibility keys at all, not `false`). Predict.fun legs always set
        combo eligibility to false. Responses are briefly cached, keyed by `slug`.
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 60/minute
      x-kairos-bucket: sports
      parameters:
      - name: slug
        in: query
        required: true
        description: Polymarket or Predict.fun game/event slug.
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: nba-lal-bos-2026-01-15
      responses:
        '200':
          description: Polymarket and/or Predict.fun markets grouped into sections of pill/ladder
            market families.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsGameMarketsResponse'
        '401':

  /matched-markets/enriched:
    get:
      operationId: getEnrichedMatchedMarkets
      summary: Matched markets with identifiers, outcomes, and current reference prices
      description: 'Returns the same verified, live-filtered pair catalog as `/matched-markets`,
        with `details` and `pricing` attached to both sides. Unsupported markets, missing quotes,
        and individual venue failures produce `pricing: null` without changing pair membership or
        pagination. Prices use each venue''s API scale and are reference prices, not executable bids
        or asks. The page is capped at 150 pairs to bound request cost. Responses are not cacheable.'
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 60/minute
      x-kairos-bucket: sports
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of enriched pairs to return.
        schema:
          type: integer
          minimum: 1
          maximum: 150
          default: 50
        example: 50
      - name: offset
        in: query
        required: false
        description: Legacy pagination offset. Do not combine with cursor.
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: cursor
        in: query
        required: false
        description: Opaque keyset cursor. Send an empty value on the first page, then pass each
          response next_cursor. A 409 requires restarting the walk.
        schema:
          type: string
          maxLength: 16384
        example: ''
      - name: provider
        in: query
        required: false
        description: Filter to pairs where either side belongs to this provider.
        schema:
          type: string
        example: polymarket
      - name: min_similarity
        in: query
        required: false
        description: Minimum similarity, clamped server-side to at least 0.82.
        schema:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          default: 0.82
        example: 0.85
      - name: sort_by
        in: query
        required: false
        description: Offset-mode sort column. Cursor mode orders by canonical pair identity.
        schema:
          type: string
          enum:
          - similarity
          - updated_at
          default: similarity
      - name: include_total
        in: query
        required: false
        description: Include the total matching-pair count under pre-live filters.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of verified pairs with details and best-effort reference pricing.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsEnrichedMatchedMarketsResponse'
        '400':
          description: Unknown provider, invalid cursor/sort, or cursor combined with a non-zero offset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '403':
          $ref: '#/components/responses/DataForbidden'
        '409':
          description: The catalog changed during a cursor walk; restart with an empty cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '503':
          description: Matched-market or enrichment data could not be loaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /matched-markets:
    get:
      operationId: getMatchedMarkets
      summary: Paginated catalog of verified cross-venue matched markets
      description: 'Returns embedding-verified cross-venue market matches (verified matches only),
        joined against market metadata for display (title, ticker, images, expiry, status).
        `min_similarity` is clamped server-side to never go below a minimum threshold regardless of
        what the caller passes. Pairs are dropped if either correlation side has expired, if either side
        references a provider that is unknown or not currently indexing-enabled, or if either side''s resolved market status is
        settled/closed/resolved; a side with no metadata available (unmirrored rather than de-indexed)
        is kept with null display fields. `has_more` reflects whether the underlying page (before the
        live-status post-filter) was full, so it is not a strict function of the returned
        `count`/`pairs` length. `total` is only computed (filters applied before the live-status
        post-filter) when `include_total=true`. This is treated as a primary, non-additive endpoint:
        any backend failure returns 503 rather than a degraded/empty result.'
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 60/minute
      x-kairos-bucket: sports
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of pairs to return.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
        example: 50
      - name: offset
        in: query
        required: false
        description: Legacy pagination offset. Do not combine with cursor.
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: cursor
        in: query
        required: false
        description: Opaque keyset cursor. Send an empty value on the first page, then pass each
          response next_cursor. Cursor mode orders by immutable canonical pair identity so catalogue
          mutations cannot shift page boundaries, and binds every page to one full-set fingerprint.
        schema:
          type: string
          maxLength: 16384
        example: ''
      - name: provider
        in: query
        required: false
        description: Filter to pairs where either side belongs to this provider. Must resolve to a known
          provider name (case-insensitive) or the request fails with 400.
        schema:
          type: string
        example: polymarket
      - name: min_similarity
        in: query
        required: false
        description: Minimum embedding similarity score. Always clamped up server-side to a minimum
          threshold even if a lower value is supplied.
        schema:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          default: 0.82
        example: 0.85
      - name: sort_by
        in: query
        required: false
        description: Sort column. Must be "similarity" or "updated_at"; any other value fails with 400.
        schema:
          type: string
          enum:
          - similarity
          - updated_at
          default: similarity
        example: similarity
      - name: include_total
        in: query
        required: false
        description: When true, runs an additional COUNT query and includes the total matching-pair count
          in the response.
        schema:
          type: boolean
          default: false
        example: false
      responses:
        '200':
          description: A page of verified cross-venue matched market pairs.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsMatchedMarketsResponse'
        '400':
          description: Unknown provider name, or sort_by is not one of the supported columns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Unknown provider 'foo'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '409':
          description: The correlation catalogue changed during a cursor walk. Discard accumulated
            pages and restart with an empty cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '503':
          description: The correlation store could not be queried.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Correlation store unavailable
  /arb-bets/:
    get:
      operationId: getArbOpportunities
      summary: Cross-venue arbitrage opportunities from the Arb Bets feed
      description: |
        Server-side proxy to the Arb Bets vendor feed, called with a Kairos-held key so the credential never reaches a client. Fixed vendor parameters: $100 investment, 1.0% minimum profit. The body is the vendor's payload passed through unchanged — Kairos does not normalize it, and its shape is owned by the vendor. Note the **trailing slash**: the route is registered at `/arb-bets/`, and `/arb-bets` redirects.
      tags:
      - Markets
      x-kairos-auth: session
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      responses:
        '200':
          description: Vendor payload, passed through.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArbBetsResponse'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: No Arb Bets key is configured on this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: Arb Bets API key not configured
        '503':
          description: Kairos' vendor credential was rejected upstream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: Arb Bets is down right now. Please check back later.
        default:
          description: Any other upstream failure is passed through with the vendor's status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: 'Arb Bets API error: 502'
  /market-clusters:
    get:
      operationId: getMarketClusters
      summary: Cross-venue cluster membership for a set of markets
      description: |
        Resolves each `<provider_id>:<market_id>` reference to its equivalence cluster at the requested tier floor and returns the cluster's other live members. Members listed on a venue whose indexing is switched off, or whose status is settled/closed/resolved, are excluded; a reference whose cluster keeps fewer than two live members after that filter is omitted from the response entirely. Membership is capped at 32 per cluster, with `truncated` and the stored `size` stating what was left out.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 60/minute
      x-kairos-bucket: sports
      parameters:
      - name: markets
        in: query
        required: true
        description: Comma-separated `<provider_id>:<market_id>` references, max 200. Only the first
          colon separates the two parts, so market ids may themselves contain colons. Unparseable and
          duplicate references are dropped silently.
        schema:
          type: string
        example: 1:0x1234abcd,2:KXNBA-26JAN15-LAL
      - name: floor
        in: query
        description: Tier floor to resolve membership at.
        schema:
          type: string
          enum:
          - exact
          - semantic
          default: exact
      responses:
        '200':
          description: Cluster membership keyed by the requested reference.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketClustersResponse'
        '400':
          description: Unknown `floor`, no parseable `<provider_id>:<market_id>` reference, or more
            than 200 references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '503':
          description: The cluster store could not be queried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: Cluster store unavailable
  /txodds/fixtures:
    get:
      operationId: listTxoddsFixtures
      summary: List sports fixtures with live status and win probabilities
      description: |
        Fixture board backed by the TxODDS score event store. Kick-off bounds are snapped to the minute — `from_ms` rounds down and `to_ms` rounds up, so the window may extend up to 59s past what was asked for. Per-row status is computed at cache time from feed phase plus wall clock, so a live-status flip can lag by up to one cache TTL. Concurrent misses on the same page share a single build.
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: competition_id
        in: query
        description: Restrict to one competition.
        schema:
          type:
          - integer
          - 'null'
      - name: sport
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - soccer
          - usfootball
      - name: from_ms
        in: query
        description: Kick-off lower bound, epoch milliseconds. Rounded down to the minute.
        schema:
          type:
          - integer
          - 'null'
      - name: to_ms
        in: query
        description: Kick-off upper bound, epoch milliseconds. Rounded up to the minute. When both
          bounds are given the span may not exceed 400 days.
        schema:
          type:
          - integer
          - 'null'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        description: Bounded so deep paging cannot mint unlimited cache keys.
        schema:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
      responses:
        '200':
          description: One page of fixtures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxoddsFixtureList'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          description: |
            Parameter validation failed — unknown `sport`, out-of-range `limit`/`offset`, `from_ms` greater than `to_ms`, or a window wider than 400 days. The inverted/oversized-window cases return the plain `{"detail": "..."}` envelope, not the field-list envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: from_ms must not exceed to_ms
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /txodds/fixtures/{fixture_id}:
    get:
      operationId: getTxoddsFixture
      summary: Score, timeline, and possession metrics for one fixture
      description: |
        Full detail for a single fixture: scoreline, event timeline, and possession-derived metrics. Independent parts are read concurrently and degrade individually — a part that fails is returned in its empty shape rather than failing the response, and the degraded payload is cached for a shorter time than a clean one. Possession metrics are soccer-only; `usfootball` fixtures carry their situational state in `football` instead.
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: fixture_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          exclusiveMaximum: 9223372036854775808
        example: 4821993
      responses:
        '200':
          description: Fixture detail, possibly degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxoddsFixtureDetail'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '404':
          description: No such fixture. Misses are cached, so a repeated probe for an unknown id does
            not reach the store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: fixture 4821993 not found
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /txodds/fixtures/{fixture_id}/timeseries:
    get:
      operationId: getTxoddsFixtureTimeseries
      summary: Win-probability history and market read for one fixture
      description: |
        The odds-derived curves for a fixture, split out from the detail because they read a table orders of magnitude larger than the score store. Both parts degrade independently: a failed win-probability read returns an empty history, a failed market read returns null projections, and a degraded payload gets a shorter cache TTL. Otherwise the TTL follows kick-off and the last sample.
      tags:
      - Sports
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: fixture_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          exclusiveMaximum: 9223372036854775808
        example: 4821993
      responses:
        '200':
          description: Win-probability samples and the current market read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxoddsFixtureTimeseries'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '404':
          description: No such fixture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'

      operationId: getSportsCatalog
      summary: Enriched catalog of sport categories and leagues
      description: Returns a static 14-category taxonomy (basketball, american-football, hockey, baseball,
        soccer, tennis, ufc, boxing, golf, motorsport, cricket, chess, esports) with each league enriched
        with its resolved Polymarket `seriesId`. `tagId` is a hardcoded constant (100639) shared by
        every league. A small slug alias table (`elc` -> `efl`, `mma` -> `ufc`) is applied for the

  /sports/tournament-bracket:
    get:
      operationId: getSportsTournamentBracket
      summary: Tournament bracket with live cross-provider prices per tie
      description: 'Builds a tournament bracket for `league`. Bracket structure and results are sourced
        from third-party sports-data providers depending on the league. Each tie/match is enriched
        with live prices from Polymarket, Kalshi (authenticated API), and Predict.fun where a

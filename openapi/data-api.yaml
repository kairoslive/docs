      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: include_total
        in: query
        description: Include a best-effort `meta.total` (falls back to the filtered count if any rows
          were dropped by visibility filtering).
        schema:
          type: boolean
          default: false

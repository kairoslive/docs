        Returns a paginated page of a wallet's fills, served independently of the full profile as the fast path for the History tab. Reads only trade rows (plus market-title enrichment) — it deliberately skips the heavier positions/inventory and PnL-summary computations used by the full profile build. Each trade carries the realized PnL booked by that fill (populated for SELLs; BUYs report null/0). **Public endpoint — no authentication required** (trader data is public). Rate-limited per client IP at 60 requests/minute. Responses are cacheable at the edge.
      parameters:
      - name: wallet_address
        in: path

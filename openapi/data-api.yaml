        address:
          type: string
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        profile:
          allOf:
          - $ref: '#/components/schemas/TraderSearchProfile'
          nullable: true
        error:
          type: string
          nullable: true

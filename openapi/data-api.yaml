      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: provider
        in: query
        schema:
          type: string
      - name: provider_id
        in: query
        description: Legacy alias for `provider`.
        schema:
          type: string
      - name: tags
        in: query
        description: Repeatable platform-tag-slug filter.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: statuses
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - relevance
          - volume_24h
          - newest
          - ending_soon

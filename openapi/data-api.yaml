            Wallet-wide PnL totals as of the last hourly snapshot. Returns a zeroed payload (not a 404) when the underlying PnL pipeline is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlWalletTotalsResponse'
        '400':
          description: Missing/oversized `wallet`, or `provider_id` is not a valid MV-pipeline provider

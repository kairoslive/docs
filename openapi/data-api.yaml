        halves:
          type: array
          items:
            $ref: '#/components/schemas/SportsGameMarketFamily'
        playerProps:
          type: array
          items:
            $ref: '#/components/schemas/SportsGameMarketFamily'
        moreMarkets:
          type: array
          items:
            $ref: '#/components/schemas/SportsGameMarketFamily'
        exactScore:
          type: array
          items:
            $ref: '#/components/schemas/SportsGameMarketFamily'
        corners:
          type: array
          items:
            $ref: '#/components/schemas/SportsGameMarketFamily'
    SportsGameMarketFamily:
      type: object
      description: A market family from one venue. layout=pills carries a flat legs list; layout=ladder
        carries spread/total rungs grouped by line value. Polymarket families may be combo-eligible;
        Predict.fun families never are.
      required:
      - key
      - title
      - section
      - layout
      - provider
      - mergeKey
      - volume
      properties:
        key:
          type: string
          example: moneyline
        title:
          type: string
          example: Moneyline
        section:
          type: string
          enum:
          - gameLines
          - halves
          - playerProps
          - moreMarkets
          - exactScore
          - corners
        layout:
          type: string
          enum:
          - pills
          - ladder
        provider:
          type: string
          enum:
          - polymarket
          - predictfun
          description: Venue for every market in this family.
        mergeKey:
          type: string
          description: Opaque server-assigned identity for equivalent families across venues. Group pill
            families by this value rather than inferring identity from titles.
          example: moneyline
        volume:
          type: number
          format: double
        kind:
          type: string
          enum:
          - spread
          - total
          description: Only present when layout=ladder.
        legs:
          type: array
          description: Only present when layout=pills.
          items:
            $ref: '#/components/schemas/SportsGameMarketLeg'
        rungs:
          type: array
          description: Only present when layout=ladder.
          items:
            $ref: '#/components/schemas/SportsGameMarketRung'
    SportsGameMarketRung:
      type: object
      required:
      - line
      - legs
      properties:
        line:
          type:
          - number
          - 'null'
          format: double
          example: 220.5
        legs:
          type: array
          items:
            $ref: '#/components/schemas/SportsGameMarketLeg'
    SportsGameMarketLeg:
      type: object
      required:
      - label
      - marketId
      - price
      - side
      - outcomeKey
      properties:
        label:
          type: string
          example: Celtics -4.5
        marketId:
          type: string
          example: '587234'
        price:
          type: number
          format: double
          minimum: 0
          exclusiveMaximum: 1
          description: Probability-scale price. Predict.fun may return 0 when an open market has no usable
            quote; 0 is unavailable pricing, not an executable price.
          example: 0.52
        side:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: Contract side represented by this leg. Select the matching position ID for combos;
            a no-side leg must use noPositionId.
        outcomeKey:
          type: string
          description: Opaque server-assigned identity for equivalent outcome rows across venues.
          example: team:boston celtics
        comboEligible:
          type: boolean
          description: Present only when eligibility is known. Predict.fun legs always set false; an absent
            field means unknown, not false.
        yesPositionId:
          type:
          - string
          - 'null'
          description: Present when eligibility is known. Use only for side=yes.
        noPositionId:
          type:
          - string
          - 'null'
          description: Present when eligibility is known. Use only for side=no.
    SportsComboMarketsResponse:
      type: object
      required:
      - markets
      properties:
        markets:
          type: array
          items:

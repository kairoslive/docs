          - number
          - 'null'
    TxoddsMetrics:
      type: object
      description: Possession-derived metrics. Empty shapes for gridiron fixtures, which emit no
        possession events, and for any part that failed while the rest of the detail loaded.
      required:
      - avgPossessionHome
      - avgPossessionAway
      - momentum
      - conversion
      - turnover
      properties:
        avgPossessionHome:
          type:
          - number
          - 'null'
        avgPossessionAway:
          type:
          - number
          - 'null'
        momentum:
          type: array
          items:
            $ref: '#/components/schemas/TxoddsMomentumPoint'
        conversion:
          $ref: '#/components/schemas/TxoddsConversion'
        turnover:
          $ref: '#/components/schemas/TxoddsTurnover'
    TxoddsFootballDown:
      type: object
      required:
      - number
      - yardsToGo
      - possession
      properties:
        number:
          type: integer
        yardsToGo:
          type: integer
        yardsToEndzone:
          type:
          - integer
          - 'null'
        possession:
          type: string
    TxoddsFootballPeriodScore:
      type: object
      required:
      - period
      - home
      - away
      properties:
        period:
          type: string
        home:
          type: integer
        away:
          type: integer
    TxoddsFootballState:
      type: object
      description: US-football situational state. Present only when `sport` is `usfootball`.
      required:
      - homePoints
      - awayPoints
      - touchdowns
      - fieldGoals
      - periodScores
      properties:
        homePoints:
          type: integer
        awayPoints:
          type: integer
        touchdowns:
          type: array
          items:
            type: integer
        fieldGoals:
          type: array
          items:
            type: integer
        onePointConversions:
          type: array
          items:
            type: integer
        twoPointConversions:
          type: array
          items:
            type: integer
        safeties:
          type: array
          items:
            type: integer
        periodScores:
          type: array
          items:
            $ref: '#/components/schemas/TxoddsFootballPeriodScore'
        down:
          oneOf:
          - $ref: '#/components/schemas/TxoddsFootballDown'
          - type: 'null'
        clockSeconds:
          type:
          - integer
          - 'null'
        clockRunning:
          type: boolean
          default: false
        redZone:
          type: boolean
          default: false
        phase:
          type: string
          default: ''
    TxoddsFixtureDetail:
      type: object
      description: Everything the match detail view renders, from the score event store.
      required:
      - fixtureId
      - competitionId
      - competition
      - home
      - away
      - kickoff
      - status
      - score
      - timeline
      - metrics
      properties:
        fixtureId:
          type: integer
        competitionId:
          type: integer
        competition:
          type: string
        home:
          $ref: '#/components/schemas/TxoddsTeamRef'
        away:
          $ref: '#/components/schemas/TxoddsTeamRef'
        kickoff:
          type: integer
        status:
          type: string
        sport:
          type: string
          default: soccer
        football:
          oneOf:
          - $ref: '#/components/schemas/TxoddsFootballState'
          - type: 'null'
        score:
          $ref: '#/components/schemas/TxoddsScoreStats'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TxoddsTimelineEvent'
        metrics:
          $ref: '#/components/schemas/TxoddsMetrics'
    TxoddsWinProbSample:
      type: object
      required:
      - ts
      - minute
      - home
      - draw
      - away
      properties:
        ts:
          type: integer
        minute:
          type: integer
        home:
          type: number
        draw:
          type: number
        away:
          type: number
    TxoddsMarketRead:
      type: object
      required:
      - expectedGoals
      - supremacyHome
      - projHome
      - projAway
      properties:
        expectedGoals:
          type:
          - number
          - 'null'
        supremacyHome:
          type:
          - number
          - 'null'
        projHome:
          type:
          - number
          - 'null'
        projAway:
          type:
          - number
          - 'null'
    TxoddsFixtureTimeseries:
      type: object
      description: Odds-derived curves, split out from the detail because they read a table orders of
        magnitude larger than the score store.
      required:
      - fixtureId
      - winProbHistory
      - marketRead
      properties:
        fixtureId:
          type: integer
        winProbHistory:
          type: array
          items:
            $ref: '#/components/schemas/TxoddsWinProbSample'
        marketRead:
          $ref: '#/components/schemas/TxoddsMarketRead'
    ArbBetsStrategy:
      type: object
      description: The two-leg bet the vendor scored as best for this opportunity.
      properties:
        combination:
          type: string
        platform_1:
          type: string
        side_1:
          type: string
          enum:
          - Yes
          - No
        price_1:
          type: number
        bet_amount_1:
          type: number
        payout_1:
          type: number
        platform_2:
          type: string
        side_2:
          type: string
          enum:
          - Yes
          - No
        price_2:
          type: number
        bet_amount_2:
          type: number
        payout_2:
          type: number
        total_prob:
          type: number
          description: Combined implied probability. Below 1 is what makes the pair an arb.
        gross_profit:
          type: number
        net_profit:
          type: number
        roi_percent:
          type: number
        fees:
          type: number
    ArbBetsOpportunity:
      type: object
      properties:
        kalshi_id:
          type: string
        poly_clob_token_ids:
          type: array
          items:
            type: string
        market_name_a:
          type: string
        market_name_b:
          type: string
        platform_a:
          type: string
        platform_b:
          type: string
        url_a:
          type: string
        url_b:
          type: string
        volume_a:
          type: number
        volume_b:
          type: number
        best_arbitrage:
          $ref: '#/components/schemas/ArbBetsStrategy'
    ArbBetsResponse:
      type: object
      description: |
        Vendor payload, passed through unchanged. Fields are documented as observed — the vendor owns this shape and can change it without a Kairos deploy.
      properties:
        success:
          type: boolean
        generated_at:
          type: string
        investment_amount:
          type: number
        min_profit_filter:
          type: number
        total_markets_analyzed:
          type: integer
        total_arbitrages_found:
          type: integer
        markets_skipped:
          type: integer
        skip_reasons:
          type: object
          additionalProperties:
            type: integer
        profitable_count:
          type: integer
        profitable_arbitrages:
          type: array
          items:
            $ref: '#/components/schemas/ArbBetsOpportunity'
  responses:
    DataUnauthorized:
      description: |
        No valid credential presented — missing/invalid API-key headers, or an invalid/expired session token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataError'
          example:
            detail: Not authenticated
    DataValidationError:
      description: Request failed FastAPI parameter validation.
      content:
        application/json:
          schema:
            type: object
            required:
            - detail
            properties:
              detail:
                type: array
                description: One entry per failed field, with location, message, and error type.
                items:
                  type: object
                  additionalProperties: true
    DataForbidden:
      description: |
        Authenticated but not permitted. Three distinct causes: the session user is not invited
        (`Invite required`), the API key lacks the operation's scope, or API-key access to the
        requested venue is switched off (`API access is disabled for <provider>`). Admin and API-key
        callers bypass the invite check; session and admin callers bypass scope and venue checks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataError'
          example:
            detail: Invite required
    DataRateLimited:
      description: |
        Rate limit exceeded for this route's sliding window, keyed on the session `sub` when
        authenticated and on the trusted client IP otherwise. Honor `Retry-After`. A per-API-key
        data ceiling (set per credential) rejects with `{"detail": "API key data rate limit
        exceeded"}` instead of the `error` envelope below.
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Rate limit exceeded: 100 per 1 minute'
    DataPayloadTooLarge:
      description: |
        Request body exceeded the 8 MiB service-wide cap, refused before the handler ran.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataError'
          example:
            detail: Request body too large
paths:
  /perpetuals/venues:
    get:
      operationId: listPerpetualVenues
      summary: List perpetual venue capabilities
      description: |
        Returns the supported perpetual venue identifiers and their public-data
        capabilities. This is metadata owned by the Python Data API. It does not
        serve books, trades, candles, funding observations, or WebSocket data.

        This preview exists only in Kairos staging. When the preview flag is
        disabled, the route fails closed with 404. Live REST snapshots are served
        separately by the Market Data API; anonymous WebSocket transport is served by
        `websocket_cpp`.
      tags:
      - Perpetuals
      x-kairos-auth: public
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      security: []
      servers:
      - url: https://staging-data.kairos.trade
        description: Staging preview only
      parameters: []
      responses:
        '200':
          description: Canonical venue capability records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerpetualVenueCapabilities'
        '404':
          description: The staging preview is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: Perpetual metadata is disabled
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /perpetuals/instruments:
    get:
      operationId: listPerpetualInstruments
      summary: Discover perpetual instruments
      description: |
        Returns strict canonical instrument metadata, optionally for one venue.
        Financial values are exact decimal strings or null; consumers must not
        invent a contract multiplier, tick, or leverage value when one is absent.
        Results are cached independently per venue for 60 seconds.

        This endpoint owns discovery and instrument rules only. Fetch live market
        state from the Market Data API's REST snapshot endpoint and real-time transport from
        `websocket_cpp`. This preview exists only in Kairos staging and returns
        404 when disabled.
      tags:
      - Perpetuals
      x-kairos-auth: public
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      security: []
      servers:
      - url: https://staging-data.kairos.trade
        description: Staging preview only
      parameters:
      - name: venue
        in: query
        required: false
        description: Restrict discovery to one canonical venue.
        schema:
          $ref: '#/components/schemas/PerpetualVenue'
      responses:
        '200':
          description: Canonical perpetual instrument records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerpetualInstrument'
        '404':
          description: The staging preview is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: Perpetual metadata is disabled
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '502':
          description: Venue metadata was unavailable or failed strict validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
              example:
                detail: Perpetual venue metadata is unavailable or invalid
  /markets/active:
    get:
      operationId: listActiveMarkets
      summary: Enumerate active markets for a provider (MMC cursor page)
      description: |
        Returns one cursor-paginated page of the active-market snapshot for a single provider. If the upstream listing is unavailable or the lookup otherwise fails, the route responds `503 Service Unavailable` ("Active market snapshot is temporarily unavailable") rather than fabricating an empty page — this can also happen for an exchange whose listing isn't ready yet. The response echoes back the validated/lowercased `provider` and a `source` field. `next_cursor` is opaque — pass it back verbatim as `cursor` to fetch the next page; `has_more: false` / `next_cursor: null` marks the last page.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: market_data
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
          default: polymarket
        description: |
          Provider/exchange id. Must be an active, known provider or the request is rejected with 400.
        example: polymarket
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 100
        example: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
        description: Opaque pagination cursor from a previous page's `next_cursor`.
      responses:
        '200':
          description: One page of active markets for the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsActivePageResponse'
        '400':
          description: Unknown/inactive provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Invalid provider: foobar'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '503':
          description: No active-market listing is ready for this provider yet, or the upstream
            lookup failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Active market snapshot is temporarily unavailable
  /markets/details:
    post:
      operationId: getMarketDetails
      summary: Fetch market details (name/category/status/ids)
      description: |
        Looks up market details for the given `(market_id, provider_id)` pairs. The `market_id` in the request is matched against `market_id` OR `condition_id` OR `token_id` — any identifier works. Markets with an empty/missing `market_id` in the request are silently dropped before querying. Unmatched markets are simply absent from the response — there is no `found: false` sentinel here (contrast with `/markets/metadata/batch`). Hard cap: 500 markets per request.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketsDetailsRequest'
            example:
              markets:
              - market_id: KXBTC15M-26JUL221600-00
                provider_id: 1
              - market_id: 0x1234abcd...ef
                provider_id: 2
      responses:
        '200':
          description: Matched market details (unmatched inputs are simply omitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsDetailsResponse'
        '400':
          description: Missing/empty `markets` array, or more than 500 markets requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '413':
          $ref: '#/components/responses/DataPayloadTooLarge'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Query failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Failed to fetch details
  /markets/batch-prices:
    post:
      operationId: batchFetchMarketPrices
      summary: Batch fetch current prices for multiple markets
      description: |
        Fetches current price/volume/liquidity for up to 300 `(market_id, provider_id)` pairs. Results are cached briefly. Every reference must contain a non-empty market identifier and a known integer `provider_id`; an invalid reference rejects the request. A provider with no batch-price support is skipped (its markets are simply absent from the response, not an error). Response is a flat object keyed by the requested `market_id` — no top-level wrapper.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: market_data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketsBatchPricesRequest'
            example:
              markets:
              - market_id: KXBTC15M-26JUL221600-00
                provider_id: 1
              - market_id: 0x1234abcd...ef
                provider_id: 2
      responses:
        '200':
          description: Prices keyed by the requested `market_id`. Markets that could not be priced are
            simply absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsBatchPricesResponse'
        '400':
          description: Missing/empty `markets` array, malformed market reference, unknown provider, or more than 300 markets requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '413':
          $ref: '#/components/responses/DataPayloadTooLarge'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Upstream provider fetch failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Batch fetch failed
  /markets/tick-size:
    get:
      operationId: getMarketTickSize
      summary: Get a market's current valid tick grid
      description: |
        Reports the same authoritative tick grid the order executor validates against — this endpoint never snaps or rounds a price, it only describes the grid. Behavior is provider-specific:
          * **polymarket** — a single flat tick over `[0, 1]` (Polymarket
            flips 0.01↔0.001 at the 0.96/0.04 extremes). Without `asset_id`,
            if the grid can't otherwise be resolved, this can return 502.
          * **kalshi** — the market's tapered `price_ranges` grid (`min_tick`
            = finest step). If only the deprecated flat `tick_size` field is
            available (Kalshi removed `price_ranges` for some markets
            2026-05-07), returns a single flat range with `synthetic: true`.
          * **predictfun** — has no per-market dynamic tick endpoint or tick
            change event. Returns `supported: false` with a `reason` string —
            no grid is ever fabricated. This is a 200, not an error.
        `start`/`end`/`step`/`min_tick` are Decimal strings to avoid float precision loss. Any other provider is rejected with 400 — only kalshi/polymarket/predictfun are supported.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: market_data
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
        description: kalshi, polymarket, or predictfun (must be an active provider).
        example: kalshi
      - name: contract_id
        in: query
        required: true
        schema:
          type: string
        description: Market/condition id — Kalshi ticker or Polymarket condition id.
        example: KXBTC15M-26JUL221600-00
      - name: asset_id
        in: query
        required: false
        schema:
          type: string
        description: Polymarket CLOB token/asset id. Enables per-token tick resolution and is required
          for the CLOB fallback path.
      responses:
        '200':
          description: Resolved tick grid, or predict.fun's explicit unsupported payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsTickSizeResponse'
        '400':
          description: Invalid/unknown provider, empty `contract_id`, or a provider with no per-market
            tick grid registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '502':
          description: Both the primary lookup and the direct venue fallback failed to resolve
            a tick (network error, non-2xx, or missing grid fields).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Could not resolve tick size: Kalshi market KXFOO has neither price_ranges
                      nor tick_size'
  /markets/metadata:
    get:
      operationId: getMarketMetadata
      summary: Get full market metadata (rules, images, contract spec)
      description: |
        Returns the full metadata document for one market. Resolution order: (1) a fast cached-metadata path — for Polymarket, a cache hit derives status/category/images from the cached upstream payload; (2) on a miss, falls back to a live provider-API fetch (Kalshi ticker + event metadata for images; Polymarket; Opinion; predict.fun) — this covers markets too new to be indexed yet (e.g. short-lived 15-minute crypto markets); (3) if the cache hit is non-null but carries **empty** `resolution_rules` (both `primary` and `secondary` blank), an extra provider-API call backfills `resolution_rules` (and `description` if also empty) without discarding the rest of the cached document. Only the cached-metadata path populates `condition_id`/`event_id`/`contract.settlement_ts` — the live provider-API fallback leaves those `null`. Finally, for `polymarket`/`predictfun`, a best-effort liquidity-rewards enrichment mutates `extra` in place (never blocks or fails the response): Polymarket sets `extra.clobRewards` (`[{rewardsDailyRate}]` or `[]`), `extra.rewardsMaxSpread`, `extra.rewardsMinSize`; predict.fun sets `extra.rewards.current` (an active reward-window object, or `null`). 404 only if no source has the market at all.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: ticker
        in: query
        required: true
        schema:
          type: string
        description: Market ticker/ID.
        example: KXBTC15M-26JUL221600-00
      - name: provider
        in: query
        required: true
        schema:
          type: string
        description: kalshi or polymarket (also accepts any other active provider — e.g. predictfun,
          opinion — via the API fallback path).
        example: polymarket
      responses:
        '200':
          description: Full market metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsMetadataResponse'
        '400':
          description: Invalid/unknown provider, or a downstream `ValueError`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '404':
          description: Market not found in cached metadata or any provider API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Market not found: KXFOO-99'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Metadata lookup failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Metadata fetch failed
  /markets/metadata/batch:
    post:
      operationId: getMarketMetadataBatch
      summary: Batch fetch market metadata for multiple contracts
      description: |
        Batch variant of `/markets/metadata`, capped at 100 contracts. Contracts whose provider is currently inactive are dropped before processing; if that empties the batch the response is `{}`. Looks up the rest via a cached-metadata fast path, with a fallback for cache misses and non-Polymarket providers. Unless `titles_only: true` is set, three further best-effort enrichment passes run (each independently swallows its own errors and never fails the request):
          1. **API fallback** — any contract still `found: false` is retried
             against the live provider API (same fallback `/markets/metadata`
             uses), for markets too new to be indexed.
          2. **Category inference** — markets with no `category` get one
             inferred from Kalshi crypto ticker patterns or crypto keywords
             in the title (bitcoin/ethereum/solana/xrp/"btc "/"eth "/"sol ").
          3. **Tag icon enrichment** — resolves market-to-platform-tag
             mappings and assigns the highest-precedence tag's icon as
             `tag_icon`; can also backfill `category` from the tag's slug
             (crypto/politics/sports/esports/finance/tech/world).
        Note: Polymarket order-book liquidity-rewards enrichment (used by the single-market `/markets/metadata`) is intentionally **not** run here — this endpoint feeds list views where the rewards badge doesn't render.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketsBatchMetadataRequest'
            example:
              contracts:
              - ticker: KXBTC15M-26JUL221600-00
                provider: kalshi
              - ticker: 0x1234abcd...ef
                provider: polymarket
              titles_only: false
      responses:
        '200':
          description: 'Metadata items keyed by the requested ticker. Every requested ticker (whose provider
            wasn''t hidden) appears, with `found: false` for unresolved ones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsBatchMetadataResponse'
        '400':
          description: Missing/empty `contracts` array, or more than 100 contracts requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '413':
          $ref: '#/components/responses/DataPayloadTooLarge'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Metadata lookup failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Batch fetch failed
  /markets/outcomes:
    get:
      operationId: getMarketOutcomes
      summary: Get all sibling outcomes for the event containing a market
      description: |
        Returns every outcome in the event that `market_id` belongs to (for multi-outcome / grouped markets), served from a cache of pre-computed event/market lookups. Any identifier (market_id, token_id, condition_id, symbol, slug) is mapped to its `event_id`; if that misses, falls back to the per-market entry's embedded `event_id`, then to deriving a Kalshi-style event ticker by stripping the last `-SEGMENT` off `market_id` (e.g. `KXPGATOUR-THGI26-SSTR` → `KXPGATOUR-THGI26`). If no event can be resolved at all and `provider=polymarket`, falls back to a live Polymarket lookup — guarding against a known upstream quirk that can silently return an unrelated default result instead of an empty list. Non-Polymarket providers get no such fallback — an unresolvable event returns the empty shape. `all_ids` (comma-separated, ≤200 ids, each ≤128 chars) additionally resolves `event_groups` — a map from every supplied id (and every sibling id discovered while resolving events) to its `event_id`, used by the frontend to dedupe sibling contracts across dropdowns. **Price scale note:** unlike most of this API, outcome prices here are returned as a **0–1 decimal probability**, not the platform's usual 0–100 cents scale.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: market_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
        description: Market ID / ticker / token_id / slug. Non-empty after trimming, ≤128 chars.
        example: KXPGATOUR-THGI26-SSTR
      - name: provider
        in: query
        required: true
        schema:
          type: string
        description: Provider name; must be an active provider.
        example: kalshi
      - name: all_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated list of additional contract ids (≤200 items, each ≤128 chars) to
          resolve into `event_groups` for dropdown deduplication.
      responses:
        '200':
          description: Event outcomes for the market, or the empty shape if no event could be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsOutcomesResponse'
        '400':
          description: Invalid/unknown provider, empty `market_id`, an oversized identifier, or too many
            `all_ids`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /markets/crypto:
    get:
      operationId: getCryptoMarkets
      summary: Get 5m/15m/1h crypto up-or-down prediction markets for a window
      description: |
        Returns the crypto up/down markets (BTC/ETH/SOL/XRP on Kalshi + Polymarket, plus DOGE/HYPE/BNB and predict.fun on some intervals) for one time window. `window_offset` shifts by whole windows of the chosen `interval` (0=current, -1=previous, +1=next, etc.). Responses are cached so UI "previous/next window" navigation doesn't repeatedly re-fetch from upstream. Past windows are immutable and cached longer; future/current windows are refreshed more often since they're still filling in. A window is only cached once it has enough data from both venues; past windows relax that requirement for Kalshi, since Kalshi removes settled contracts from its API. **Price scale note:** `price` is a raw **0–1 decimal** probability read/derived directly from each venue's order book — NOT the platform's usual 0–100 cents scale.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: market_data
      parameters:
      - name: interval
        in: query
        required: false
        schema:
          type: string
          enum:
          - 5m
          - 15m
          - 1h
          default: 15m
        example: 15m
      - name: window_offset
        in: query
        required: false
        schema:
          type: integer
          minimum: -10000
          maximum: 10000
          default: 0
        description: Number of windows from current (0=now, -1=previous, +1=next). Bounded so an absurd
          offset is rejected with 422 rather than overflowing the window arithmetic.
        example: 0
      responses:
        '200':
          description: Crypto markets for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsCryptoResponse'
        '400':
          description: Invalid `interval` (must be 5m, 15m, or 1h).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Invalid interval: 30m. Must be one of: [''15m'', ''1h'', ''5m'']'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Upstream fetch (Kalshi/Polymarket/predict.fun) failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Failed to fetch crypto markets
  /markets/crypto/oracle-history:
    get:
      operationId: getOraclePriceHistory
      summary: Get historical oracle (spot) prices for crypto chart pre-population
      description: |
        Returns per-symbol resolution-price history over `[end_ms - minutes*60*1000, end_ms]`
        (`end_ms` defaults to now; clamped to now if a future value is given). Each request
        names **one** oracle `source` so settlement feeds are never mixed. Symbols must be
        the wire ids for that source (bare `btc-usd` for Binance;
        `btc-usd-polymarket-chainlink`, `btc-usd-kalshi-cfb`, `btc-usd-hyperliquid-mark`,
        or a `-polymarket-twap30`/`-polymarket-twap60` suffix for venue series). When
        `source` is omitted, it is inferred from the wire symbols — mixed sources are
        rejected. Only Binance gaps may be backfilled from Binance REST; every other
        source returns an empty array for a missing span. Responses are cached briefly.
        The internal store can lag real time by a few seconds.
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: market_data
      parameters:
      - name: symbols
        in: query
        required: true
        schema:
          type: string
        description: |
          Comma-separated, case-insensitive wire symbols for a single source.
          Logical assets are btc-usd, eth-usd, sol-usd, xrp-usd, doge-usd, hype-usd,
          bnb-usd; venue sources append their suffix (for example
          `btc-usd-polymarket-chainlink`). Kalshi CF Benchmarks supports only
          btc-usd and eth-usd.
        example: btc-usd
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - binance
          - hyperliquid_mark
          - kalshi_cfbenchmarks
          - polymarket_chainlink
          - polymarket_twap30
          - polymarket_twap60
        description: |
          Resolution feed identity. Omit only for legacy clients that encode the
          source in the wire symbol; new callers should pass it explicitly.
        example: binance
      - name: minutes
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1440
          default: 10
        description: Minutes of history to fetch (max 24h).
      - name: full_resolution
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Return raw 1-second history without downsampling.
      - name: end_ms
        in: query
        required: false
        schema:
          type: integer
        description: End timestamp in epoch ms (clamped to server "now"). Omit for the live edge. Used
          for chunked/paginated backward loading.
      responses:
        '200':
          description: Price-history points per symbol, sorted ascending by timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsOracleHistoryResponse'
        '400':
          description: |
            No symbols given, unknown `source`, symbols that do not belong to the
            requested source, mixed-source inference failure, or a non-positive
            `end_ms`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /markets/crypto/ptb:
    get:
      operationId: getCryptoPriceToBeat
      summary: Get Price-to-Beat (PTB) values for crypto up/down contracts
      description: |
        Returns the oracle price captured at the start of each requested window
        ("the price to beat"), nested `{window: {symbol: {...}}}`. `windows` is
        comma-separated; each must be one of `1m, 5m, 15m, 1h, 4h, 1d`. Window
        starts align to clean ET boundaries. Only **window** PTB sources are
        accepted: `binance`, `kalshi_cfbenchmarks`, `polymarket_twap30`,
        `polymarket_twap60`. Contract-tick series (`polymarket_chainlink`,
        `hyperliquid_mark`) are not window benchmarks and are rejected. When
        `source` is omitted, the server picks Binance or a legacy TWAP series
        from the `oracle_twap_feed` flag. Binance may fall back to an external
        market-data source for missing symbols; venue series do not. Symbols
        with no resolvable price for a window are **omitted** (not `null`).
      tags:
      - Markets
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: market_data
      parameters:
      - name: windows
        in: query
        required: false
        schema:
          type: string
          default: 15m
        description: Comma-separated windows. Each must be one of 1m, 5m, 15m, 1h, 4h, 1d.
        example: 5m,15m
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - binance
          - kalshi_cfbenchmarks
          - polymarket_twap30
          - polymarket_twap60
        description: |
          ET-aligned window source. New market clients should pass this
          explicitly. TWAP30 remains for legacy 1m overlays.
        example: kalshi_cfbenchmarks
      responses:
        '200':
          description: PTB values nested by window then symbol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsPtbResponse'
        '400':
          description: No windows given, or an invalid window value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Invalid window: 30m. Must be one of: [''15m'', ''1d'', ''1h'', ''1m'', ''4h'',
                      ''5m'']'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Oracle store/source lookup failed for one or more windows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Failed to fetch price-to-beat values
  /markets/equity/snapshot:
    get:
      operationId: getEquitySnapshot
      summary: Get last-known prices for equity/forex/commodity symbols
      description: |
        Returns last-known prices for a fixed allow-list of stock, ETF, forex, and commodity symbols (e.g. AAPL, SPY, EURUSD, XAUUSD), mapped internally to their upstream tickers. A request is served straight from cache only if every requested symbol is already cached. Otherwise, missing symbols are fetched and merged into the existing cache, and only the newly-fetched subset is returned with `cached: false` — symbols already warm in the cache are NOT re-included in that response body (the endpoint returns either the full cached hit set with `cached: true`, or just the freshly-fetched symbols with `cached: false`, never a merge of both in one response). Returns prices even when markets are closed (uses the last regular-session print) so the UI is never blank outside trading hours. **Auth differs from every other endpoint in this router**: this accepts a first-party session JWT (`Authorization: Bearer ...`) or an internal admin credential — it does **not** accept the `X-Client-Id`/`X-Api-Key`/ `X-Api-Secret` API-key headers that the rest of `/markets/*` accepts.
      tags:
      - Markets
      x-kairos-auth: session
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: market_data
      security:
      - bearerAuth: []
      parameters:
      - name: symbols
        in: query
        required: true
        schema:
          type: string
        description: |
          Comma-separated symbols (case-insensitive, upper-cased server-side). Must be a subset of: AAPL, TSLA, MSFT, GOOGL, AMZN, META, NVDA, NFLX, PLTR, OPEN, RKLB, ABNB, COIN, HOOD, SPY, QQQ, EWY, VXX, EURUSD, GBPUSD, USDCAD, USDJPY, USDKRW, XAUUSD, XAGUSD, WTI, CC, NGD.
        example: AAPL,TSLA,EURUSD
      responses:
        '200':
          description: Last-known prices for the requested symbols.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsEquitySnapshotResponse'
        '400':
          description: No symbols given, or a symbol outside the supported allow-list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Invalid symbol: DOGEUSD. Must be one of: [...]'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /candles:
    get:
      operationId: getCandles
      summary: Fetch OHLCV candles for a single contract
      tags:
      - Candles
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: candles
      description: |
        Returns OHLCV candle bars for one `(provider, contract_id, outcome)` series over `[start, end)`, bucketed at `timeframe_seconds`.

        **Auth**: accepts an admin secret (`X-Admin-Secret`), an API key (`X-Client-Id` + `X-Api-Key` + `X-Api-Secret`), or a first-party JWT (`Authorization: Bearer` or `turnkey_session_jwt` cookie). No API-key scope is required for this endpoint — any valid credential can read candles.

        **Cache / data source**: responses may be served from cache unless `rebuild=true`, which always bypasses the cache and reconstructs candles from the underlying trade/candle data, then repopulates the cache. `rebuild=true` is for callers that explicitly want fresh data regardless of what's cached.

        **Validation** (all return 400): unknown `provider` (must exist in the live provider registry — currently includes `kalshi`, `polymarket`, `dome`, `opinion`); empty or >128-char `contract_id`; `timeframe_seconds` not one of the fixed allowed values; unparseable `start`/`end` (ISO 8601); or `end <= start`. An `outcome` index invalid for the given provider/contract (e.g. an out-of-range index on a binary market) also returns 400.
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
        description: |
          Venue identifier, matched case-insensitively against the live provider registry (e.g. `kalshi`, `polymarket`). Unknown providers return 400.
        example: kalshi
      - name: contract_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Provider-specific contract/market/token identifier. Whitespace is trimmed; empty
          or >128 chars returns 400.
        example: KXPRESPOLAND-24-DT
      - name: timeframe_seconds
        in: query
        required: true
        schema:
          type: integer
          enum:
          - 1
          - 60
          - 300
          - 900
          - 3600
          - 14400
          - 86400
        description: |
          Candle bucket width in seconds. FastAPI first enforces `>= 1`; the handler then rejects any value not exactly one of `[1, 60, 300, 900, 3600, 14400, 86400]` (1s, 1m, 5m, 15m, 1h, 4h, 1d) with 400.
        example: 60
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Window start, ISO 8601 (any offset; normalized to UTC internally). Unparseable values
          return 400.
        example: '2026-07-21T00:00:00Z'
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Window end, ISO 8601. Must be strictly after `start` (400 otherwise).
        example: '2026-07-22T00:00:00Z'
      - name: outcome
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
        description: |
          Zero-based outcome index for multi-outcome markets. Omitted/null is treated as `0` (the first/primary outcome). An index invalid for the contract's outcome count returns 400.
      - name: rebuild
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, bypasses the cache and forces a fresh fetch/rebuild.
      responses:
        '200':
          description: OHLCV series for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlesSeriesResponse'
        '400':
          description: |
            Invalid request — unknown provider, invalid/missing contract_id, disallowed timeframe_seconds, unparseable or out-of-order start/end, or an outcome index invalid for this contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Invalid timeframe. Must be one of: [1, 60, 300, 900, 3600, 14400, 86400]'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Candle fetch failed (cache or ClickHouse read error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /candles/batch:
    post:
      operationId: postCandlesBatch
      summary: Fetch candles for up to 200 contracts in one request
      tags:
      - Candles
      x-kairos-auth: api-key
      x-kairos-rate-limit: 200/minute
      x-kairos-bucket: candles
      description: |
        Batched form of `GET /candles`. Accepts up to 200 per-contract requests and returns results in the same order, index-tagged.

        **Auth**: same as `GET /candles` — `require_auth_or_admin_or_apikey`, no scope required.

        **Cache / data source**: each item is checked against the cache in parallel first; only uncached items are fetched fresh. Items with `rebuild: true` always skip the cache regardless of a hit.

        **Fail-fast, partial-failure semantics**: an empty series for an item is returned as `"candles": []` (not an error) — the client renders an empty chart and expects later bars via the live WebSocket feed; there is no server-side ingestion retry. If fetching fails for some items but others were already served from cache, those cached items are still returned; every failed item instead gets `"candles": [], "error": "<message>"` so the client can distinguish a genuine failure from a legitimately empty window. Only if **no** item could be served at all does the whole request fail with 500.

        **Validation** (all 400): body must contain a JSON array under `requests` (or the legacy alias `items`); the array must be non-empty and at most 200 items; each item must be an object with `provider`, `contract_id`, `timeframe_seconds`, `start`, and `end` present; the same per-field checks as `GET /candles` apply per item (unknown provider, invalid contract_id, disallowed timeframe, unparseable/out-of-order timestamps, negative or non-integer `outcome`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandlesBatchRequest'
            example:
              requests:
              - provider: kalshi
                contract_id: KXPRESPOLAND-24-DT
                timeframe_seconds: 60
                start: '2026-07-21T00:00:00Z'
                end: '2026-07-22T00:00:00Z'
                outcome: 0
                rebuild: false
              - provider: polymarket
                contract_id: 0xabc123...token
                timeframe_seconds: 3600
                start: '2026-07-15T00:00:00Z'
                end: '2026-07-22T00:00:00Z'
      responses:
        '200':
          description: |
            Index-ordered results, one per request item. A failed item carries an `error` string and an empty `candles` array instead of a 5xx for the whole batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlesBatchResponse'
        '400':
          description: |
            Malformed batch — `requests` missing/not an array/empty/over 200 items, or a specific item is malformed (missing required field, unknown provider, invalid contract_id, disallowed timeframe_seconds, unparseable/out-of-order start/end, non-integer or negative outcome).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Max 200 requests
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '413':
          $ref: '#/components/responses/DataPayloadTooLarge'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Every request in the batch failed; nothing could be served from cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /trades/kalshi:
    get:
      operationId: getKalshiTrades
      summary: Proxy Kalshi's public trade-history API for one market
      tags:
      - Trades
      x-kairos-auth: api-key
      x-kairos-scope: trade:read
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      description: |
        Thin proxy over Kalshi's `GET /trade-api/v2/markets/trades`, with a short-lived cache and Kairos-computed metrics appended.

        **Auth**: requires the `trade:read` scope. Admin-secret and first-party JWT callers are always allowed through with no scope check. API-key callers must have `trade:read` in their credential's `scopes` array, or this returns 403 (`API key missing required scope: trade:read`). API-key callers are additionally gated by the `kalshi` platform's API access being enabled — if it's disabled, this returns 403 regardless of scope.

        **Cache / data source**: responses are cached briefly to de-duplicate bursts of identical requests, then fall through to the live Kalshi API at `https://api.elections.kalshi.com/trade-api/v2/markets/trades`. A Kalshi HTTP error (non-2xx or network failure) returns 502.

        **Response shape**: the raw Kalshi API response object is returned unmodified except for an injected `metrics` field, computed over the *locally time-filtered* trades (filtering by `min_ts`/`max_ts` is done client-side against each trade's `created_time`, since Kalshi's API does not filter server-side beyond `min_ts`/`max_ts` passthrough). The metrics window is fixed at 24 hours regardless of the requested `min_ts`/`max_ts` span.
      parameters:
      - name: ticker
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Kalshi market ticker. Empty or >128 chars returns 400.
        example: KXPRESPOLAND-24-DT
      - name: min_ts
        in: query
        required: false
        schema:
          type: integer
          nullable: true
        description: Inclusive lower bound, Unix seconds, applied both to the upstream request and to
          client-side filtering by `created_time`.
      - name: max_ts
        in: query
        required: false
        schema:
          type: integer
          nullable: true
        description: Inclusive upper bound, Unix seconds, applied both to the upstream request and to
          client-side filtering by `created_time`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Max trades returned, passed through to the upstream Kalshi API.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
          nullable: true
        description: Upstream pagination cursor from a previous response. Blank strings are treated as
          absent; >512 chars returns 400.
      responses:
        '200':
          description: Raw Kalshi trade-history payload plus a computed `metrics` object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesKalshiResponse'
        '400':
          description: Missing/empty `ticker`, or `cursor` too long.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          description: API-key credential lacks the `trade:read` scope, or API access to the `kalshi`
            platform is currently disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'API key missing required scope: trade:read'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '502':
          description: Kalshi's upstream trade-history API returned an error or was unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Kalshi API error
        '503':
          description: Per-venue API-access flag could not be read or validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /trades/polymarket:
    get:
      operationId: getPolymarketTrades
      summary: Proxy Polymarket's public trade-history API for one market
      tags:
      - Trades
      x-kairos-auth: api-key
      x-kairos-scope: trade:read
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      description: |
        Thin proxy over Polymarket's `GET https://data-api.polymarket.com/trades`, with a short-lived cache and Kairos-computed metrics appended.

        **Auth**: identical model to `/trades/kalshi` — requires the `trade:read` scope (admin/JWT bypass the scope check; API keys need `trade:read`), plus API access to the `polymarket` platform being enabled for API-key callers (403 if disabled).

        **Market resolution**: `market` may be a `0x`-prefixed condition ID (used as-is) or a market/token identifier that is resolved to a condition ID via a cached metadata lookup, then a direct database lookup, and finally a live Polymarket API lookup as a last resort. If resolution never yields a value starting with `0x`, the endpoint short-circuits and returns `{"trades": [], "metrics": {}}` **without** calling the upstream trades API.

        **Cache / data source**: responses are cached briefly to de-duplicate bursts of identical requests. On a miss, calls the Polymarket Data API with the resolved `condition_id` as `market`. A non-2xx/network error returns 502.

        **Response shape**: `trades` is the raw upstream trade array (client-side re-filtered by `after` against each trade's `timestamp` as a safety net). `metrics` is computed over the filtered trades with a metrics window fixed at 24 hours; it groups trade value by outcome identifier (`asset_id`/`outcome`/`token_id`) and keeps only the top 2 outcomes by volume as an approximate outcome_0/outcome_1 split — this is an approximation, not a guaranteed yes/no mapping.
      parameters:
      - name: market
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: |
          Polymarket condition ID (`0x...`), market ID, or token ID. Non-`0x` values are resolved to a condition ID before querying upstream. Empty or >128 chars returns 400.
        example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcd'
      - name: after
        in: query
        required: false
        schema:
          type: integer
          nullable: true
        description: Inclusive lower bound, Unix seconds. Passed to upstream and re-applied client-side
          against each trade's `timestamp`.
      - name: before
        in: query
        required: false
        schema:
          type: integer
          nullable: true
        description: Inclusive upper bound, Unix seconds, passed to the upstream API.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Max trades returned, passed through to the upstream Polymarket API.
      responses:
        '200':
          description: |
            Raw Polymarket trades plus computed `metrics`. `metrics` is `{}` when the `market` value could not be resolved to a condition ID (no upstream call was made).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesPolymarketResponse'
        '400':
          description: Missing/empty `market`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          description: API-key credential lacks the `trade:read` scope, or API access to the `polymarket`
            platform is currently disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '502':
          description: Polymarket's upstream trade-history API returned an error or was unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Polymarket API error
        '503':
          description: Per-venue API-access flag could not be read or validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /trades/history:
    get:
      operationId: getTradeHistory
      summary: Fetch normalized, Kairos-ingested trade history for a contract
      tags:
      - Trades
      x-kairos-auth: api-key
      x-kairos-scope: trade:read
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      description: |
        Returns normalized trade history for a single `(provider, contract_id)` from Kairos's own ingested trade store. Unlike `/trades/kalshi` and `/trades/polymarket`, this is not a live upstream proxy — it serves from data Kairos has already ingested, so coverage depends on how much history has been backfilled/streamed for that contract.

        **Auth**: requires the `trade:read` scope (admin/JWT bypass the scope check; API keys need `trade:read`), plus API access to the requested provider being enabled for API-key callers — 403 if disabled.

        **Data source / staleness**: reads ingested trade rows for the window `[before - window_seconds, before]` (or ending "now" if `before` is omitted). If `trigger_ingest=true` and the data is missing or stale, an ingestion job is kicked off for that contract and reported via the `indexing` flag in the response — the returned trades may still be incomplete for that call.
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
        description: Venue identifier, matched case-insensitively against the live provider registry.
        example: kalshi
      - name: contract_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Provider-specific contract identifier. Empty or >128 chars returns 400.
      - name: window_seconds
        in: query
        required: false
        schema:
          type: integer
          minimum: 3600
          maximum: 86400
          default: 86400
        description: Lookback window in seconds, ending at `before` (or now). Clamped to [3600, 86400]
          (1 hour to 24 hours).
      - name: before
        in: query
        required: false
        schema:
          type: integer
          nullable: true
        description: Unix-seconds cursor — return trades at or before this timestamp. Omit to end the
          window at "now".
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          nullable: true
        description: Max trades returned. If omitted, the service applies its own internal default.
      - name: trigger_ingest
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, kicks off ingestion when data for this window is stale or missing, rather
          than just returning what's already stored.
      responses:
        '200':
          description: Normalized trade rows for the window plus pagination/coverage metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesHistoryResponse'
        '400':
          description: Invalid trade history request (unknown provider, invalid contract_id, or a request
            the service itself rejected as malformed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Invalid trade history request
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          description: API-key credential lacks the `trade:read` scope, or API access to the requested
            provider is currently disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Trade history fetch failed on the backend.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Trade history fetch failed
        '503':
          description: Per-venue API-access flag could not be read or validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /trades/metrics:
    get:
      operationId: getTradeMetrics
      summary: Fetch volume and outcome-pressure metrics for a contract
      tags:
      - Trades
      x-kairos-auth: api-key
      x-kairos-scope: trade:read
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      description: |
        Returns aggregate trade metrics (volume, per-outcome volume split, trade count) for a single `(provider, contract_id)` over a lookback window, computed from Kairos's own ingested trade store — same data source as `/trades/history`, not a live upstream proxy. There is no buy/sell-side breakdown: metrics are split by outcome (`outcome_0`/`outcome_1`) rather than trade direction, since trade direction cannot be reliably determined from exchange data for all providers.

        **Auth**: requires the `trade:read` scope (admin/JWT bypass the scope check; API keys need `trade:read`), plus API access to the requested provider being enabled for API-key callers — 403 if disabled.

        **Staleness**: if `trigger_ingest=true` and ingestion coverage for the window is low, the service triggers a backfill/ingestion job and reports it via the `indexing` flag on the returned metrics object.
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
        description: Venue identifier, matched case-insensitively against the live provider registry.
        example: kalshi
      - name: contract_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Provider-specific contract identifier. Empty or >128 chars returns 400.
      - name: window_seconds
        in: query
        required: false
        schema:
          type: integer
          minimum: 3600
          maximum: 86400
          default: 86400
        description: Lookback window in seconds, ending "now". Clamped to [3600, 86400] (1 hour to 24
          hours).
      - name: trigger_ingest
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, triggers ingestion when coverage for this window is low, rather than computing
          metrics from partial/stale data alone.
      responses:
        '200':
          description: Aggregate volume/pressure metrics for the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesMetricsResponse'
        '400':
          description: Invalid trade metrics request (unknown provider, invalid contract_id, or a request
            the service itself rejected as malformed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Invalid trade metrics request
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          description: API-key credential lacks the `trade:read` scope, or API access to the requested
            provider is currently disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Trade metrics fetch failed on the backend.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Trade metrics fetch failed
        '503':
          description: Per-venue API-access flag could not be read or validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
  /trader-stats/pnl-history/{wallet_address}:
    get:
      operationId: getTraderPnlHistory
      summary: Get a trader's realized-PnL time series
      tags:
      - Trader Analytics
      x-kairos-auth: public
      x-kairos-rate-limit: 10/minute
      x-kairos-bucket: heavy
      security: []
      description: |
        Returns a time-series of realized PnL data points for charting a trader's PnL progression over the requested window, bucketed by `time_range`. The wallet address is validated as either an Ethereum (0x...) address (Polymarket/Opinion/predictfun) or a Solana base58 address (Kalshi) and normalized (lower-cased for EVM) before lookup; if it matches neither format the request is rejected with 400. `provider` is optional — if omitted, the provider is auto-detected from the address format; pass it explicitly to disambiguate EVM venues other than Polymarket. Provider values are validated against the live set of active providers rather than a fixed enum, so an inactive/unknown id is rejected with 400. Responses are cacheable at the edge and briefly cached server-side. **Public endpoint — no authentication required.** Rate-limited per client IP (X-Forwarded-For, falling back to the socket peer) at 30 requests/minute, independent of the global 100/minute default.
      parameters:
      - name: wallet_address
        in: path
        required: true
        schema:
          type: string
        description: |
          Ethereum (0x-prefixed, 42 chars) or Solana (base58) wallet address. Normalized (EVM lower-cased) before use. Returns 400 if it matches neither format.
        example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
      - name: time_range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1D
          - 1W
          - 1M
          - ALL
          default: ALL
        description: Time window for the PnL series.
      - name: provider
        in: query
        required: false
        schema:
          type: string
        description: |
          Provider override (e.g. polymarket, kalshi, opinion, predictfun). Validated against the live active-provider registry. Auto-detected from address format when omitted.
        example: polymarket
      responses:
        '200':
          description: PnL time series for the wallet and time range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraderPnlHistoryResponse'
        '400':
          description: Malformed wallet address or unrecognized provider.
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Unexpected error fetching PnL history.
  /trader-stats/positions/{wallet_address}:
    get:
      operationId: getTraderPositions
      summary: Get a trader's open/closed positions and derived performance stats
      tags:
      - Trader Analytics
      x-kairos-auth: public
      x-kairos-rate-limit: 10/minute
      x-kairos-bucket: heavy
      security: []
      description: |
        Returns a trader's positions plus performance metrics computed from a full-inventory scan — served independently of the unified profile so the Positions tab and stats panel can load on their own fetch. Positions are filtered by `status` (open/closed/all), sorted by current value (largest first), and paginated via `limit`/`offset`; `has_more` indicates another page exists in the filtered set. Market names/icons are resolved only for the returned page, so wallets holding a very large number of positions don't blow past internal query limits. `performance` (win rate, total PnL, volume, positions_value, etc.) is always computed over the wallet's FULL inventory, not just the returned page. `include_redeemable` additionally includes resolved positions still awaiting on-chain redemption. **Public endpoint — no authentication required** (trader data is public). Rate-limited per client IP at 30 requests/minute. Responses are cacheable at the edge.
      parameters:
      - name: wallet_address
        in: path
        required: true
        schema:
          type: string
        description: Ethereum or Solana wallet address (validated/normalized as above).
        example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
      - name: include_redeemable
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include resolved positions still waiting for redemption.
      - name: provider
        in: query
        required: false
        schema:
          type: string
        description: Provider override (polymarket, kalshi, opinion, predictfun). Auto-detected if omitted.
        example: polymarket
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
        description: Max positions to return per page (sorted by value, largest first).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Number of positions to skip (pagination).
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - open
          - closed
          default: all
        description: Filter the returned page by position status.
      responses:
        '200':
          description: Positions page plus full-inventory performance stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraderPositionsResponse'
        '400':
          description: Malformed wallet address or unrecognized provider.
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Unexpected error fetching trader positions.
  /trader-stats/trades/{wallet_address}:
    get:
      operationId: getTraderTrades
      summary: Get a trader's recent trade/fill history
      tags:
      - Trader Analytics
      x-kairos-auth: public
      x-kairos-rate-limit: 10/minute

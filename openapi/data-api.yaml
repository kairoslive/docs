        total_cost_basis:
          type: number
          format: double
          example: 8400.0
        winning_positions:
          type: integer
          example: 18
        losing_positions:
          type: integer
          example: 9
    PnlSummary:
      type: object
      description: Merged PnL summary across all providers/wallets supplied for a user.
      required:
      - user_id
      - total_realized_pnl
      - total_fees
      - total_cost_basis
      - total_winning_positions
      - total_losing_positions
      - by_exchange
      properties:
        user_id:
          type: string
          example: usr_9f3c2a1b
        total_realized_pnl:
          type: number
          format: double
          example: 1875.1
        total_fees:
          type: number
          format: double
          example: 18.2
        total_cost_basis:
          type: number
          format: double
          example: 12400.0
        total_winning_positions:
          type: integer
          example: 25
        total_losing_positions:
          type: integer
          example: 11
        by_exchange:
          type: object
          description: Keyed by provider name.
          additionalProperties:
            $ref: '#/components/schemas/PnlExchangeSummary'
    PnlRecord:
      type: object
      description: A single merged PnL record.
      required:
      - provider
      - market_id
      - timestamp
      - realized_pnl
      - fees
      properties:
        provider:
          type: string
          example: polymarket
        market_id:
          type: string
          example: 0xabc123condition
        timestamp:
          type: string
          description: ISO-8601 timestamp string (empty string if the underlying record has no timestamp).
          example: '2026-07-20T09:14:02+00:00'
        realized_pnl:
          type: number
          format: double
          example: 24.15
        fees:
          type: number
          format: double
          example: 0.35
    PnlUserPnlResponse:
      type: object
      description: |
        Full merged PnL response for a user, across the requested wallets/providers.
      required:
      - user_id
      - summary
      - records
      - filters_applied
      properties:
        user_id:
          type: string
          example: usr_9f3c2a1b
        summary:
          $ref: '#/components/schemas/PnlSummary'
        records:
          type: array
          items:
            $ref: '#/components/schemas/PnlRecord'
        filters_applied:
          type: object
          description: Echoes the effective filters used to build this response (wallets, providers, etc.).
          additionalProperties: true
        total:
          type: integer
          default: 0
          description: |
            Count of merged records the aggregator returned before pagination slicing, bounded by the per-provider fetch ceiling (min(limit+offset, 1000)) — not an authoritative full-history count.
          example: 143
        has_more:
          type: boolean
          default: false
          description: True only when the aggregator definitively saw more records than this page returned.
    PnlWalletMarketTokenPnL:
      type: object
      description: Per-token PnL row within a wallet/market hover payload.

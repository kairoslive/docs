        in: query
        required: false
        description: Upstream sports game ID to look up directly.
        schema:
          type: string
        example: '12345678'
      - name: slug
        in: query
        required: false
        description: Polymarket market slug used to discover the event's gameId when game_id is not known.
        schema:
          type: string
        example: nba-lal-bos-2026-01-15-lal
      responses:
        '200':
          description: Markets for the resolved event. `gameId` echoes the resolved id, or falls back
            to the raw `game_id`/`slug` query value ("unknown" if neither was supplied) when nothing could
            be resolved.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=10, s-maxage=10

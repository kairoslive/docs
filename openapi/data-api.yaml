        outcome:
          type: string
          example: 'YES'
        balance:
          type: number
          format: double
          example: 150.0
        avg_entry_price:
          type: number
          format: double
          example: 0.42
        cost_basis_usd:
          type: number
          format: double
          example: 63.0
        realized_pnl_usd:
          type: number
          format: double
          example: 0.0
        mark_price:
          type: number
          format: double
          example: 0.55
        position_value_usd:
          type: number
          format: double
          example: 82.5
        unrealized_pnl_usd:
          type: number
          format: double
          example: 19.5
    PnlWalletMarketPnlResponse:
      type: object
      description: |
        Live hover-on-wallet PnL for a single (wallet, market) pair. Returns a zeroed/empty payload (`tokens: []`) instead of erroring when the underlying PnL pipeline is disabled.
      required:
      - provider_id
      - wallet_address
      - contract_id
      - tokens
      - total_unrealized_pnl_usd
      - total_realized_pnl_usd
      - total_position_value_usd
      properties:
        provider_id:
          type: string
          enum:
          - polymarket
          - opinion
          - predictfun
          example: polymarket
        wallet_address:
          type: string
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        contract_id:
          type: string
          example: 0xabc123condition
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/PnlWalletMarketTokenPnL'
        total_unrealized_pnl_usd:
          type: number
          format: double
          example: 19.5
        total_realized_pnl_usd:
          type: number
          format: double
          example: 0.0
        total_position_value_usd:
          type: number
          format: double
          example: 82.5
    PnlWalletTotalsResponse:
      type: object
      description: |
        Wallet-wide PnL totals across all markets, refreshed hourly. Returns a zeroed payload (`market_count: 0`, `token_count: 0`) instead of erroring when the underlying PnL pipeline is disabled.
      required:
      - provider_id
      - wallet_address
      - total_unrealized_pnl_usd
      - total_realized_pnl_usd
      - total_position_value_usd
      - total_cost_basis_usd
      - market_count
      - token_count
      - snapshot_ts
      properties:
        provider_id:
          type: string
          enum:
          - polymarket
          - opinion
          - predictfun
          example: polymarket
        wallet_address:
          type: string
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        total_unrealized_pnl_usd:
          type: number
          format: double
          example: 340.2
        total_realized_pnl_usd:
          type: number
          format: double
          example: 1250.4382
        total_position_value_usd:
          type: number
          format: double
          example: 980.0
        total_cost_basis_usd:
          type: number
          format: double
          example: 640.0
        market_count:
          type: integer
          example: 12
        token_count:
          type: integer
          example: 19
        snapshot_ts:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the hourly snapshot this data was read from (or the current
            time when native_pnl_pipeline is disabled).
          example: '2026-07-22T13:00:00Z'
    SearchBadRequestError:
      type: object
      description: FastAPI `HTTPException(400)` body shape used across the search router.
      required:
      - detail
      properties:
        detail:
          type: string
          example: 'Invalid provider: acme'
    DiscoverBadRequestError:
      type: object
      description: FastAPI `HTTPException(400)` body shape used across the discover router.
      required:
      - detail
      properties:
        detail:
          type: string
          example: 'Invalid sort_by: bogus. Must be one of: [''liquidity'', ''newest'', ''price'', ''rewards'',
            ''volume'', ''volume_1h'', ''volume_24h'']'
    ProvidersNotFoundError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Provider 'acme' not found
    SearchResult:
      type: object
      description: One market or event row from search results, post provider-visibility
        filtering.
      required:
      - market_id
      - provider_id
      - provider
      - relevance_score
      properties:
        market_id:
          type: string
          example: KXPRES-28-DJT
        provider_id:
          type: integer
          description: Numeric provider id (1=kalshi, 2=polymarket, 3=opinion, 8=predictfun).
          example: 1
        provider:
          type: string
          example: kalshi
        event_id:
          type: string
          nullable: true
        event_name:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: Market title.
        symbol:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          example: open
        expires_at:
          type: string
          format: date-time
          nullable: true
        relevance_score:
          type: number
          description: Composite final score = text_score + business_score - penalty.
        volume_24h:
          type: number
          default: 0
        outcome_label:
          type: string
          nullable: true
        series_key:
          type: string
          nullable: true
          description: Polymarket seriesSlug or Kalshi series_ticker.
        series_title:
          type: string
          nullable: true
        text_score:
          type: number
          default: 0
        business_score:
          type: number
          default: 0
        penalty:
          type: number
          default: 0
          minimum: 0
        price:
          type: number
          nullable: true
        volume_1h:
          type: number
          default: 0
        liquidity:
          type: number
          default: 0
        image:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        type:
          type: string
          enum:
          - event
          nullable: true
          description: Only present (and only ever "event") on rows returned by /search/markets-and-events
            when type=event or both.
    SearchMeta:
      type: object
      properties:
        query:
          type: string
        returned:
          type: integer
          description: Number of rows in `results` after provider-visibility filtering.
        requested:
          type: integer
          description: The `limit` that was requested.
        query_time_ms:
          type: number
        include_expired:
          type: boolean
        provider_id:
          type: string
          nullable: true
          description: Resolved/validated provider filter, or null if none.
    SearchMarketsResponse:
      type: object
      required:
      - results
      - meta
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/SearchMeta'
    SearchMarketsAndEventsMeta:
      type: object
      properties:
        query:
          type: string
        returned:
          type: integer
        requested:
          type: integer
          description: The `limit` that was requested.
        search_type:
          type: string
          enum:
          - market
          - event
          - both
        include_expired:
          type: boolean
        provider_id:
          type: string
          nullable: true
    SearchMarketsAndEventsResponse:
      type: object
      required:
      - results
      - meta
      properties:
        results:
          type: array
          description: Merged market + event rows, sorted by relevance_score descending, truncated to
            limit.
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/SearchMarketsAndEventsMeta'
    SearchEventGroup:
      type: object
      description: One event's outcome markets, grouped server-side.
      required:
      - event_id
      - market_count
      - markets
      properties:
        event_id:
          type: string
        event_name:
          type: string
          nullable: true
        market_count:
          type: integer
          description: Count of markets kept after provider-visibility filtering.
        representative:
          allOf:
          - $ref: '#/components/schemas/SearchResult'
          nullable: true
          description: Falls back to the first remaining market if the original representative's provider
            was filtered out.
        markets:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
    SearchOutcomeRef:
      type: object
      description: One outcome within a classified MarketGroup (interactive ladder).
      properties:
        id:
          type: string
        provider:
          type: string
        title:
          type: string
          nullable: true
        outcomeLabel:
          type: string
          nullable: true
        tokenId:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        op:
          type: string
          nullable: true
          description: Comparison operator this outcome represents on the group's axis, e.g. '>=', '<'.
        value:
          type: number
          nullable: true
          description: Threshold value on the group's axis.
        hi:
          type: number
          nullable: true
          description: Upper bound, for range-shaped outcomes.
    SearchMarketGroup:
      type: object
      description: An "interactive ladder" grouping of related markets (e.g. a set of over/under threshold
        markets on one axis), pre-computed by a background job and served from cache at search
        time.
      required:
      - type
      - groupKey
      - provider
      - outcomes
      properties:
        type:
          type: string
          enum:
          - group
        groupKey:
          type: string
        provider:
          type: string
        title:
          type: string
          nullable: true
        kind:
          type: string
          nullable: true
          description: Classification kind, e.g. threshold ladder.
        axisLabel:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        direction:
          type: string
          nullable: true
        confidence:
          type: number
          description: Rounded to 3 decimal places.
        marketCount:
          type: integer
        category:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        eventId:
          type: string
          nullable: true
        eventTitle:
          type: string
          nullable: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SearchOutcomeRef'
    SearchCorrelationCounterpart:
      type: object
      description: A cross-venue market judged similar (similarity at or above a threshold) to the
        keyed result market_id. Enrichment fields (title/ticker/image/icon/expires_at) are only present
        when the counterpart market's metadata is available; otherwise they're absent.
      required:
      - provider_id
      - market_id
      - similarity
      - method
      properties:
        provider_id:
          type: integer
        market_id:
          type: string
        similarity:
          type: number
          minimum: 0
          maximum: 1
        method:
          type: string
          description: How the correlation was derived, e.g. embedding/manual.
        title:
          type: string
        ticker:
          type: string
        image:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    SearchSimpleMeta:
      type: object
      properties:
        query:
          type: string
        returned:
          type: integer
          description: Count of results after provider-visibility filtering.
        query_time_ms:
          type: number
        total:
          type: integer
          nullable: true
          description: 'Present only when include_total=true. Best-effort: the upstream total if no rows
            were filtered by visibility, else the filtered count.'
    SearchSimpleResponse:
      type: object
      description: Shared envelope for /search/simple and /search/resolve-url. Both always include results/meta;
        groups/singles appear only when the underlying search was grouped (always true for /search/simple
        with group_results=true, and for /search/resolve-url on an event URL). classifiedGroups/absorbedMarketIds
        are only ever attached by /search/simple (group_results=true); /search/resolve-url never sets
        them. correlations is attached by both, best-effort, and absent if no counterpart markets were
        found.
      required:
      - results
      - meta
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SearchEventGroup'
        singles:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/SearchSimpleMeta'
        classifiedGroups:
          type: array
          items:
            $ref: '#/components/schemas/SearchMarketGroup'
        absorbedMarketIds:
          type: array
          items:
            type: string
          description: Market/outcome ids already rendered inside classifiedGroups — the overlay should
            not also render them as standalone rows.
        correlations:
          type: object
          description: Map of result market_id -> up to 4 similar cross-venue counterpart markets, sorted
            by similarity descending.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SearchCorrelationCounterpart'
    SearchSuggestion:
      type: object
      required:
      - text
      - type
      - frequency
      properties:
        text:
          type: string
          description: Suggested query text (market/series/category name).
        type:
          type: string
          description: Suggestion source type, e.g. market, category.
        frequency:
          type: integer
          description: May be an aggregated count, or always 1, depending on how the suggestion
            was generated.
    SearchSuggestResponse:
      type: object
      required:
      - suggestions
      - meta
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SearchSuggestion'
        meta:
          type: object
          properties:
            query:
              type: string
            returned:
              type: integer
    ScreenerMarket:
      type: object
      description: One screener hit — the market, and the outcome the screen matched on. Prices and
        spread are cents; money is dollars.
      required:
      - id
      - marketId
      - provider
      properties:
        id:
          type: string
          description: The id this market's book is published under. For Polymarket that is the
            venue condition id, not the market id search returns — see `marketId`.
        marketId:
          type: string
          nullable: true
          description: The id to address this market by everywhere else — the terminal, the
            market-data websocket, the trades API. Always present, and equal to `id` on every
            venue keyed by its market id. Null only on a Polymarket row the metadata cache could
            not resolve; a null row cannot be opened, and `id` is not a substitute for it.
        provider:
          type: string
        title:
          type: string
          nullable: true
          description: Null when the discover cache has never seen this market, alongside `hasMetadata`
            false. Presenting that — usually as the id — is the client's call.
        eventTitle:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        hasMetadata:
          type: boolean
          description: False when only live numbers are known and the title is the id.
        outcomeIndex:
          type: integer
          nullable: true
          description: The outcome the quote figures below describe.
        matchedLeg:
          type: boolean
          description: True when the screen picked this outcome. False when the screen was contract-level
            only and this is just the primary outcome.
        outcomeName:
          type: string
          nullable: true
        bid:
          type: number
          nullable: true
          description: Cents.
        ask:
          type: number
          nullable: true
          description: Cents.
        mid:
          type: number
          nullable: true
          description: Cents.
        spread:
          type: number
          nullable: true
          description: Cents wide on this outcome; null when it is not quoting both sides.
        price:
          type: number
          description: Cents; the record's headline price.
        volume24h:
          type: number
          description: Dollars.
        volume1h:
          type: number
          description: Dollars.
        liquidity:
          type: number
          description: Dollars resting across every outcome, both sides.
        outcomeLiquidity:
          type: number
          nullable: true
          description: Dollars resting on this outcome alone, both sides.
        bookAgeSeconds:
          type: number
          nullable: true
          description: Seconds since this leg's top of book was published; null when it never has been.
            A large value means nothing is streaming this market.
        openInterest:
          type: number
          description: Contracts.
        openInterestNotional:
          type: number
          description: Dollars.
        updatedAt:
          type: string
          format: date-time
    ScreenerResponse:
      type: object
      required:
      - markets
      - total
      - available
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/ScreenerMarket'
        total:
          type: integer
          description: Matches before paging. **-1** means the ordered walk stopped at the page bound
            and the rest were not counted — render it as "top N", not as a count.
        available:
          type: boolean
          description: False when the live vitals service could not be reached. Distinct from a screen
            that matched nothing, which is available with an empty `markets`.
        plan:
          type: string
          description: How the scan ran (`index_ordered`, `index_range`, `scan`). Diagnostic.
        limit:
          type: integer
        offset:
          type: integer
    ScreenerPreset:
      type: object
      required:
      - id
      - label
      - description
      - params
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        params:
          type: object
          description: Query parameters for /search/screener, including `sort`.
          additionalProperties: true
    ScreenerPresetsResponse:
      type: object
      required:
      - presets
      - sorts
      properties:
        presets:
          type: array
          items:
            $ref: '#/components/schemas/ScreenerPreset'
        sorts:
          type: array
          items:
            type: string
    DiscoverMarketOutcome:
      type: object
      description: One outcome market inside a grouped (isGrouped=true) DiscoverMarket, as returned by
        /api/markets/discover/v2.
      properties:
        id:
          type: string
        ticker:
          type: string
        title:
          type: string
        outcomeLabel:
          type: string
        price:
          type: number
          description: Cents/100.
        volume:
          type: number
        volumeTotal:
          type: number
          description: Same value as volume.
        volume24h:
          type: number
        volume1h:
          type: number
        token_id:
          type: string
          nullable: true
        condition_id:
          type: string
          nullable: true
        rewardRate:
          type: number
    DiscoverMarket:
      type: object
      description: One row of /api/markets/discover/v2's `markets` array. When isGrouped=true this represents
        an event with its outcomes nested (eventTitle + outcomes populated, outcomeLabel/yes_sub_title/
        no_sub_title/token_id/condition_id absent at the top level); when isGrouped=false it's a single
        standalone market (outcomeLabel/ yes_sub_title/no_sub_title/token_id/condition_id populated, eventTitle/outcomes
        absent).
      required:
      - id
      - ticker
      - title
      - price
      - provider
      - status
      - isGrouped
      properties:
        id:
          type: string
        ticker:
          type: string
        event_id:
          type: string
          nullable: true
        eventTitle:
          type: string
          description: Grouped rows only.
        title:
          type: string
        outcomeLabel:
          type: string
          nullable: true
          description: Single (isGrouped=false) rows only.

        pseudonym:
          type: string
          example: SilentOwl-4821
        bio:
          type: string
          example: Prediction market degen.
        asset:
          type: string
          description: Underlying asset identifier for the held token, when the provider supplies one.
        profileImage:
          type: string
          example: https://cdn.polymarket.com/avatars/abc.png
        profileImageOptimized:
          type: string
          example: https://cdn.polymarket.com/avatars/abc-opt.png
    TraderTopHoldersToken:
      type: object
      description: Top holders for a single outcome token.
      required:
      - token
      - holders
      properties:
        token:
          type: string
          description: Outcome token id.
          example: 10723948572...4
        holders:
          type: array
          items:
            $ref: '#/components/schemas/TraderTopHolder'
    TraderTopHoldersResponse:
      type: array
      description: |
        Top holders grouped by outcome token, one entry per requested market/token combination returned by the provider. The endpoint returns this array directly as the response body (not wrapped in an object).
      items:
        $ref: '#/components/schemas/TraderTopHoldersToken'
    TraderSearchUserInfo:
      type: object

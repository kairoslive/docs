        '429':
          $ref: '#/components/responses/DataRateLimited'
  /sports/game-markets:
    get:
      operationId: getSportsGameMarkets
      summary: Cross-venue market families for a single game, grouped by section
      description: Fetches every Polymarket event sibling for the given game slug and groups market
        market families into sections (game lines, halves, player props, more markets, exact score, corners)
        for the game page and parlay builder. Predict.fun fixture slugs can also open a provider-only catalog;
        matched Predict.fun families are appended best-effort and never make the Polymarket catalog fail. Each
        family renders either as flat "pills" (a list of yes/no legs,
        e.g. moneyline/categorical markets) or as a "ladder" (spread/total lines grouped into rungs by line
        value). Opaque `mergeKey` and `outcomeKey` values identify equivalent pill families and outcomes

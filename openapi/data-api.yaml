  /search/screener:
    get:
      operationId: searchScreener
      summary: Find markets by what their book and tape are doing
      tags:
      - Search
      x-kairos-auth: api-key
      x-kairos-rate-limit: 30/minute
      x-kairos-bucket: screener
      description: 'Screens the whole live catalogue by spread, resting depth, rolling volume, open
        interest and price, rather than by text. Numbers are live from the market-vitals cache (sub-second
        book and tape), joined to the discover cache for titles; a market the discover cache has never
        seen is still returned, under its id, with `hasMetadata: false`.


        Prices and spread are in cents, money in dollars. **At least one metric bound is required** —
        an unfiltered screen is a ranking, not a screen, and is rejected with 400.


        `spread` is `ask - bid` on one outcome, and a book with only one side cannot be crossed, so it
        has no spread: any query bounding spread only matches markets quoting both sides. `two_sided`
        asks for that explicitly without bounding the width. Bounds are compared on one canonical price
        scale, so a threshold means the same width on every venue whatever scale that venue publishes.'
      parameters:
      - name: min_spread
        in: query
        description: Cents. Only two-sided books can satisfy a spread bound.
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: max_spread
        in: query
        description: Cents.
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: min_price
        in: query
        description: Cents, on the matched outcome's mid.
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: max_price
        in: query
        description: Cents, on the matched outcome's mid.
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: min_volume_24h
        in: query
        description: Dollars traded in the rolling 24h window.
        schema:
          type: number
          minimum: 0
      - name: min_volume_1h
        in: query
        description: Dollars traded in the rolling 1h window.
        schema:
          type: number
          minimum: 0
      - name: min_liquidity
        in: query
        description: Dollars resting across every outcome, both sides.
        schema:
          type: number
          minimum: 0
      - name: max_liquidity
        in: query
        description: Dollars resting across every outcome, both sides. Pair with a volume floor to find
          thin books carrying heavy flow.
        schema:
          type: number
          minimum: 0
      - name: min_outcome_liquidity
        in: query
        description: Dollars resting on the matched outcome alone, both sides.
        schema:
          type: number
          minimum: 0
      - name: min_open_interest
        in: query
        description: Contracts outstanding.
        schema:
          type: number
          minimum: 0
      - name: two_sided
        in: query
        description: Only markets quoting a bid and an ask. A settled market has no quotes at all, which
          would otherwise read as infinitely thin.
        schema:
          type: boolean
          default: false
      - name: max_book_age_minutes
        in: query
        description: 'Drop markets whose top of book has not been published within this many minutes.
          Settled and delisted markets stop being streamed, so their frozen book would otherwise screen
          as a live quote — on a live catalogue that is more than half the records. `0` removes the bound
          and returns them.


          The timestamp is the streamer''s publish clock, so this detects "nothing is publishing this
          market any more", not "the venue''s book went quiet": a wedged venue connection re-publishing
          a cached book still stamps now.'
        schema:
          type: number
          minimum: 0
          default: 10
      - name: provider
        in: query
        description: Repeatable. Restricts the screen to these venues.
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        schema:
          type: string
          default: volume_24h
          enum:
          - volume_24h
          - volume_1h
          - spread_desc
          - spread_asc
          - liquidity
          - open_interest
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: A page of matching markets, most relevant to the chosen sort first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenerResponse'
        '400':
          description: No metric bound given, an inverted range, an unknown provider or sort, or a query
            the vitals service refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchBadRequestError'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Screener query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'

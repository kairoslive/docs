            application/json:
              schema:
                $ref: '#/components/schemas/SportsEventMarketsResponse'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
  /sports/kalshi-live-games:
    get:
      operationId: getSportsKalshiLiveGames
      summary: Currently-live Kalshi sports games (NHL/NBA/MLB/NFL+UFL/soccer/esports)
      description: 'Returns every Kalshi milestone currently live for the supported milestone types

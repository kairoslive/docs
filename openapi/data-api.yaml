# Kairos Data API (data.kairos.trade) — OpenAPI 3.1 specification.
# Canonical source of truth for this service's public API reference.
#
# Consumers: services/web/scripts/build-openapi.ts publishes it (and the
# other specs in docs/api/) as /openapi/* static assets; the unified docs
# reference at /docs/api-reference renders it with live try-it panels.
#
# When you change this service's public surface, update this file in the
# same PR. Extensions the reference UI renders: x-kairos-auth
# (public | api-key | session), x-kairos-rate-limit, x-kairos-scope.
openapi: 3.1.0
info:
  title: Kairos Data API
  version: 1.0.0
  summary: The full Kairos data plane — markets, candles, trades, search, discover, sports, trader analytics,
    and PnL.
  description: |
    The Kairos Data API at `data.kairos.trade` is the platform's primary data
    plane: market metadata and prices, OHLCV candles, live venue trade proxies,
    normalized trade history, full-text search, discovery feeds, the sports
    catalog, public trader analytics, and account PnL.

    ## Authentication

    Most endpoints accept a Kairos **API key** (`X-Client-Id` + `X-Api-Key` +
    `X-Api-Secret`, all three) or a first-party session JWT. Endpoints tagged
    `public` (trader analytics, provider configs, several sports feeds) need
    no credentials at all. Some endpoints additionally require an API-key
    **scope** (`trade:read`, `position:read`) — stated per operation.

    For high-volume market-data consumption (candles/trades/metadata at
    scale), prefer the dedicated **Market Data API** at `md.kairos.trade` —
    it has higher budgets, ETag caching, and a binary candle format.

    ## Rate limits

    Rate limits use a sliding window keyed on the authenticated user (JWT
    `sub`) or, for anonymous callers, the trusted client IP. Routes belong to
    a named **bucket** (`x-kairos-bucket`) whose per-minute budget is shared
    by every route in it; routes with no bucket run under the service default
    of 100/minute. `x-kairos-rate-limit` states the bucket's compile-time
    default — operators can raise or lower a bucket at runtime, so treat the
    documented number as the baseline, not a contract. 429 responses carry
    `Retry-After` and `X-RateLimit-*`.

    ## Conventions

    - Prices are on the **0–100 cents scale** unless a field says otherwise
      (trader-analytics position/trade prices use the 0–1 scale; each field's
      description states its scale).
    - Errors: `{"detail": "<message>"}` for handler errors; FastAPI's
      standard validation envelope for 422s. Errors surfaced from a venue
      adapter instead use `{"error", "provider", "operation", "message"}` —
      see `DataProviderError`. Unhandled failures always return the generic
      500 body; internal details are logged, never returned.
    - Every request body is capped at 8 MiB service-wide (413).
  contact:
    name: Kairos
    url: https://app.kairos.trade/docs/api-reference
  termsOfService: https://kairos.trade/terms
servers:
- url: https://data.kairos.trade
  description: Production
- url: https://staging-data.kairos.trade
  description: Staging
security:
- apiKeyClientId: []
  apiKeyKey: []
  apiKeySecret: []
components:
  securitySchemes:
    apiKeyClientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: Credential client id (`kairos_ck_...`). Must be sent together with X-Api-Key and X-Api-Secret.
    apiKeyKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 64-char hex API key.
    apiKeySecret:
      type: apiKey
      in: header
      name: X-Api-Secret
      description: 64-char hex API secret.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: First-party Kairos session JWT (web app sessions). Not issued to API consumers.
  schemas:
    DataError:
      type: object
      description: Handler error envelope (FastAPI HTTPException).
      required:
      - detail
      properties:
        detail:
          type: string
          description: Human-readable error message.
          example: Invalid provider
    DataProviderError:
      type: object
      description: |
        Adapter-layer error envelope. Returned instead of `DataError` whenever the failure comes from
        a venue adapter rather than the handler: 400 (validation), 401 (venue auth), 404 (not found),
        429 (venue rate limit), 502 (provider/parse error), 503 (connection error or open circuit).
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Machine-readable class of failure.
          enum:
          - validation_error
          - authentication_failed
          - not_found
          - rate_limit_exceeded
          - provider_error
          - parse_error
          - service_unavailable
        provider:
          type:
          - string
          - 'null'
          description: Venue the adapter was talking to.
          example: kalshi
        operation:
          type:
          - string
          - 'null'
          description: Adapter operation that failed.
        message:
          type: string
          description: Human-readable error message.
    MarketsActivePageResponse:
      type: object
      description: One page of the active-market listing for a provider, with `provider`/`source`
        stamped on by the API.
      required:
      - exchange_id
      - markets
      - count
      - next_cursor
      - has_more
      - provider
      - source
      properties:
        exchange_id:
          type: string
          description: Lower-cased exchange id the market is listed under.
          example: polymarket
        markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketsActiveMarket'
        count:
          type: integer
          description: Number of markets in this page (`markets.length`).
          example: 100
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page, or null if this is the last page.
        has_more:
          type: boolean
        provider:
          type: string
          description: Echo of the validated/lowercased `provider` query param.
          example: polymarket
        source:
          type: string
          description: >-
            Opaque internal origin marker. NOT a stable part of the contract —
            its value may change without notice; do not depend on or switch on it.
    MarketsActiveMarket:
      type: object
      description: One market's cached metadata, including its full upstream `raw`
        payload.
      properties:
        exchange_id:
          type: string
        market_id:
          type: string
        condition_id:
          type: string
        event_id:
          type: string
        title:
          type: string
        neg_risk:
          type: boolean
        tick_size:
          type:
          - number
          - 'null'
        taker_base_fee_bps:
          type:
          - integer
          - 'null'
        fees_enabled:
          type:
          - boolean
          - 'null'
        category:
          type:
          - string
          - 'null'
        group_slug:
          type:
          - string
          - 'null'
        fee_type:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        image:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
        end_date:
          type:
          - string
          - 'null'
        open_time:
          type:
          - string
          - 'null'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MarketsActiveMarketOutcome'
        raw:
          type: object
          additionalProperties: true
          description: Full upstream provider payload as last captured.
        resolution_status:
          type: string
          description: Present only once the market has a resolution status recorded.
        payout_numerators:
          type: array
          items:
            type: integer
          description: Present only once CTF payout numerators are known.
        resolved_ts:
          type: string
        proposed_price:
          type: number
        challenge_window_ends_at:
          type: string
    MarketsActiveMarketOutcome:
      type: object
      properties:
        outcome:
          type: string
          example: 'Yes'
        normalized_outcome:
          type: string
          example: 'yes'
        token_id:
          type: string
        outcome_index:
          type: integer
          description: Present only for exchanges keyed by market_id, index < 2.
        side:
          type: string
          enum:
          - true
          - 'no'
          description: Present only for exchanges keyed by market_id, index < 2.
    MarketsDetailsRequest:
      type: object
      required:
      - markets
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketsDetailsRequestItem'
    MarketsDetailsRequestItem:
      type: object
      required:
      - market_id
      - provider_id
      properties:
        market_id:
          type: string
          description: Matched against market_id OR condition_id OR token_id.
        provider_id:
          type: integer
    MarketsDetailsResponse:
      type: object
      required:
      - markets
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketsDetail'
    MarketsDetail:
      type: object
      required:
      - market_id
      - provider_id
      - event_id
      - name
      - category
      - status
      - condition_id
      - token_id
      - token_ids
      - outcomes
      properties:
        market_id:
          type: string
        provider_id:
          type: integer
        event_id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        condition_id:
          type:
          - string
          - 'null'
        token_id:
          type:
          - string
          - 'null'
        token_ids:
          type: array
          items:
            type: string
          description: Full provider token roster, aligned by index with outcomes.
        outcomes:
          type: array
          items:
            type: string
          description: Outcome labels aligned by index with token_ids.
    MarketsBatchPricesRequest:
      type: object
      required:
      - markets
      properties:
        markets:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/MarketsBatchPricesRequestItem'
    MarketsBatchPricesRequestItem:
      type: object
      required:
      - market_id
      - provider_id
      properties:
        market_id:
          type: string
        provider_id:
          type: integer
    MarketsBatchPricesResponse:
      type: object
      description: Prices keyed by the requested market_id.
      additionalProperties:
        $ref: '#/components/schemas/MarketsPrice'
    MarketsPrice:
      type: object
      required:
      - price
      properties:
        price:
          type: number
          description: Current venue reference price. Scale is venue-dependent and is not normalized.
        volume:
          type:
          - string
          - 'null'
        liquidity:
          type:
          - number
          - 'null'
    MarketsTickSizeResponse:
      oneOf:
      - $ref: '#/components/schemas/MarketsTickSizeResolved'
      - $ref: '#/components/schemas/MarketsTickSizeUnsupported'
      description: A resolved tick grid (kalshi/polymarket) or predict.fun's explicit unsupported payload
        — distinguish by the presence of `ranges`/`supported`.
    MarketsTickSizeResolved:
      type: object
      required:
      - provider
      - contract_id
      - ranges
      - min_tick
      - source
      - synthetic
      properties:
        provider:
          type: string
          enum:
          - kalshi
          - polymarket
        contract_id:
          type: string
        asset_id:
          type:
          - string
          - 'null'
          description: Echoed back only for polymarket; null for kalshi.
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/MarketsTickRange'
          description: Polymarket always has exactly one range covering [0,1]; Kalshi may have several
            tapered ranges.
        min_tick:
          type: string
          description: Decimal string — the finest step across all ranges.
          example: '0.01'
        source:
          type: string
          enum:
          - metadata_cache
          - polymarket_clob
          - kalshi_price_ranges
          - kalshi_tick_size_deprecated
        synthetic:
          type: boolean
          description: True only for the deprecated Kalshi flat-tick_size fallback (price_ranges absent).
        price_level_structure:
          type:
          - string
          - 'null'
          description: Kalshi's raw price_level_structure field, when present. Always null for polymarket.
    MarketsTickRange:
      type: object
      properties:
        start:
          type: string
          example: '0'
        end:
          type: string
          example: '1'
        step:
          type: string
          example: '0.001'
    MarketsTickSizeUnsupported:
      type: object
      required:
      - provider
      - contract_id
      - supported
      - reason
      properties:
        provider:
          type: string
          enum:
          - predictfun
        contract_id:
          type: string
        supported:
          type: boolean
          enum:
          - false
        reason:
          type: string
          example: predict.fun exposes no per-market tick endpoint or tick change event; treat its tick
            as static/default. See docs/exchange-docs.
    MarketsMetadataResponse:
      type: object
      required:
      - ticker
      - provider
      - name
      - description
      - resolution_rules
      - contract
      - images
      - ctf_neg_risk
      - extra
      - active
      properties:
        ticker:
          type: string
        provider:
          type: string
        name:
          type: string
        description:
          type: string
        resolution_rules:
          $ref: '#/components/schemas/MarketsResolutionRules'
        contract:
          $ref: '#/components/schemas/MarketsContractInfo'
        images:
          $ref: '#/components/schemas/MarketsImages'
        external_url:
          type:
          - string
          - 'null'
        condition_id:
          type:
          - string
          - 'null'
          description: Only populated for some response paths; null when the response comes
            from a provider-API fallback.
        event_id:
          type:
          - string
          - 'null'
          description: Only populated for some response paths.
        ctf_neg_risk:
          type: boolean
          default: false
        extra:
          type: object
          additionalProperties: true
          description: |
            Raw upstream/provider payload, plus router-side enrichment: for polymarket, `clobRewards` ([{rewardsDailyRate}] or []), `rewardsMaxSpread`, `rewardsMinSize`; for predictfun, `rewards.current` (active reward-window object or null).
        active:
          type: boolean
          default: true
          description: False if the market is delisted/resolved and not tradable.
    MarketsResolutionRules:
      type: object
      required:
      - primary
      properties:
        primary:
          type: string
        secondary:
          type:
          - string
          - 'null'
        source:
          type:
          - string
          - 'null'
    MarketsContractInfo:
      type: object
      properties:
        tick_size:
          type:
          - number
          - 'null'
        min_price:
          type:
          - number
          - 'null'
        max_price:
          type:
          - number
          - 'null'
        lot_size:
          type:
          - number
          - 'null'
        quote_currency:
          type:
          - string
          - 'null'
        settlement_ts:
          type:
          - string
          - 'null'
          description: Only populated for some response paths; null otherwise.
        expires_at:
          type:
          - string
          - 'null'
    MarketsImages:
      type: object
      properties:
        icon:
          type:
          - string
          - 'null'
        banner:
          type:
          - string
          - 'null'
    MarketsBatchMetadataRequest:
      type: object
      required:
      - contracts
      properties:
        contracts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MarketsBatchMetadataRequestItem'
        titles_only:
          type: boolean
          default: false
          description: When true, skips the API fallback, category inference, and tag-icon enrichment
            passes — returns whatever was already cached directly.
    MarketsBatchMetadataRequestItem:
      type: object
      required:
      - ticker
      - provider
      properties:
        ticker:
          type: string
        provider:
          type: string
    MarketsBatchMetadataResponse:
      type: object
      description: Metadata items keyed by the requested ticker.
      additionalProperties:
        $ref: '#/components/schemas/MarketsBatchMetadataItem'
    MarketsBatchMetadataItem:
      type: object
      required:
      - ticker
      - found
      properties:
        ticker:
          type: string
        found:
          type: boolean
        title:
          type:
          - string
          - 'null'
        event_title:
          type:
          - string
          - 'null'
        provider:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        image:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
          description: May be backfilled by ticker-pattern/title-keyword inference or by a tag slug when
            the underlying record has none.
        end_date:
          type:
          - string
          - 'null'
        open_time:
          type:
          - string
          - 'null'
        tag_icon:
          type:
          - string
          - 'null'
          description: Highest-precedence active PlatformTag icon for this market.
        yes_sub_title:
          type:
          - string
          - 'null'
          description: Custom binary side label (e.g. Hyperliquid team names). Null falls back to "Yes"
            on the frontend.
        no_sub_title:
          type:
          - string
          - 'null'
        outcome_label:
          type:
          - string
          - 'null'
          description: Short sibling-differentiating label for multi-outcome events (Polymarket groupItemTitle
            / Kalshi yes_sub_title).
        resolved_outcome:
          type:
          - string
          - 'null'
          enum:
          - true
          - 'no'
          - void
          - null
          description: Winning side for already-resolved binary markets; null if unresolved or not surfaced
            by the provider.
        outcome_pair:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The two real outcome labels for a non-Yes/No binary market (moneyline/spread/O-U),
            ordered to match outcome index 0/1.
    MarketsOutcomesResponse:
      type: object
      required:
      - event_title
      - outcomes
      - is_grouped
      - event_groups
      - event_titles
      properties:
        event_title:
          type:
          - string
          - 'null'
        image:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
        provider:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MarketsOutcomeItem'
        is_grouped:
          type: boolean
        matched_market_id:
          type:
          - string
          - 'null'
          description: The outcome entry that corresponds to the queried market_id, if found among the
            returned outcomes.
        event_groups:
          type: object
          additionalProperties:
            type: string
          description: Maps every requested id (market_id plus each all_ids entry, plus every sibling
            id discovered while resolving) to its event_id.
        event_titles:
          type: object
          additionalProperties:
            type: string
          description: Maps every event_id referenced in event_groups to its title.
    MarketsOutcomeItem:
      type: object
      properties:
        market_id:
          type: string
        title:
          type: string
        outcome_label:
          type: string
        price:
          type: number
          description: 0-1 decimal probability (stored cents / 100.0) — NOT the platform's usual 0-100
            cents scale.
          example: 0.62
        volume_total:
          type: number
        volume_24h:
          type: number
        volume_1h:
          type: number
        token_id:
          type:
          - string
          - 'null'
        condition_id:
          type:
          - string
          - 'null'
        image:
          type:
          - string
          - 'null'
          description: Only present when served from the discover cache, not from the direct
            upstream-provider fallback path.
        icon:
          type:
          - string
          - 'null'
        expiration:
          type:
          - string
          - 'null'
    MarketsCryptoResponse:
      type: object
      required:
      - markets
      - window_offset
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketsCryptoMarket'
        window_offset:
          type: integer
    MarketsCryptoMarket:
      type: object
      required:
      - symbol
      - name
      - market_id
      - provider_id
      - is_settled
      properties:
        symbol:
          type: string
          enum:
          - BTC
          - ETH
          - SOL
          - XRP
          - DOGE
          - HYPE
          - BNB
        name:
          type: string
          description: Human-readable market title (Kalshi titles get an appended open/close time range).
        market_id:
          type: string
          description: Kalshi ticker or Polymarket/predict.fun market id.
        token_id:
          type:
          - string
          - 'null'
          description: Polymarket/predict.fun CLOB token id (the "Yes" token where resolvable). Absent
            for Kalshi entries.
        provider_id:
          type: integer
        price:
          type:
          - number
          - 'null'
          description: 0-1 decimal probability (mid of best bid/ask, last trade, or settlement snap to
            0/1 for past windows) — NOT the platform's usual 0-100 cents scale. Null while a market has
            no orderbook yet.
          example: 0.47
        is_settled:
          type: boolean
          description: True for past windows and any market whose settlement/resolution was found; the
            price is then snapped to exactly 0.0 or 1.0.
        is_upcoming:
          type: boolean
          description: Only present on some current-window Kalshi entries — true if the market is in Kalshi's
            "initialized"/"unopened" pre-launch state.
        open_time:
          type:
          - string
          - 'null'
          description: Only present on some current-window Kalshi entries.
    MarketsOracleHistoryResponse:
      type: object
      description: Price-history points keyed by oracle symbol (btc-usd/eth-usd/sol-usd/xrp-usd), each
        array sorted ascending by timestamp.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/MarketsOraclePricePoint'
    MarketsOraclePricePoint:
      type: object
      properties:
        price:
          type: number
          example: 97123.45
        timestamp:
          type: integer
          description: Epoch milliseconds.
    MarketsPtbResponse:
      type: object
      description: Keyed by window (1m/5m/15m/1h/4h/1d), each value keyed by symbol.
      additionalProperties:
        $ref: '#/components/schemas/MarketsPtbWindowValues'
    MarketsPtbWindowValues:
      type: object
      description: Keyed by oracle symbol (btc-usd/eth-usd/sol-usd/xrp-usd). A symbol is omitted entirely
        if no price could be resolved for this window.
      additionalProperties:
        $ref: '#/components/schemas/MarketsPtbValue'
    MarketsPtbValue:
      type: object
      required:
      - price
      - timestamp_ms
      - game_start_ms
      properties:
        price:
          type: number
          example: 97000.5
        timestamp_ms:
          type: integer
          description: Actual epoch-ms timestamp of the oracle sample used (may differ slightly from game_start_ms).
        game_start_ms:
          type: integer
          description: Epoch-ms start of the requested window (the "price to beat" anchor).
    MarketsEquitySnapshotResponse:
      type: object
      required:
      - prices
      - cached
      properties:
        prices:
          type: object
          description: Keyed by the requested (upper-cased) symbol. Either the full cache hit set or just
            the freshly-fetched subset — see `cached`.
          additionalProperties:
            $ref: '#/components/schemas/MarketsEquityPrice'
        cached:
          type: boolean
          description: True only if every requested symbol was already cached and `prices`
            is that full cached set. False means `prices` contains only symbols that had to
            be freshly fetched for this request.
    MarketsEquityPrice:
      type: object
      properties:
        symbol:
          type: string
          description: The internal (Kairos-side) symbol, which may differ from the upstream ticker.
          example: AAPL
        price:
          type: number
          example: 231.45
        previousClose:
          type:
          - number
          - 'null'
        currency:
          type: string
          default: USD
        marketState:
          type: string
          example: REGULAR
        timestamp:
          type: integer
          description: Epoch milliseconds of the quote (regularMarketTime * 1000).
    CandlesCandle:
      type: object
      description: One OHLCV bar. `token_id` is only present (never emitted as null) when the underlying
        series is keyed by an outcome token rather than a plain contract id.
      required:
      - contract_id
      - timeframe_seconds
      - bucket_start
      - open
      - high
      - low
      - close
      - volume
      properties:
        contract_id:
          type: string
          description: Contract/market identifier this bar belongs to.
          example: KXPRESPOLAND-24-DT
        timeframe_seconds:
          type: integer
          description: Bucket width in seconds.
          example: 60
        bucket_start:
          type: string
          format: date-time
          description: Bucket start time, ISO 8601 UTC.
          example: '2026-07-21T14:32:00+00:00'
        open:
          type: number
          description: Opening price, 0-100 cents scale.
          example: 63.5
        high:
          type: number
          description: High price in the bucket, 0-100 cents scale.
          example: 64.0
        low:
          type: number
          description: Low price in the bucket, 0-100 cents scale.
          example: 63.0
        close:
          type: number
          description: Closing price, 0-100 cents scale.
          example: 63.8
        volume:
          type: integer
          description: Traded size (contracts/shares) within the bucket.
          example: 1250
        token_id:
          type: string
          description: Outcome token identifier, present only when this series is token-scoped (e.g. multi-outcome
            Polymarket markets).
          example: '71321045679252212594626385532706912750332728571942532289631379312455583992563'
    CandlesSeriesResponse:
      type: object
      required:
      - candles
      properties:
        candles:
          type: array
          items:
            $ref: '#/components/schemas/CandlesCandle'
    CandlesBatchRequestItem:
      type: object
      required:
      - provider
      - contract_id
      - timeframe_seconds
      - start
      - end
      properties:
        provider:
          type: string
          example: kalshi
        contract_id:
          type: string
          maxLength: 128
          example: KXPRESPOLAND-24-DT
        timeframe_seconds:
          type: integer
          enum:
          - 1
          - 60
          - 300
          - 900
          - 3600
          - 14400
          - 86400
          example: 60
        start:
          type: string
          format: date-time
          example: '2026-07-21T00:00:00Z'
        end:
          type: string
          format: date-time
          example: '2026-07-22T00:00:00Z'
        outcome:
          type: integer
          minimum: 0
          default: 0
          description: Zero-based outcome index. Omitted/null defaults to 0; negative or non-integer values
            return 400.
        rebuild:
          type: boolean
          default: false
          description: Bypass the cache for this item and force a fresh fetch.
    CandlesBatchRequest:
      type: object
      required:
      - requests
      description: |
        `requests` is the primary field name; the router also accepts a legacy `items` key with the identical array shape as a fallback if `requests` is absent.
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/CandlesBatchRequestItem'
    CandlesBatchResultItem:
      type: object
      required:
      - index
      - candles
      properties:
        index:
          type: integer
          description: Position of this result, matching the index of the corresponding item in the request's
            `requests` array.
          example: 0
        candles:
          type: array
          items:
            $ref: '#/components/schemas/CandlesCandle'
        error:
          type: string
          description: Present only when this specific item failed while other items in the
            batch succeeded from cache. `candles` is `[]` in that case.
          example: Candle batch fetch failed
    CandlesBatchResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          description: Index-ordered, one entry per request item.
          items:
            $ref: '#/components/schemas/CandlesBatchResultItem'
    TradesMetrics:
      type: object
      description: |
        Aggregate volume/pressure metrics. Split by outcome (outcome_0 vs outcome_1), not by buy/sell direction — trade direction is not reliably derivable from every provider's exchange data.
      required:
      - volume_usd
      - outcome_0_volume_usd
      - outcome_1_volume_usd
      - outcome_0_pressure_pct
      - trade_count
      - window_seconds
      - coverage_pct
      - source
      - indexing
      properties:
        volume_usd:
          type: number
          description: Total notional volume in the window, in USD.
          example: 154320.55
        outcome_0_volume_usd:
          type: number
          description: Notional volume attributed to the first/primary outcome (e.g. "yes").
          example: 98210.1
        outcome_1_volume_usd:
          type: number
          description: Notional volume attributed to the second outcome (e.g. "no").
          example: 56110.45
        outcome_0_pressure_pct:
          type: number
          description: Share of total volume_usd attributed to outcome_0, as a percentage (0-100).
          example: 63.65
        trade_count:
          type: integer
          description: Number of trades included in the aggregation.
          example: 842
        window_seconds:
          type: integer
          description: Window width the metrics were computed over, in seconds.
          example: 86400
        coverage_pct:
          type: number
          description: Estimated data coverage for the window as a percentage (0-100); 100 for live upstream
            proxies (Kalshi/Polymarket) and for fully-ingested windows.
          example: 100.0
        source:
          type: string
          description: >-
            Opaque internal marker indicating how the response was produced.
            NOT a stable part of the contract — its value may change without
            notice; do not depend on or switch on it.
        indexing:
          type: boolean
          description: True if an ingestion/backfill job was triggered or is in progress for this window
            (only meaningful when the caller passed `trigger_ingest=true`); coverage may be incomplete
            when true.
          example: false
    TradesTrade:
      type: object
      description: |
        A single normalized trade, as returned by `/trades/history`. Includes legacy `yes_price`/`no_price`/`taker_side` fields derived from `price`/`outcome` for backward compatibility with older consumers.
      required:
      - trade_id
      - order_id
      - contract_id
      - size
      - price
      - outcome
      - timestamp
      - yes_price
      - no_price
      - taker_side
      properties:
        trade_id:
          type: string
          example: kalshi:KXPRESPOLAND-24-DT:9f2a1c
        order_id:
          type: string
          nullable: true
          description: Venue order identifier or hash shared by fills from the same order. Null when the
            source venue does not provide an order identifier. This is not a Kairos order UUID.
          example: 0x9f2a1c...7bd4
        contract_id:
          type: string
          example: KXPRESPOLAND-24-DT
        size:
          type: integer
          description: Traded size (contracts/shares).
          example: 50
        price:
          type: number
          description: Trade price of the traded outcome, 0-100 cents scale.
          example: 63.0
        outcome:
          type: string
          description: Outcome name/index the trade was executed against (e.g. "yes", "no", or a token-based
            outcome label).
          example: 'yes'
        timestamp:
          type: number
          description: Unix timestamp, seconds.
          example: 1753142400.0
        token_id:
          type: string
          description: Outcome token identifier, present only when applicable.
        metadata:
          type: string
          description: Provider-specific JSON blob serialized as a string, present only when available.
        taker_address:
          type: string
          description: Taker wallet address, present only for on-chain venues where it's known.
        maker_address:
          type: string
          description: Counterparty wallet/contract address; may be the canonical exchange contract on
            aggressor-summary rows or a real wallet on maker-fill legs. Present only when known.
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: Trade direction (distinct from `outcome`), present only when known.
        yes_price:
          type: number
          description: 'Legacy field: price expressed on the ''yes'' outcome, 0-100 scale, derived from
            `price`/`outcome`.'
          example: 63.0
        no_price:
          type: number
          description: 'Legacy field: price expressed on the ''no'' outcome, 0-100 scale, derived from
            `price`/`outcome`.'
          example: 37.0
        taker_side:
          type: string
          description: Legacy alias, always equal to `outcome`.
          example: 'yes'
    TradesHistoryResponse:
      type: object
      required:
      - trades
      - has_more
      - source
      - coverage_hours
      - indexing
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradesTrade'
        has_more:
          type: boolean
          description: True if more trades exist before the oldest trade in this response (pagination
            via `before`).
        oldest_available_ts:
          type: number
          nullable: true
          description: Unix timestamp (seconds) of the oldest trade Kairos has ingested for this contract,
            or null if unknown.
          example: 1750000000.0
        source:
          type: string
          description: >-
            Opaque internal marker indicating how the response was served.
            NOT a stable part of the contract — its value may change without
            notice; do not depend on or switch on it.
        coverage_hours:
          type: number
          description: Hours of trade history coverage available/considered for this response.
          example: 24.0
        indexing:
          type: boolean
          description: True if ingestion was triggered/in progress for this window (only meaningful with
            `trigger_ingest=true`).
          example: false
    TradesMetricsResponse:
      type: object
      required:
      - metrics
      properties:
        metrics:
          $ref: '#/components/schemas/TradesMetrics'
    TradesKalshiRawTrade:
      type: object
      description: |
        Raw trade object as returned by Kalshi's `GET /trade-api/v2/markets/trades`, passed through unmodified. Fields shown are the ones Kalshi documents/observed in practice; the API does not restrict or re-type them.
      additionalProperties: true
      properties:
        trade_id:
          type: string
        ticker:
          type: string
        count:
          type: integer
          description: Contracts traded.
        created_time:
          type: string
          format: date-time
        yes_price:
          type: integer
          description: 0-100 cents scale.
        no_price:
          type: integer
          description: 0-100 cents scale.
        taker_side:
          type: string
          enum:
          - true
          - false
    TradesKalshiResponse:
      type: object
      description: |
        The raw Kalshi API response object, spread as-is, with a `metrics` field injected by Kairos. Any other fields Kalshi returns (e.g. a pagination `cursor`) pass through unchanged.
      additionalProperties: true
      required:
      - trades
      - metrics
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradesKalshiRawTrade'
        cursor:
          type: string
          description: Upstream pagination cursor, passed through when present.
        metrics:
          $ref: '#/components/schemas/TradesMetrics'
    TradesPolymarketRawTrade:
      type: object
      description: |
        Raw trade object as returned by Polymarket's `GET https://data-api.polymarket.com/trades`, passed through unmodified.
      additionalProperties: true
      properties:
        proxyWallet:
          type: string
        side:
          type: string
          enum:
          - BUY
          - SELL
        asset:
          type: string
          description: Outcome token id.
        conditionId:
          type: string
        size:
          type: number
        price:
          type: number
          description: Upstream price, 0-1 decimal scale (not the 0-100 scale Kairos normalizes to elsewhere).
        timestamp:
          type: integer
          description: Unix seconds.
        transactionHash:
          type: string
        outcome:
          type: string
    TradesPolymarketResponse:
      type: object
      required:
      - trades
      - metrics
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradesPolymarketRawTrade'
        metrics:
          type: object
          additionalProperties: true
          description: |
            A `TradesMetrics` object in the normal case. When `market` could not be resolved to a condition ID, this is a literal empty object `{}` and `trades` is `[]` — no upstream call was made.
    TraderPnlDataPoint:
      type: object
      description: Single point on a trader's realized-PnL time series.
      required:
      - timestamp
      - realized_pnl
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp of this data point.
          example: '2026-07-15T00:00:00Z'
        realized_pnl:
          type: string
          format: decimal
          description: Cumulative realized PnL (USD) at this point in time. Serialized as a decimal string.
          example: '1250.4382'
    TraderPnlHistoryResponse:
      type: object
      description: |
        Time-series realized-PnL data for a wallet over a requested time range, plus a summary of the change over that range.
      required:
      - wallet_address
      - time_range
      - data_points
      - start_pnl
      - end_pnl
      - pnl_change
      - current_realized_pnl
      properties:
        wallet_address:
          type: string
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        time_range:
          type: string
          enum:
          - 1D
          - 1W
          - 1M
          - ALL
          example: 1W
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/TraderPnlDataPoint'
        start_pnl:
          type: string
          format: decimal
          description: Realized PnL at the start of the window.
          example: '800.00'
        end_pnl:
          type: string
          format: decimal
          description: Realized PnL at the end of the window.
          example: '1250.4382'
        pnl_change:
          type: string
          format: decimal
          description: Absolute change in realized PnL over the window (end_pnl - start_pnl).
          example: '450.4382'
        pnl_change_percent:
          type: string
          format: decimal
          nullable: true
          description: Percentage change over the window; null if start_pnl is zero/undefined.
          example: '56.30'
        current_realized_pnl:
          type: string
          format: decimal
          description: Wallet's current total realized PnL (as of now, not bounded to the window).
          example: '1250.4382'
        current_total_pnl:
          type: string
          format: decimal
          nullable: true
          description: Current realized + unrealized PnL combined, when available.
          example: '1875.10'
    TraderPosition:
      type: object
      description: A single current or historical position held by a trader.
      required:
      - market_id
      - token_id
      - outcome
      - size
      - entry_price
      - cost_basis
      - realized_pnl
      - status
      - provider
      properties:
        market_id:
          type: string
          example: 0xabc123condition
        market_name:
          type: string
          nullable: true
          example: Will the Fed cut rates in September?
        icon:
          type: string
          nullable: true
          description: Market icon/image URL.
          example: https://cdn.kairos.trade/markets/abc123.png
        token_id:
          type: string
          example: 10723948572...4
        outcome:
          type: string
          description: Outcome label — YES/NO or a token symbol.
          example: 'YES'
        size:
          type: string
          format: decimal
          description: Position size (>= 0).
          example: '150.0'
        entry_price:
          type: string
          format: decimal
          description: Average entry price (>= 0), 0-1 scale.
          example: '0.42'
        current_price:
          type: string
          format: decimal
          nullable: true
          description: Current mark price (>= 0), 0-1 scale.
          example: '0.55'
        cost_basis:
          type: string
          format: decimal
          description: Total USD cost basis for this position (>= 0).
          example: '63.00'
        unrealized_pnl:
          type: string
          format: decimal
          nullable: true
          example: '19.50'
        realized_pnl:
          type: string
          format: decimal
          description: Realized PnL booked against this position so far.
          example: '0.00'
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        opened_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        provider:
          type: string
          description: Venue the position was traded on.
          default: polymarket
          example: polymarket
    TraderPerformance:
      type: object
      description: Aggregated trader performance metrics, always computed over the full inventory (not
        a paginated page).
      required:
      - wallet_address
      - total_realized_pnl
      - total_unrealized_pnl
      - total_pnl
      - open_positions
      - closed_positions
      - total_positions
      - winning_positions
      - losing_positions
      - win_rate
      - total_volume
      - markets_traded
      - last_updated
      properties:
        wallet_address:
          type: string
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        total_realized_pnl:
          type: string
          format: decimal
          example: '1250.4382'
        total_unrealized_pnl:
          type: string
          format: decimal
          example: '300.00'
        total_pnl:
          type: string
          format: decimal
          example: '1550.4382'
        roi_percent:
          type: string
          format: decimal
          default: '0'
          example: '12.75'
        open_positions:
          type: integer
          minimum: 0
          example: 4
        closed_positions:
          type: integer
          minimum: 0
          example: 27
        total_positions:
          type: integer
          minimum: 0
          example: 31
        positions_value:
          type: string
          format: decimal
          default: '0'
          description: Cost basis (deployed capital) of OPEN positions, summed over the full inventory.
          example: '420.00'
        winning_positions:
          type: integer
          minimum: 0
          example: 18
        losing_positions:
          type: integer
          minimum: 0
          example: 9
        win_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Win rate over closed, resolved positions.
          example: 0.6667
        total_volume:
          type: string
          format: decimal
          minimum: '0'
          example: '18420.55'
        markets_traded:
          type: integer
          minimum: 0
          example: 12
        join_date:
          type: string
          format: date-time
          nullable: true
          description: Polymarket account join date, when known.
        profile_views:
          type: integer
          default: 0
          example: 340
        largest_win:
          type: string
          format: decimal
          nullable: true
          example: '512.30'
        last_updated:
          type: string
          format: date-time
          example: '2026-07-22T14:03:11Z'
    TraderPositionsResponse:
      type: object
      description: |
        A page of a wallet's positions plus performance stats derived from the full inventory in the same scan.
      required:
      - wallet_address
      - performance
      - open_positions
      - closed_positions
      properties:
        wallet_address:
          type: string
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        performance:
          $ref: '#/components/schemas/TraderPerformance'
        open_positions:
          type: array
          items:
            $ref: '#/components/schemas/TraderPosition'
        closed_positions:
          type: array
          items:
            $ref: '#/components/schemas/TraderPosition'
        has_more:
          type: boolean
          default: false
          description: True when more positions exist beyond this page (open+closed combined, sorted by
            value).
    TraderTradeRecord:
      type: object
      description: A single trade/fill record.
      required:
      - trade_id
      - order_id
      - market_id
      - token_id
      - side
      - size
      - price
      - timestamp
      - provider
      properties:
        trade_id:
          type: string
          example: trd_9f2c3a1b
        order_id:
          type: string
          nullable: true
          description: Parent venue order identifier/hash shared by fills from the same order. For Predict.fun
            this is the venue EIP-712 order hash. Null when the provider or lifecycle row has no authoritative
            venue order identifier. This is not a Kairos order UUID.
          example: 0x9f2a1c...7bd4
        market_id:
          type: string
          example: 0xabc123condition
        market_name:
          type: string
          nullable: true
          example: Will the Fed cut rates in September?
        icon:
          type: string
          nullable: true
          example: https://cdn.kairos.trade/markets/abc123.png
        token_id:
          type: string
          example: 10723948572...4
        outcome:
          type: string
          nullable: true
          example: 'YES'
        side:
          type: string
          enum:
          - BUY
          - SELL
        size:
          type: string
          format: decimal
          description: Trade size (>= 0).
          example: '25.0'
        price:
          type: string
          format: decimal
          description: Fill price (>= 0), 0-1 scale.
          example: '0.47'
        timestamp:
          type: string
          format: date-time
          example: '2026-07-20T09:14:02Z'
        tx_hash:
          type: string
          nullable: true
          example: 0xfeedface...beef
        realized_pnl:
          type: string
          format: decimal
          nullable: true
          description: Realized PnL booked by this fill (populated for SELLs from the FIFO ledger; null/0
            for BUYs).
          example: '3.75'
        provider:
          type: string
          default: polymarket
          example: polymarket
    TraderRecentTradesResponse:
      type: object
      description: |
        A standalone page of trade history, served independently of the full profile build.
      required:
      - wallet_address
      - trades
      properties:
        wallet_address:
          type: string
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TraderTradeRecord'
        has_more:
          type: boolean
          default: false
    TraderTopHolder:
      type: object
      description: A single holder of a market's outcome token.
      required:
      - proxyWallet
      - amount
      - outcomeIndex
      - displayUsernamePublic
      - verified
      properties:
        proxyWallet:
          type: string
          description: Holder's wallet address.
          example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
        amount:
          type: number
          format: double
          description: Token amount held.

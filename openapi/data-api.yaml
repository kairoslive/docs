    SportsMatchedMarketsResponse:
      type: object
      required:
      - pairs
      - count
      - limit
      - offset
      - has_more
      properties:
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/SportsMatchedMarketPair'
        count:
          type: integer
          description: Number of pairs on this page after live-status post-filtering (may be less than
            limit).
          example: 42
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
        has_more:
          type: boolean
          description: Whether the underlying page (before live-status post-filtering) was full —
            not a strict function of count.
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next keyset page. Present when cursor mode is requested.
        catalog_version:
          type: string
          description: Full-set fingerprint shared by every page in one cursor walk.
        total:
          type: integer
          description: Only present when include_total=true. Total matching-pair count under the pre-live-filter
            query filters.
          example: 1284

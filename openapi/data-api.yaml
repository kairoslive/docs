        '429':
          $ref: '#/components/responses/DataRateLimited'
  /sports/matching-markets:
    get:
      operationId: getSportsMatchingMarkets
      summary: Cross-platform matching-market records for a set of game slugs
      description: Returns the cached cross-venue match record for each requested slug, keyed by
        slug. Slugs with no cache entry, or whose cached value fails to parse, are silently omitted
        from the response object (not returned as null). When `live=true`, the Kalshi side of every
        matched entry is refreshed in-place with a live price (in cents / 100, 4 decimal places); a
        correction is applied when a stale price appears to be on the wrong side of a binary flip.
        Responses are cacheable, briefly when `live=true`, longer otherwise.
      tags:
      - Sports
      x-kairos-auth: public
      security: []
      x-kairos-rate-limit: 100/minute
      x-kairos-bucket: default
      parameters:
      - name: slugs
        in: query
        required: true
        description: Comma-separated list of game slugs to look up. Empty/blank entries are dropped.
        schema:
          type: string
          minLength: 1
        example: nba-lal-bos-2026-01-15,nhl-tor-mtl-2026-01-15
      - name: live
        in: query
        required: false
        description: Pass the literal string "true" to refresh Kalshi prices live from the discover cache
          before returning. Any other value (including omission) is treated as false. Not parsed as a
          boolean by FastAPI — compared as a raw string equal to "true".
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        example: 'true'
      responses:
        '200':
          description: Map of slug to matching-market record. Returns `{}` if `slugs` parses to no non-empty
            entries.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30, s-maxage=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsMatchingMarketsResponse'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'

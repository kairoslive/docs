                $ref: '#/components/schemas/TraderRecentTradesResponse'
        '400':
          description: Malformed wallet address or unrecognized provider.
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Unexpected error fetching trader trades.
  /top-holders:
    get:
      operationId: getTopHolders
      summary: Get top token holders for one or more markets
      tags:
      - Trader Analytics
      x-kairos-auth: api-key
      x-kairos-rate-limit: 10/minute
      x-kairos-bucket: heavy
      description: |
        Fetches the largest holders of each outcome token for the given market IDs from the provider-specific upstream source, including Polymarket's data-api and Predict.fun's public GraphQL API. `market` accepts a comma-separated list (up to 50 IDs, each capped at 128 chars); Predict.fun requires numeric market IDs. An empty or missing value is rejected with 400. Results are grouped per token/outcome and include public profile fields (username, verification badge, avatar) alongside the held `amount`. This is a live upstream read, not served from a local cache; a downstream 4xx/5xx from the provider surfaces as 404 (market/token not found) or 502 (provider error). **Auth**: accepts an admin secret (`X-Admin-Secret`), an API key (`X-Client-Id` + `X-Api-Key` + `X-Api-Secret`), or a first-party JWT (Authorization header or `turnkey_session_jwt` cookie). No API-key scope is required — any valid credential can read holders. Rate-limited by the `heavy` group at 10 requests/minute, the same budget the `/trader-stats` endpoints carry, because every call is a live upstream provider read.
      parameters:
      - name: market
        in: query
        required: true
        schema:
          type: string
        description: Comma-separated list of market/condition IDs (max 50 items, 128 chars each).
        example: 0xabc123,0xdef456
      - name: provider
        in: query
        required: false
        schema:
          type: string
          default: polymarket
        description: Provider name, validated against the active provider registry. Examples include polymarket and predictfun.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
        description: Maximum number of holders to return per token.
      - name: minBalance
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 999999
          default: 1
        description: Minimum token balance a holder must have to be included.
      responses:
        '200':
          description: Top holders per requested token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraderTopHoldersResponse'
        '400':
          description: |
            Missing/empty `market`, too many market IDs, an oversized market ID, an invalid `provider`, or an invalid request accepted by the provider client.
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '404':
          description: Market or token not found by the upstream provider.
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '502':
          description: Upstream provider error fetching top holders.
  /search-traders:
    get:
      operationId: searchTraders
      summary: Search for a trader's public profile by wallet address
      tags:
      - Trader Analytics
      x-kairos-auth: api-key
      x-kairos-rate-limit: 10/minute
      x-kairos-bucket: heavy
      description: |
        Fetches public profile information (display name, pseudonym, bio, avatar, X/Twitter handle, verification badge, associated user IDs) for a wallet address from the upstream provider. Provider is auto-detected from address format when omitted — Ethereum (0x...) addresses default to Polymarket and Solana addresses default to Kalshi; auto-detection maps **every** 0x address to Polymarket, so other EVM venues (Opinion, predictfun, ...) must pass `provider` explicitly. `provider`, when given, is validated against the central provider registry shared with `/trader-stats`; any registered provider is accepted, and non-Polymarket venues currently receive a synthetic (service-generated) profile rather than a live upstream fetch. This is a live provider read, not served from cached data. **Auth**: accepts an admin secret (`X-Admin-Secret`), an API key (`X-Client-Id` + `X-Api-Key` + `X-Api-Secret`), or a first-party JWT (Authorization header or `turnkey_session_jwt` cookie). No API-key scope is required — any valid credential can read a public profile. Rate-limited by the `heavy` group at 10 requests/minute, matching `/trader-stats`, because every call is a live upstream provider read.
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
        description: Wallet address to search for (any non-empty string; trimmed).
        example: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
      - name: provider
        in: query
        required: false
        schema:
          type: string
        description: |
          Provider override. Auto-detected from address format (0x -> polymarket, Solana -> kalshi) if omitted.
        example: polymarket
      responses:
        '200':
          description: Trader search result. `profile` is null if no profile was found; `error` carries
            a provider-supplied message in that case.

        example: ucl
      - name: format
        in: query
        required: false
        description: Bracket layout. "symmetric" converges left/right rounds on a final; "left-to-right"
          is a single linear round list; "groups-then-knockout" adds a group stage.
        schema:
          type: string
          enum:
          - symmetric
          - left-to-right

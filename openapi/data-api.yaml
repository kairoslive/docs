  /api/markets/discover/v2:
    get:
      operationId: discoverMarketsV2
      summary: Paginated, filtered, event-grouped market list for the Discover page
      description: 'Returns a paginated, filtered, sorted, event-grouped market list for the Discover
        page, with server-side filtering (provider, category incl. alias remapping, free-text search,
        price/volume bounds, explicit market-id list, platform-tag/subcategory intersection, expiration
        window) and sorting. Most filter combinations are cacheable; free-text or bounded (price/volume)
        requests always run fresh and are not cached. Tag/subcategory filters that resolve to zero markets
        short-circuit to an empty payload; tag-filtered requests that would otherwise come back empty
        also get a best-effort fallback lookup so populated subtopics never render empty.'
      tags:
      - Discover
      x-kairos-auth: api-key
      x-kairos-rate-limit: 60/minute
      x-kairos-bucket: discover
      parameters:
      - name: offset
        in: query
        description: Bounded by the candidate window the feed is assembled from; `total` is derived
          from that same window, so real pagination never reaches the cap.
        schema:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - volume
          - volume_24h
          - volume_1h
          - price
          - newest
          - liquidity
          - rewards
          default: volume_1h
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: provider
        in: query
        description: Provider id or `all`. Validated dynamically against currently active providers.
        schema:
          type: string
        example: kalshi
      - name: category
        in: query
        description: Topic category. Display aliases `elections`, `geopolitics`, `economy`, `climate &
          science` are remapped server-side to `politics`, `world`, `finance`, `weather` respectively
          before filtering.
        schema:
          type: string
          enum:
          - all
          - politics
          - crypto
          - sports
          - esports
          - finance
          - tech
          - world
          - weather
          - elections
          - geopolitics
          - culture
          - economy
          - climate & science
      - name: search
        in: query
        description: Free-text filter. Disables response caching for this request.
        schema:
          type: string
          maxLength: 128
      - name: min_price
        in: query
        description: Inclusive lower bound, in cents (0-100). Disables response caching.
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: max_price
        in: query
        description: Inclusive upper bound, in cents (0-100). Disables response caching.
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: min_volume_1h
        in: query
        description: Minimum 1h volume. Disables response caching.
        schema:
          type: number
          minimum: 0
      - name: market_ids
        in: query
        description: Comma-separated market ids (max 500 items, 128 chars each). Disables response caching.
        schema:
          type: string
        example: KXPRES-28,0x1234abcd
      - name: tag_ids
        in: query
        description: Comma-separated platform-tag UUIDs, AND-intersected against `market_ids`/`tag_slug`
          (max 50). Disables response caching.
        schema:
          type: string
      - name: tag_slug
        in: query
        description: Single platform-tag slug (alternative to `tag_ids`).
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
      - name: subcategory
        in: query
        description: Subcategory (subtopic) tag slug, intersected with any other filters. Also accepts
          the tournament sentinel `__tournament:<uuid>` emitted by the web bracket UI, which short-circuits
          to an empty markets payload rather than 400ing.
        schema:
          type: string
      - name: expiration_after
        in: query
        description: ISO-8601 datetime lower bound (inclusive) on market expiration.
        schema:
          type: string
          format: date-time
      - name: expiration_before
        in: query
        description: ISO-8601 datetime upper bound (exclusive) on market expiration.
        schema:
          type: string
          format: date-time
      - name: zipper
        in: query
        description: Interleave/zip results across providers instead of a flat sort.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Paginated market list (event-grouped where applicable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverV2Response'
        '400':
          description: Invalid sort_by/sort_order/category/provider, invalid tag_slug/subcategory slug,
            invalid expiration ISO date, or oversized market_ids/tag_ids list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverBadRequestError'
        '401':
          $ref: '#/components/responses/DataUnauthorized'
        '403':
          $ref: '#/components/responses/DataForbidden'
        '422':
          $ref: '#/components/responses/DataValidationError'
        '429':
          $ref: '#/components/responses/DataRateLimited'
        '500':
          description: Discover assembly failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'
        '503':
          description: Discover data store is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataError'

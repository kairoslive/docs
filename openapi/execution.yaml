            is not the authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '500':
          description: Wallet-metadata read failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: An on-chain balance read failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '503':

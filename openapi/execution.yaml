  /exchanges/polymarket/deposit-wallet/nonce:
    post:
      operationId: getDepositWalletNonce
      summary: Read the relayer nonce for the caller's next signed batch
      description: |-
        Returns Polymarket's relayer `WALLET`-type nonce for the owner, as a decimal U256 string. Bind it into the EIP-712 `Batch` you sign for `submit-signed-batch`; a stale nonce is rejected by the relayer.
        This exists server-side only because Polymarket's relayer is CORS-blocked from browser origins. The value is public information and reveals nothing — the ownership check here is belt-and-braces.
        Note this endpoint checks the identity FIELDS against the caller but does not prove the caller owns `owner_address`, since the nonce is a public read.
        **Auth & scope.** Requires `trade:execute` for `polymarket` and the mutation gate.
      tags:
      - Deposit wallet
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDepositWalletIdentityRequest'
      responses:
        '200':
          description: The current relayer nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDepositWalletNonceResponse'
        '400':
          description: Invalid `owner_address`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          $ref: '#/components/responses/ExecUnauthorized'
        '403':
          description: '`AuthInsufficientScope` — "This API key lacks the trade:execute scope"; or
            `AuthIdentityMismatch`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '500':
          description: The relayer client is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: The relayer's nonce read failed. The relayer's reason is logged, not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '503':
          description: API-key access to `polymarket` could not be checked (fails closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /exchanges/polymarket/deposit-wallet/submit-signed-batch:
    post:
      operationId: submitDepositWalletSignedBatch
      summary: Forward a client-signed deposit-wallet batch to Polymarket's relayer
      description: |-
        The only way to move value out of, or convert collateral inside, a deposit wallet. **The browser signs; the server verifies and forwards.** Kairos holds no key for this path — the backend-signed `sweep`, `withdraw` and `wrap-unwrap` endpoints were deliberately REMOVED, and reintroducing a server-side signer for these digests is treated as a security regression.
        You sign an EIP-712 `Batch` over `{wallet, nonce, deadline, calls[]}`, domain-bound to your deposit wallet and Polygon's chain id. Get `nonce` from the nonce endpoint; `deadline` is unix seconds and is bound into the digest.
        **A valid owner signature is NOT sufficient.** Consent to bytes does not entitle arbitrary calldata to platform-paid relay, so an allow-list gates the batch SHAPE. Every call must carry zero native value, and the batch must be exactly one of:
          - a set of CTF `safeBatchTransferFrom` share transfers out of the wallet to a non-zero, non-self recipient, with matching non-empty `ids`/`amounts`, no zero amounts and empty `data`;
          - a SINGLE ERC-20 `transfer` of pUSD, USDC.e or native USDC to a non-zero recipient for a non-zero amount;
          - a two-call conversion pair — `approve(onramp, amt)` + `wrap(asset, wallet, amt)`, or `approve(offramp, amt)` + `unwrap(asset, wallet, amt)` — where the approved amount equals the conversion amount and the recipient is the wallet itself.
        Anything else (`transferFrom`, arbitrary routers, stray approvals, four-call batches) is refused even when correctly signed. The server also independently `ecrecover`s the signature and refuses to forward if it does not match `owner_address`.
        **Irreversible once relayed and mined.** There is no cancel endpoint.
        **A timeout is not a failure.** If the 120 s mining wait elapses you get `200` with `submitted: true` and `transaction_hash: null` — an UNKNOWN outcome. Resolve it with `signed-batch-status`; do not resubmit.
        > **Error shape — this endpoint diverges.** Most of its 4xx/5xx responses have a **completely empty body** with `content-type: text/plain`, not JSON. Only four messages ever reach you as text: the two allow-list denials, and the relayer/`502` passthroughs. A client that assumes a JSON error body will fail to parse these. The `403` for a missing scope is an **empty body** here, where `onboard` and `nonce` return a structured `AUTH_INSUFFICIENT_SCOPE` for the identical condition.
        **Auth & scope.** Requires `trade:execute` for `polymarket`, identity + wallet ownership, and the mutation gate.
      tags:
      - Deposit wallet
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDepositWalletSubmitSignedBatchRequest'
      responses:
        '200':
          description: Accepted by the relayer. Check `transaction_hash` — `null` means the outcome is
            not yet known.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDepositWalletSubmitSignedBatchResponse'
        '400':
          description: |-
            Empty body (`text/plain`) for: invalid `user_id`; no deposit wallet on file; `deposit_wallet` not matching the persisted address; a malformed address, signature (must be `0x` + 132 chars), `nonce`, `deadline`, or call field; a signature that is not valid hex, not 65 bytes, unparseable, or that does not `ecrecover` to `owner_address`.
            Plain-text body `batch is not an allowed withdrawal or collateral conversion` when the allow-list refuses the batch shape.
            An identity-field mismatch instead returns the structured `AuthIdentityMismatch` body.
        '401':
          $ref: '#/components/responses/ExecUnauthorized'
        '403':
          description: Missing `trade:execute` scope — **empty body**. API-key access to `polymarket`
            disabled, or an identity mismatch — structured body.
        '404':
          description: No `UserIdentity` row for this user. Empty body (`text/plain`).
        '500':
          description: The relayer client is unavailable. Empty body (`text/plain`).
        '502':
          description: 'Plain-text body `relayer rejected batch: <reason>` — the relayer''s reason is
            forwarded verbatim (stale nonce, expired deadline, bad signature, pre-submission
            rejection).'
        '503':
          description: API-key access to `polymarket` could not be checked (fails closed). Structured
            body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /exchanges/polymarket/deposit-wallet/signed-batch-status:
    post:
      operationId: getDepositWalletSignedBatchStatus
      summary: Poll the outcome of a relayed deposit-wallet batch
      description: |-
        Resolves a `batch_tx_id` from `submit-signed-batch` or `onboard` to one of three states. This is how you settle the ambiguous `transaction_hash: null` case.
        `pending` deliberately includes the relayer's own `MINED` and `EXECUTED` states, because Polymarket can report mined before the wallet code is visible and its registry updated — so `pending` genuinely means "not yet safe to treat as done", not "almost done". Keep polling until `confirmed` or `reverted`.
        **Auth & scope.** Requires `trade:execute` for `polymarket` and the mutation gate. Identity fields are checked, but wallet ownership is not re-proven.
      tags:
      - Deposit wallet
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDepositWalletSignedBatchStatusRequest'
      responses:
        '200':
          description: The batch's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDepositWalletSignedBatchStatusResponse'
        '400':
          description: '`batch_tx_id` is empty, longer than 128 characters, or contains characters
            outside `[A-Za-z0-9_-]`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          $ref: '#/components/responses/ExecUnauthorized'
        '403':
          description: '`AuthInsufficientScope` — "This API key lacks the trade:execute scope"; or
            `AuthIdentityMismatch`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '500':
          description: The relayer client is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: The relayer's transaction lookup failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '503':
          description: API-key access to `polymarket` could not be checked (fails closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /exchanges/polymarket/imported/relay-info:
    post:
      operationId: getImportedRelayInfo
      summary: Read the relayer nonce (and GSN relay) for an imported Polymarket wallet
      description: |-
        The imported-wallet analogue of the deposit-wallet nonce endpoint: returns the relayer nonce and, for a legacy ProxyWallet (`sig_type: proxy`), the GSN relay address needed to construct the digest the browser signs. For a Gnosis Safe (`sig_type: safe`) `relay` is always `null`.
        Fetched server-side purely because Polymarket's relayer is CORS-blocked from browsers. The response is public information; the ownership check is belt-and-braces, not a secrecy boundary.
        > **Error shape.** Most 4xx/5xx here have an **empty `text/plain` body**; the `502` cases carry a plain-text reason (`relay-payload fetch failed: …` / `nonce fetch failed: …`). Scope and identity failures return the structured envelope.
        **Auth & scope.** Requires `trade:execute` for `polymarket` and identity + wallet ownership. No mutation gate, so a bare session JWT reaches it.
      tags:
      - Deposit wallet
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderImportedRelayInfoRequest'
      responses:
        '200':
          description: Relayer nonce, plus the GSN relay for `proxy`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderImportedRelayInfoResponse'
        '400':
          description: Malformed or unparseable `owner_address`. Empty body (`text/plain`). An identity
            mismatch instead returns the structured `AuthIdentityMismatch` body.
        '401':
          $ref: '#/components/responses/ExecUnauthorized'
        '403':
          description: Missing `trade:execute` scope, API-key access to `polymarket` disabled, or an
            identity mismatch. Structured body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '500':
          description: The relayer client is unavailable. Empty body (`text/plain`).
        '502':
          description: 'Plain-text `relay-payload fetch failed: <reason>` (proxy) or `nonce fetch failed:
            <reason>` (safe).'
        '503':
          description: API-key access to `polymarket` could not be checked (fails closed). Structured
            body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /v2/onchain/intent:
    post:
      operationId: createOnchainIntent
      summary: Build pinned unsigned on-chain transactions for self-signing (step 1 of 2)
      description: |-
        The on-chain counterpart to `POST /v2/orders/intent`, for the operations an order cannot do off-chain: one-time approvals, redemptions of resolved positions, CTF split/merge, and unwrapping wrapped collateral. Kairos builds the exact calldata, pins it under a single-use `payload_id` (300 s TTL), and hands you the EIP-155 signing digest for each transaction. **You** sign with your own EOA and **you** pay the gas; Kairos only broadcasts what you signed via `POST /v2/onchain/submit`.
        **Polygon / Polymarket only.** `chain_id` is pinned to `137`; there is no `provider` field.
        **No RPC at build time.** You supply `nonce` and `gas_price_wei`; the server does not fetch a nonce, quote gas, or preflight your balance. A stale nonce or an under-priced transaction surfaces at broadcast, not here.
        **Multi-leg.** `op=approvals` returns several transactions; sign each `signing_digest_hex` raw (no EIP-191 prefix) and submit the signatures in the same order.
        **Auth & scope.** Requires `trade:execute` for `polymarket` AND the `User.executionFastlaneEnabled` allowlist — the same gate as the order lane. `owner_address` must be a wallet registered to the authenticated caller. There is no service-token, admission, circuit-breaker or rate-limit gate on this route.
      tags:
      - Orders
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderOnchainIntentRequest'
      responses:
        '200':
          description: Pinned unsigned transactions plus the digests to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOnchainIntentResponse'
        '400':
          description: |-
            Exact `error` strings: `invalid owner_address`; `owner_address is not a registered wallet for
            this user`; `invalid gas_price_wei (expected a wei decimal string)`; `gas_price_wei must be > 0`;
            `condition_id is required for op=redeem`; `condition_id is required for op=<op>`;
            `amount (wei) is required for op=<op>`; `invalid amount (expected a wei decimal string)`;
            `amount must be > 0`; `wcol_amount (wei) is required for op=unwrap_wcol`;
            `invalid wcol_amount (expected a wei decimal string)`; `wcol_amount must be > 0`;
            `unsupported op: <other>`; or the calldata builder's own message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '401':
          $ref: '#/components/responses/ExecUnauthorized'
        '403':
          description: '`API key missing trade:execute scope`; `API-key access to polymarket is disabled`;
            `external-signing execution is not enabled for this account`; `external-signing authorization
            check failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '500':
          description: '`internal server error` — failed to serialize or store the intent, or a `payload_id`
            collision.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '503':
          description: '`API-key access to polymarket is unavailable` — the API-key access cache read failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
  /v2/onchain/submit:
    post:
      operationId: submitOnchainSigned
      summary: Broadcast your externally-signed on-chain transactions (step 2 of 2)
      description: |-
        Hand back the `payload_id` and one signature per transaction, in the order `POST /v2/onchain/intent` returned them. The server claims the stored intent atomically (single-use Redis `GETDEL` — a replay gets `400`), re-verifies each signature recovers to the declared owner AND to a wallet registered to you, reassembles the signed transactions, and broadcasts them **in nonce order, waiting up to 90 s for each to confirm** before sending the next.
        **Partial failure is possible and is reported.** If leg `i` fails to broadcast or revert-checks, the response is a `502` whose message lists the transaction hashes already mined (`already broadcast: [...]`). Earlier legs stay on chain; re-intent only the remainder.
        **Auth & scope.** Identical gate to `POST /v2/onchain/intent`.
      tags:
      - Orders
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderOnchainSubmitRequest'
      responses:
        '200':
          description: All transactions broadcast and confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOnchainSubmitResponse'
        '400':
          description: |-
            Exact `error` strings: `payload_id not found, expired, or already claimed`;
            `payload_id does not belong to authenticated user`; `payload_id expired`;
            `expected N signature(s), got M`; `tx <i>: invalid signature hex`;
            `tx <i>: <verification error>` (e.g. wrong length, or the signature does not recover to the
            declared owner); `tx <i>: signer is not a registered wallet`; `tx <i>: <reassembly error>`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '401':
          $ref: '#/components/responses/ExecUnauthorized'
        '403':
          description: Same set as `POST /v2/onchain/intent`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '500':
          description: '`internal server error` — Redis claim failure, the stored intent no longer
            deserializes, or the Polygon RPC is not configured on this deployment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '502':
          description: '`tx <i> failed to broadcast: <error> (already broadcast: [...])` — earlier
            transactions in the batch may already be mined.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '503':
          description: '`API-key access to polymarket is unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
  /exchanges/kalshi/balance:
    get:
      operationId: getKalshiOffchainBalance
      summary: Get the authenticated user's Kalshi account balance (self-custody / offchain lane)
      description: |-
        Fetches the caller's balance directly from Kalshi's API using their own stored Kalshi credentials — Kalshi trades off-exchange against the user's own Kalshi account rather than a Kairos-custodied identity (see `POST /exchanges/kalshi/enable-trading`). Requires the user to have already connected a Kalshi account; otherwise `404`.

        The `/exchanges/kalshi_offchain/*` paths remain as deprecated aliases.
        **Auth & scope.** Requires `position:read` for the `kalshi` provider.
      tags:
      - Orders
      x-kairos-auth: api-key
      x-kairos-scope: position:read
      responses:
        '200':
          description: Balance and portfolio value, in USD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderKalshiOffchainBalanceResponse'
        '401':
          $ref: '#/components/responses/ExecUnauthorized'
        '403':
          description: Missing `position:read` scope, or API-key access to `kalshi` is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '404':
          description: '`NO_CREDENTIALS` — "No Kalshi credentials found. Connect your account first."'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '500':
          description: '`INTERNAL_ERROR` ("Invalid credential type") or `CONFIG_ERROR` ("Internal configuration
            error").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '502':
          description: '`KALSHI_API_ERROR` — "Failed to fetch balance: <detail>".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
        '503':
          description: '`NOT_CONFIGURED` — Kalshi offchain trading is not configured on this deployment
            — or `PLATFORM_API_ACCESS_DENIED` when the API-key access check itself failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimpleErrorResponse'
  /exchanges/{exchange_id}/ctf/split:
    post:
      operationId: ctfSplit
      summary: Split collateral into a complete outcome-token set
      tags:
      - CTF
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      description: Converts `amount` of collateral into `amount` YES **and** `amount` NO tokens on-chain,
        without going through the order book. Does not open a market position — it mints equal tokens
        on every outcome; both legs are recorded as synthetic BUY fills at price 0.5 so history and PnL
        stay consistent. NegRisk (multi-outcome) markets are detected from the conditionId and routed
        through the NegRiskAdapter automatically. Transactions are custodially signed; deposit-wallet users
        execute gaslessly via the relayer. Identity (`user_id`/`turnkey_org_id`/`wallet_address`) is resolved
        server-side from the authenticated caller — body fields are optional and must match when present.
        Because this signs under the user's delegated key it is additionally gated on the installed Turnkey
        policy version (`403 AUTH_POLICY_OUTDATED` if stale) and, like the other mutation endpoints, on the
        service-token/CSRF/API-key check that the API-key triple satisfies automatically. Failures return
        the structured `OrderErrorResponse` envelope — match on `error_details.code`.
      parameters:
      - &id004
        name: exchange_id
        in: path
        required: true
        description: Venue. Split/merge require an on-chain CTF (polymarket, predictfun). Kalshi settles
          off-exchange — redeem only.
        schema:
          type: string
          enum:
          - polymarket
          - predictfun
          - kalshi
          - opinion
        example: polymarket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCtfSplitMergeRequest'
            example:
              condition_id: '0x1234abcd'
              market_id: '570362'
              amount: 100
      responses:
        '200':
          description: Split executed on-chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCtfSplitResponse'
        '400': &id005
          description: 'Invalid `condition_id`, non-positive `amount`, an exchange that doesn''t support
            the action (e.g. split/merge on Kalshi → `EXCHANGE_UNSUPPORTED`), or insufficient collateral
            (split) / outcome tokens (merge) → `FUNDS_INSUFFICIENT_USDC` or `FUNDS_INSUFFICIENT_BALANCE`.
            An insufficient-funds reject on this service is a `400`; there is no `402` anywhere in this
            API.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401': &id006
          $ref: '#/components/responses/ExecUnauthorized'
        '403': &id008
          description: Identity fields conflict with the authenticated caller (`AUTH_IDENTITY_MISMATCH`),
            wallet not owned by the caller, missing `trade:execute` scope, API-key access to this provider
            disabled, or installed Turnkey policies behind the version this path requires
            (`AUTH_POLICY_OUTDATED`, action `update_policies` — split, merge and redeem all enforce it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404': &id010
          description: '`VALIDATION_MARKET_NOT_FOUND` — the condition/market could not be resolved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '500': &id011
          description: '`INTERNAL_ERROR` / `DATABASE_ERROR` / `SIGNATURE_ERROR` — bookkeeping or custodial
            signing failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502': &id009
          description: On-chain submission or the RPC call failed (`NETWORK_ERROR` / `EXCHANGE_ERROR`)
            — generally safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '504':
          description: '`NETWORK_TIMEOUT` — the on-chain call timed out; the transaction may still land.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /exchanges/{exchange_id}/ctf/merge:
    post:
      operationId: ctfMerge
      summary: Merge a complete outcome-token set back into collateral
      tags:
      - CTF
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      description: Burns `amount` YES **and** `amount` NO tokens and returns `amount` collateral — recover
        capital from matched inventory without waiting for resolution. Requires holding at least `amount`
        of every outcome token. Recorded as two synthetic SELL fills at price 0.5. NegRisk routing, custodial
        signing, the Turnkey policy-version gate, the service-token/CSRF/API-key mutation gate, and
        server-side identity resolution behave exactly as on split.
      parameters:
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCtfSplitMergeRequest'
            example:
              condition_id: '0x1234abcd'
              market_id: '570362'
              amount: 290
      responses:
        '200':
          description: Merge executed on-chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCtfMergeResponse'
        '400': *id005
        '401': *id006
        '403': *id008
        '404': *id010
        '500': *id011
        '502': *id009
  /exchanges/{exchange_id}/redeem:
    post:
      operationId: ctfRedeem
      summary: Redeem winning outcome tokens after resolution
      tags:
      - CTF
      x-kairos-auth: api-key
      x-kairos-scope: trade:execute
      description: 'After a market resolves on-chain, converts the winning outcome tokens into collateral.
        Only the winning side is needed (losing shares are worthless). NegRisk redeems unwrap wrapped
        collateral back to the base asset automatically. `db_update_failed: true` in the response means
        the on-chain redeem SUCCEEDED but the position-state bookkeeping write failed — funds are safe;
        retry the call to fix the bookkeeping. Failures return the structured `OrderErrorResponse`
        envelope — match on `error_details.code`.'
      parameters:
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCtfRedeemRequest'
            example:
              condition_id: '0x1234abcd'
              market_id: '570362'
      responses:
        '200':
          description: Redeem executed on-chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCtfRedeemResponse'
        '400': *id005
        '401': *id006
        '403': *id008
        '404': *id010
        '409':
          description: 'Venue shows resolved but on-chain payouts are still all zero
            (`VALIDATION_MARKET_NOT_SETTLED_ON_CHAIN`). Transient — wait for the dispute window and
            retry; primary action is `retry`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '500':
          description: Unexpected fault, or a sponsored redeem that needs manual review
            (`INTERNAL_ERROR`; may include `contact_support`). Do not blindly retry wedged sponsored
            requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502': *id009

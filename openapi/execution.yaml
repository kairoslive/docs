                $ref: '#/components/schemas/OrderErrorResponse'
  /exchanges/polymarket/deposit-wallet/safe-balances:
    post:
      operationId: getDepositWalletSafeBalances
      summary: Read USDC, USDC.e and pUSD balances on the deposit wallet
      description: |-
        On-chain balances for the DEPOSIT WALLET itself, including bridged USDC.e (field name `usdce`). Base-unit decimal strings at 6 decimals.
        Unlike `eoa-balances`, a non-deposit-wallet account is a `400` here rather than a zeroed `200`.
        **Auth & scope.** Requires `position:read` for `polymarket` and identity ownership. No mutation gate.
      tags:

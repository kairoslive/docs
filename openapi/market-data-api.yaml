# Kairos Market Data API — OpenAPI 3.1 specification.
# Canonical source of truth for the public API reference.
#
# Consumers:
#   - services/web/scripts/build-openapi.ts        -> /openapi/market-data-api.{yaml,json} static assets
#   - services/web/scripts/generate-api-reference.ts -> docs 'API Reference' page + try-it panels
#   - services/market-data-api/internal/server/openapi_coverage_test.go -> CI check that every
#     registered route is documented here (and nothing phantom is)
#
# When you add or change a Market Data API route, update this file in the same PR —
# the coverage test fails otherwise.
openapi: 3.1.0
# Every /v1 operation on this service is reachable on the anonymous free
# tier (per-IP budgets) — the reference UI badges them "free" by default.
x-kairos-anonymous: true
info:
  title: Kairos Market Data API
  version: 1.2.0
  summary: Read-only prediction and perpetual market data across venues.
  description: |
    The Kairos Market Data API provides read-only access
    to normalized prediction-market data across every venue Kairos integrates:
    OHLCV candles, the trade tape, market metadata, resolution lifecycles, and
    latest mark prices.

    ## No signup required

    Every endpoint works **without credentials** on the anonymous free tier,
    rate-limited per source IP (120 light units/min, 20 heavy units/min). Try any
    request from the interactive docs at
    [app.kairos.trade/docs/market-data](https://app.kairos.trade/docs/market-data)
    or straight from curl. For production budgets (1,200 light and 150 heavy
    units/min by default, raisable per credential), request an API key from the
    Kairos team.

    ## Authentication

    Three modes, resolved per request:

    - **Anonymous** — no credential headers at all. Free tier, IP-keyed limits.
    - **API key** — `X-Client-Id` + `X-Api-Key` + `X-Api-Secret` headers
      (all three; partial header sets are rejected with 401 rather than
      degrading to anonymous).
    - **First-party session** — `Authorization: Bearer` JWT (Kairos web app
      sessions only; not offered to API consumers).

    Resolution order is fixed: an `Authorization` header takes the bearer
    path, any of the three API-key headers takes the API-key path, and only
    a request carrying neither is eligible for the anonymous tier.

    On the API-key path, an unreachable credential store surfaces on **any**
    endpoint as `500` with `code: internal` and the message
    `authentication backend unavailable`. A source IP outside a credential's
    whitelist is `403 ip_not_whitelisted`; that is the only 403 this service
    emits.

    ## Rate limiting

    Weighted sliding-window budgets over one minute, in **units**, across two
    independent buckets: light (candles, metadata, resolutions, trade
    metrics) and heavy (trade history, marks, perpetual snapshots). Most
    requests cost 1 unit; larger requests may consume more of your quota —
    each operation's `x-kairos-rate-limit` states its exact cost model.
    Every admitted response carries `X-RateLimit-Bucket`, `X-RateLimit-Tier`,
    `X-RateLimit-Remaining`, and `X-RateLimit-Reset`; 429s add `Retry-After`.

    A separate per-IP admission gate runs *before* authentication to keep a
    flood off shared infrastructure. It also answers 429 `rate_limited`, but
    with `Retry-After: 60` and no `X-RateLimit-*` headers.

    Redis backs the weighted limiter and it fails **closed**: if it is
    unreachable the request is rejected with 503 `rate_limiter_unavailable`
    rather than let through unmetered.

    ## Conventions

    - **Prediction-market prices** are on the 0–100 scale (implied probability
      × 100) in the prediction candle, trade, and mark endpoints. Prediction
      USD notional = `size × price / 100`.
    - **Perpetual prices are direct venue prices**, not probabilities and not
      0–100 values. Perpetual quantities retain their declared native unit
      (`base_asset` or `contracts`). Never divide a perpetual price by 100 or
      compute contract notional without the instrument's authoritative contract
      multiplier; the snapshot does not synthesize a cross-venue notional.
    - **Hyperliquid is two products on one venue.** Its HIP-4 outcome markets
      are prediction markets, read with `provider=hyperliquid` on the
      prediction endpoints; its perpetuals are bare coins read under
      `/v1/perpetuals/hyperliquid/{instrument}/snapshot`, where the instrument
      is the canonical id `hl-mainnet-<symbol>-<quote>` (e.g.
      `hl-mainnet-btc-usdt`). Different id schemes, different price semantics;
      they are never interchangeable.
    - **Errors** all use one envelope:
      `{"error": {"code": "...", "message": "..."}}`.
    - **Providers** are case-insensitive; `kalshi_offchain` aliases `kalshi`,
      `dome` aliases `polymarket`, and `opinion` is resolvable for historic
      reads only.
  contact:
    name: Kairos
    url: https://app.kairos.trade/docs/market-data
  termsOfService: https://kairos.trade/terms
servers:
- url: https://md.kairos.trade
  description: Production
- url: https://staging-md.kairos.trade
  description: Staging
security:
- {}
- apiKeyClientId: []
  apiKeyKey: []
  apiKeySecret: []
tags:
- name: Candles
  description: OHLCV candle series (1s → 1d), JSON or compact columnar binary.
- name: Trades
  description: Trade tape and aggregate volume metrics.
- name: Markets
  description: Market metadata, batch lookup, identifier resolution, and enumeration.
- name: Resolutions
  description: Resolution outcomes and UMA-style lifecycle state/timelines.
- name: Marks
  description: Latest mark (last trade price) per outcome token.
- name: Perpetuals
  description: Live perpetual books, trades, candles, funding, and market state. Beta.
- name: Status
  description: Health and readiness probes.
paths:
  /health:
    get:
      operationId: getHealth
      x-kairos-auth: public
      x-kairos-rate-limit: none — registered directly on the mux, outside the auth and rate-limit middleware chain
      summary: Liveness probe
      tags:
      - Status
      security: []
      description: |
        Trivially cheap liveness check used by the load balancer. Touches no dependencies and is never rate-limited.
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      operationId: getReady
      x-kairos-auth: public
      x-kairos-rate-limit: none — registered directly on the mux, outside the auth and rate-limit middleware chain
      summary: Readiness probe
      tags:
      - Status
      security: []
      description: |
        Probes the two dependencies in order — ClickHouse (`SELECT 1`, 3s deadline) then Redis (`PING`) — and returns 503 naming the first one that fails.
      responses:
        '200':
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                type: object
                required:
                - ready
                properties:
                  ready:
                    type: boolean
                    example: true
        '503':
          description: A dependency is unreachable.
          content:
            application/json:
              schema:
                type: object
                required:
                - ready
                - failing
                properties:
                  ready:
                    type: boolean
                    example: false
                  failing:
                    type: string
                    description: Name of the unavailable dependency.
                    enum:
                    - clickhouse
                    - redis
                    example: clickhouse
  /v1/markets/{provider}/{market_id}:
    get:
      operationId: getMarket
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit per request
      summary: Get one market's metadata
      tags:
      - Markets
      description: |-
        Returns the full metadata document for a single market. Rate-limit bucket: LIGHT.

        Provider is resolved case-insensitively against the registry (aliases such as `kalshi_offchain` → `kalshi` and `dome` → `polymarket` are accepted and normalized before the lookup).

        Response is ETagged (strong ETag) with a `Cache-Control` header; a matching `If-None-Match` returns 304. Responses ≥1KB are gzip-compressed when the client sends `Accept-Encoding: gzip`.
      parameters:
      - name: provider
        in: path
        required: true
        description: Venue identifier. Case-insensitive; aliases are normalized (`kalshi_offchain`→`kalshi`,
          `dome`→`polymarket`). Unknown values are rejected with 400.
        schema:
          type: string
          enum:
          - kalshi
          - polymarket
          - opinion
          - predictfun
          - hyperliquid
          - kalshi_offchain
          - dome
        example: polymarket
      - name: market_id
        in: path
        required: true
        description: Venue-specific market identifier (e.g. a Kalshi ticker, or a Polymarket/predict.fun
          numeric market id or condition id).
        schema:
          type: string
        example: '1897040'
      responses:
        '200':
          description: Market metadata document.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
              example:
                exchange_id: polymarket
                market_id: '1897040'
                condition_id: 0xabc123...
                event_id: evt-4521
                title: Will BTC close above $120k on July 31?
                neg_risk: false
                tick_size: 0.01
                taker_base_fee_bps: 200
                fees_enabled: true
                category: Crypto
                group_slug: btc-price-2026
                fee_type: standard
                status: active
                image: https://cdn.kairos.trade/markets/1897040.png
                icon: https://cdn.kairos.trade/markets/1897040-icon.png
                end_date: '2026-07-31T23:59:59Z'
                open_time: '2026-01-01T00:00:00Z'
                outcomes:
                - outcome: 'Yes'
                  normalized_outcome: 'yes'
                  token_id: '18812649149814341758733697580460697418474693998558159483117'
                - outcome: 'No'
                  normalized_outcome: 'no'
                  token_id: '88123409981238091823740918237409182734091823740918237409182'
                raw: {}
        '304':
          description: Not Modified — `If-None-Match` matched the current ETag.
        '400':
          description: Unknown provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: unknown provider "coinbase"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '404':
          description: Market not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: market not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: '`internal` / `authentication backend unavailable` — the API-key path could not
            reach the credential store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal
                  message: authentication backend unavailable
        '502':
          description: Market lookup failed upstream for a reason other than not-found/cold/disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: upstream
                  message: metadata cache request failed
        '503':
          description: 'Either the market data source is still warming up (`cache_cold`, with a `Retry-After: 5`
            header — retry shortly), not configured for this deployment (`unavailable`), or the
            rate limiter is unreachable (`rate_limiter_unavailable`, fails closed).'
          headers:
            Retry-After:
              schema:
                type: string
              description: Present only for `cache_cold`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: cache_cold
                  message: metadata cache warming up, retry shortly
      x-kairos-bucket: light
  /v1/markets/batch:
    post:
      operationId: batchGetMarkets
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit per request, regardless of batch size
      summary: Fetch multiple markets by id, one provider at a time
      tags:
      - Markets
      description: |-
        Fetches metadata for one provider and up to 200 market ids in a single call. Rate-limit bucket: LIGHT, flat cost of 1 unit regardless of batch size (unlike `/v1/market-identifiers/resolve`, this endpoint does NOT charge per-item). Not cached (`Cache-Control: no-store`) — every call returns live data.

        Request body is capped at 1 MiB, and `market_ids` is capped at 200 entries per request (`market_ids exceeds maximum 200`).

        Ids that cannot be found are omitted from `markets` and listed in `misses`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketBatchRequest'
            example:
              provider: polymarket
              market_ids:
              - '1897040'
              - '1897041'
              - does-not-exist
      responses:
        '200':
          description: Batch lookup result, keyed by market_id.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBatchResponse'
              example:
                exchange_id: polymarket
                markets:
                  '1897040':
                    exchange_id: polymarket
                    market_id: '1897040'
                    condition_id: 0xabc123...
                    event_id: evt-4521
                    title: Will BTC close above $120k on July 31?
                    neg_risk: false
                    tick_size: 0.01
                    outcomes:
                    - outcome: 'Yes'
                      normalized_outcome: 'yes'
                      token_id: '18812649149814341758733697580460697418474693998558159483117'
                    raw: {}
                misses:
                - does-not-exist
        '400':
          description: Unreadable/invalid JSON body, unknown provider, missing `market_ids`, or `market_ids`
            exceeds the maximum of 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                too_many:
                  value:
                    error:
                      code: invalid_request
                      message: market_ids exceeds maximum 200
                empty:
                  value:
                    error:
                      code: invalid_request
                      message: market_ids is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '404':
          description: The upstream metadata cache answered the batch lookup with 404. Individual ids that
            are simply absent come back in `misses` with a 200 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: market not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: '`internal` / `authentication backend unavailable` — the API-key path could not
            reach the credential store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal
                  message: authentication backend unavailable
        '502':
          description: The metadata cache answered with an unexpected status (`upstream` / `metadata cache
            request failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: upstream
                  message: metadata cache request failed
        '503':
          description: '`cache_cold` — the metadata cache is still warming (with `Retry-After: 5`); `unavailable`
            — no metadata cache is configured for this deployment; or `rate_limiter_unavailable`.'
          headers:
            Retry-After:
              schema:
                type: string
              description: Present only for `cache_cold`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-kairos-bucket: light
  /v1/market-identifiers/resolve:
    post:
      operationId: resolveMarketIdentifiers
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit per submitted item — admitted at 1 unit, then `len(requests) - 1` charged as a deferred charge
      summary: Resolve venue-specific identifiers to canonical Kairos market ids
      tags:
      - Markets
      description: |-
        Maps up to 200 venue-specific identifiers — market-scoped (a venue's market id, ticker, or condition-like identifier) or outcome-scoped (an outcome/token id) — onto Kairos's canonical `market_id` for that provider. Requests are grouped by (provider, scope) for efficient batch resolution. Not cached (`Cache-Control: no-store`).

        Rate-limit bucket: LIGHT, but with a distinct cost model from the other batch endpoints — the request is admitted at a base cost of 1 unit, then the service charges the FULL request-item count (`len(requests) - 1` additional units) as a deferred charge immediately after the body is parsed and size-validated, before any per-item validation runs. This means a batch of N requests always costs N light units even if individual items subsequently fail validation (e.g. a bad `scope`) and the call returns 400.

        Unresolved identifiers are reported with `found: false` and `market_id: null` rather than causing the whole call to fail.

        The request body is capped at 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketIdentifierResolveRequestBody'
            example:
              requests:
              - provider: polymarket
                identifier: '18812649149814341758733697580460697418474693998558159483117'
                scope: outcome
              - provider: kalshi
                identifier: KXBTC-26JUL
                scope: market
      responses:
        '200':
          description: Per-item resolution results, in request order.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketIdentifierResolveResponse'
              example:
                results:
                - provider: polymarket
                  identifier: '18812649149814341758733697580460697418474693998558159483117'
                  scope: outcome
                  found: true
                  market_id: '1897040'
                - provider: kalshi
                  identifier: KXBTC-26JUL
                  scope: market
                  found: true
                  market_id: KXBTC-26JUL
        '400':
          description: 'Unreadable/invalid JSON body, empty `requests`, `requests` exceeds 200, an item''s
            `provider` is unknown, an item''s `identifier` is empty after trimming, or an item''s `scope`
            is not `market` or `outcome`. Per-item messages include the offending index (e.g. `requests[2].scope
            must be market or outcome`); the unknown-provider message does not (it reads `unknown provider
            "…"`). Validation stops at the first bad item.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: requests[0].scope must be market or outcome
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          description: 'The upstream metadata cache answered one of the (provider, scope) group lookups
            with 404. Identifiers that are merely unresolvable come back as `found: false` with a 200.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: market not found
        '500':
          description: Response encoding failed (internal error, not upstream).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal
                  message: market identifier response encoding failed
        '502':
          description: A (provider, scope) group lookup failed against the metadata cache — an unexpected
            upstream status, an undecodable body, or a resolved entry missing its `market_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: upstream
                  message: metadata cache request failed
        '503':
          description: '`cache_cold` (metadata cache still warming, `Retry-After: 5`), `unavailable` (no
            metadata cache configured), or `rate_limiter_unavailable`.'
          headers:
            Retry-After:
              schema:
                type: string
              description: Present only for `cache_cold`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-kairos-bucket: light
  /v1/markets:
    get:
      operationId: listMarkets
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit per request
      summary: Paginate active markets for one provider
      tags:
      - Markets
      description: |-
        Enumerates active markets for a single provider, cursor-paginated. Rate-limit bucket: LIGHT.

        The response is ETagged (strong ETag) with a `Cache-Control` header; a matching `If-None-Match` returns 304.

        Returns 503 (`cache_cold`) until the active-market listing has been populated for the requested provider at least once.
      parameters:
      - name: provider
        in: query
        required: true
        description: Venue identifier. Case-insensitive; unknown values are rejected with 400.
        schema:
          type: string
          enum:
          - kalshi
          - polymarket
          - opinion
          - predictfun
          - hyperliquid
          - kalshi_offchain
          - dome
        example: kalshi
      - name: limit
        in: query
        required: false
        description: Page size. Must be an integer in [1, 250].
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 100
        example: 100
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor from a previous response's `next_cursor`.
        schema:
          type: string
      responses:
        '200':
          description: Page of active markets.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketListResponse'
              example:
                exchange_id: kalshi
                markets:
                - exchange_id: kalshi
                  market_id: KXBTC-26JUL
                  condition_id: ''
                  event_id: KXBTC-26JUL-EVT
                  title: Bitcoin price above $120k on July 31?
                  neg_risk: false
                  outcomes:
                  - outcome: 'Yes'
                    normalized_outcome: 'yes'
                    token_id: KXBTC-26JUL-YES
                    outcome_index: 0
                    side: 'yes'
                  - outcome: 'No'
                    normalized_outcome: 'no'
                    token_id: KXBTC-26JUL-NO
                    outcome_index: 1
                    side: 'no'
                  raw: {}
                count: 1
                next_cursor: eyJvZmZzZXQiOjEwMH0=
                has_more: true
        '304':
          description: Not Modified — `If-None-Match` matched the current ETag.
        '400':
          description: Missing/unknown `provider`, or `limit` out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: limit must be an integer in [1, 250]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '404':
          description: The upstream metadata cache answered the listing request with 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: market not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: '`internal` / `authentication backend unavailable` — the API-key path could not
            reach the credential store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal
                  message: authentication backend unavailable
        '502':
          description: The metadata cache answered with an unexpected status (`upstream` / `metadata cache
            request failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: upstream
                  message: metadata cache request failed
        '503':
          description: '`cache_cold` — the provider''s active-market listing has not been populated yet (`Retry-After:
            5`); `unavailable` — not configured for this deployment; or `rate_limiter_unavailable`.'
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-kairos-bucket: light
  /v1/resolutions:
    get:
      operationId: getResolutions
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit per request
      summary: Batch resolution fractions for up to 200 markets
      tags:
      - Resolutions
      description: |-
        Returns the resolved YES-side fraction (payout_numerators[0] / sum) for each requested market that has resolved; unresolved markets are omitted entirely from the response (never a guessed value). Providers are keyed either directly by market id/ticker (kalshi) or by their on-chain condition id (polymarket, predictfun, opinion). Rate-limit bucket: LIGHT.

        For scalar/range markets with no payout numerators, the venue's settled value is used as the fraction instead of a YES/NO split (kalshi-keyed providers only).

        The response is ETagged (strong ETag) with a `Cache-Control` header; a matching `If-None-Match` returns 304.
      parameters:
      - name: provider
        in: query
        required: true
        description: Venue identifier. Any registered provider (including disabled ones, for historic
          reads).
        schema:
          type: string
          enum:
          - kalshi
          - polymarket
          - opinion
          - predictfun
          - hyperliquid
          - kalshi_offchain
          - dome
        example: kalshi
      - name: market_ids
        in: query

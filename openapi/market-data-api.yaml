  /v1/trades/metrics:
    get:
      operationId: getTradeMetrics
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit per request
      summary: Aggregate trade volume/pressure metrics for a contract window
      description: |
        Returns aggregated volume and buy-pressure metrics for a (provider, contract_id) over
        a trailing window, computed from the same deduplicated trade data as `/v1/trades`.

        **Two query shapes depending on provider**, because the platform cannot generically
        infer which side of a market is "Yes":
        - **Kalshi**: `outcome_0` is the side where `outcome` or `token_id`
          (case-insensitive) equals `"yes"`, `outcome_1` is `"no"`.
        - **All other providers**: volumes are grouped by `token_id` and the **top 2 tokens by
          volume** are reported as `outcome_0`/`outcome_1` — a volume ranking, not a
          guaranteed Yes/No mapping.

        USD volume is always `size * price / 100` (price is cents 0–100 for every provider).
        `outcome_0_volume_share_pct` defaults to 50.0 when both outcome volumes are zero.
        `coverage_pct` measures how much of the requested window is actually backed by data
        and is 0 when no trades are found in the window.

        **Rate-limit cost (LIGHT bucket)**: flat 1 unit per request.

        **Caching**: responses are cached for 10s per replica (with singleflight coalescing) to
        absorb duplicate concurrent requests. `Cache-Control: private, max-age=5`, no ETag —
        this route never returns 304.
      tags:
      - Trades
      parameters:
      - name: provider
        in: query
        required: true
        description: |
          Venue identifier, case-insensitive. `kalshi_offchain` aliases `kalshi`; `dome` aliases `polymarket`. Whether `provider` resolves to Kalshi determines which aggregation query runs — see the operation description.
        schema:
          type: string
          enum:
          - kalshi
          - kalshi_offchain
          - polymarket
          - dome
          - opinion
          - predictfun
          - hyperliquid
        example: polymarket
      - name: contract_id
        in: query
        required: true
        description: Venue-scoped contract/token identifier to compute metrics for.
        schema:
          type: string
        example: '0x8b1c119419f622e21fc576ec8e9c2c07b2c1b09babf0e1f3d1cb9bfc1a8f9c2'
      - name: window_seconds
        in: query
        required: false
        description: |
          Trailing window, in seconds, measured back from the current server time. Valid range [3600, 86400]; out-of-range or non-integer values are rejected with 400.
        schema:
          type: integer
          minimum: 3600
          maximum: 86400
          default: 86400
        example: 3600
      responses:
        '200':
          description: |
            Aggregated metrics for the window. Present with all-zero volumes (and `coverage_pct: 0`) rather than a 404 when no trades exist.
          headers:
            X-RateLimit-Bucket:
              schema:
                type: string
                example: light
            X-RateLimit-Tier:
              schema:
                type: string
                example: api-key
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeMetricsResponse'
              example:
                metrics:
                  volume_usd: 184032.55
                  outcome_0_volume_usd: 121004.1
                  outcome_1_volume_usd: 63028.45
                  outcome_0_volume_share_pct: 65.8
                  trade_count: 5123
                  window_seconds: 3600
                  coverage_pct: 97.2
        '400':
          description: |
            Validation failure: missing `provider`, unrecognized `provider`, missing `contract_id`, or `window_seconds` outside [3600, 86400].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: window_seconds must be an integer in [3600, 86400]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':

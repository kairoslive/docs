          type: integer
          format: int64
          description: Inclusive start of the candle's half-open interval, in Unix nanoseconds.
        interval_end_ns:
          type: integer
          format: int64
          description: Exclusive end of the candle's half-open interval, in Unix nanoseconds.
        open:
          $ref: '#/components/schemas/PerpetualPositiveDecimalString'
        high:
          $ref: '#/components/schemas/PerpetualPositiveDecimalString'
        low:
          $ref: '#/components/schemas/PerpetualPositiveDecimalString'
        close:
          $ref: '#/components/schemas/PerpetualPositiveDecimalString'
        native_volume:
          $ref: '#/components/schemas/PerpetualNonNegativeDecimalString'
          description: |
            Exact volume in this candle's `native_volume_unit`; no cross-venue
            notional is implied. This unit is independent of
            `instrument_context.quantity_unit`.
        native_volume_unit:
          type: string
          enum: [base_asset, contracts]
          description: |
            Native unit reported by the candle source. It may differ from the
            book and trade quantity unit for the same instrument.
        trade_count:
          type:
          - integer
          - 'null'
          description: Venue-reported trade count, or null when unavailable.
        finality:
          type: string
          enum: [open, closed_unconfirmed]
          description: |
            `open` means the interval has not closed. `closed_unconfirmed` means
            its half-open interval has ended, but the preview does not claim an
            immutable or venue-confirmed final candle.
    PerpetualFundingRate:
      type: object
      additionalProperties: false
      required:
      - rate
      - phase
      - effective_time_ns
      - calculated_time_ns
      - rate_period_seconds
      - payment_interval_seconds
      - sign_convention
      - funding_price
      - funding_price_type
      properties:
        rate:
          $ref: '#/components/schemas/PerpetualExactDecimalString'
          description: |
            Exact signed funding rate in the venue's reported period convention.
            Do not infer percentage scaling or annualize without the period fields.
        phase:
          type: string
          enum: [estimate, final]
        effective_time_ns:
          type: integer
          format: int64
        calculated_time_ns:
          type:
          - integer
          - 'null'
          format: int64
          description: Calculation time in Unix nanoseconds, or null when unavailable.
        rate_period_seconds:
          type:
          - integer
          - 'null'
          description: Period represented by `rate`, or null when the venue does not provide it.
        payment_interval_seconds:
          type:
          - integer
          - 'null'
          description: Funding payment interval, or null when unavailable.
        sign_convention:
          type: string
          const: positive_longs_pay
        funding_price:
          anyOf:
          - $ref: '#/components/schemas/PerpetualPositiveDecimalString'
          - type: 'null'
          description: Venue funding price, or null when unavailable.
        funding_price_type:
          type:
          - string
          - 'null'
          description: Identity of `funding_price`, such as mark, or null with no price.
    PerpetualSnapshot:
      type: object
      additionalProperties: false
      description: |
        Live perpetual snapshot, in beta. Prices are direct venue prices.
        Quantities retain native units. This object intentionally carries no
        synthesized notional: consumers must inspect `instrument_context` and
        must not convert contract quantities when `contract_multiplier` is null.
      required:
      - venue
      - environment
      - integration_id
      - canonical_instrument_id
      - venue_instrument_id
      - instrument_context
      - book
      - market_state
      - trades
      - candles
      - funding
      - source
      - fetched_at_ns
      properties:
        venue:
          type: string
          enum: [hyperliquid, polymarket_perps, kalshi_margin]
        environment:
          type: string
          minLength: 1
          description: Venue environment for this source identity.
        integration_id:
          type: string
          minLength: 1
          description: Kairos integration and routing identity.
        canonical_instrument_id:
          type: string
          minLength: 1
          description: Stable Kairos perpetual instrument identity.
        venue_instrument_id:
          type: string
          description: Exact venue-native instrument identifier.
        instrument_context:
          $ref: '#/components/schemas/PerpetualInstrumentContext'
        book:
          $ref: '#/components/schemas/PerpetualOrderBookSnapshot'
        market_state:
          $ref: '#/components/schemas/PerpetualMarketState'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/PerpetualPublicTrade'
          description: Recent public trades in venue-native quantity units.
        candles:
          type: array
          items:
            $ref: '#/components/schemas/PerpetualTradeCandle'
          description: One-minute trade candles in venue-native volume units.
        funding:
          type: array
          items:
            $ref: '#/components/schemas/PerpetualFundingRate'
          description: Final or estimated funding observations using positive_longs_pay sign convention.
        source:
          type: string
          const: venue_public_api
        fetched_at_ns:
          type: integer
          format: int64
          description: Kairos fetch completion time in Unix nanoseconds.
    ErrorResponse:
      type: object
      description: Canonical error envelope emitted by every Market Data API endpoint.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: invalid_request
            message:
              type: string
              description: Human-readable detail.
              example: market_ids exceeds maximum 200
    MarketOutcome:
      type: object
      description: One outcome/token entry within a market.
      required:
      - outcome
      - normalized_outcome
      - token_id
      properties:
        outcome:
          type: string
          description: Display-layer outcome label as provided by the venue. For kalshi, this can legitimately
            be duplicated across YES/NO (it's a team/threshold subtitle, not a binary identity) — use
            `outcome_index`/`side` for execution logic on those markets.
          example: 'Yes'
        normalized_outcome:
          type: string
          description: Lowercased/normalized form of `outcome`.
          example: 'yes'
        token_id:
          type: string
          description: Venue-specific outcome/token identifier.
          example: '18812649149814341758733697580460697418474693998558159483117'
        outcome_index:
          type: integer
          description: Stable binary position (0 or 1). Only present for providers keyed directly by market
            id (e.g. kalshi), and only for the first two outcome entries.
          example: 0
        side:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: Stable binary side matching `outcome_index`. Same provider scope as `outcome_index`.
          example: 'yes'
    Market:
      type: object
      description: Full market metadata document. Resolution-state fields (`resolution_status`,
        `payout_numerators`, `resolved_ts`, `proposed_price`, `challenge_window_ends_at`) are
        present in the payload only when set — the overwhelming majority of markets are
        unresolved and omit all five.
      required:
      - exchange_id
      - market_id
      - condition_id
      - event_id
      - title
      - neg_risk
      - outcomes
      - raw
      properties:
        exchange_id:
          type: string
          description: Canonical provider name.
          example: polymarket
        market_id:
          type: string
          example: '1897040'
        condition_id:
          type: string
          description: On-chain condition id for CTF venues; empty string for kalshi.
          example: 0xabc123...
        event_id:
          type: string
          description: Grouping event id (multi-market events); may be empty.
          example: evt-4521
        title:
          type: string
          example: Will BTC close above $120k on July 31?
        neg_risk:
          type: boolean
          description: Whether this market is part of a Polymarket negative-risk group.
          example: false
        tick_size:
          type:
          - number
          - 'null'
          description: Minimum price increment (0, 1) exclusive.
          example: 0.01
        taker_base_fee_bps:
          type:
          - integer
          - 'null'
          example: 200
        fees_enabled:
          type:
          - boolean
          - 'null'
        category:
          type:
          - string
          - 'null'
          example: Crypto
        group_slug:
          type:
          - string
          - 'null'
          example: btc-price-2026
        fee_type:
          type:
          - string
          - 'null'
          example: standard
        status:
          type:
          - string
          - 'null'
          description: Venue-reported market status, e.g. active/closed. Populated inconsistently across
            providers.
          example: active
        image:
          type:
          - string
          - 'null'
          description: Display image URL.
        icon:
          type:
          - string
          - 'null'
          description: Display icon URL.
        end_date:
          type:
          - string
          - 'null'
          description: ISO8601 UTC market end/close time.
          example: '2026-07-31T23:59:59Z'
        open_time:
          type:
          - string
          - 'null'
          description: ISO8601 UTC market open/listing time.
          example: '2026-01-01T00:00:00Z'
        resolution_status:
          type: string
          description: Present only when the market has resolution state.
          example: resolved
        payout_numerators:
          type: array
          items:
            type: integer
            format: uint64
          description: Present only when non-empty (i.e. the market has resolved with a payout vector).
          example:
          - 1
          - 0
        resolved_ts:
          type: string
          description: ISO8601 UTC. Present only when set.
          example: '2026-07-16T00:00:00Z'
        proposed_price:
          type: number
          description: Present only when set (a resolution price has been proposed).
          example: 1.0
        challenge_window_ends_at:
          type: string
          description: ISO8601 UTC. Present only when set.
          example: '2026-07-16T02:00:00Z'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MarketOutcome'
        raw:
          type: object
          description: Full, unmodified provider-specific market document. Shape varies by
            provider. Treat as opaque/pass-through.
    MarketBatchRequest:
      type: object
      description: Request body for POST /v1/markets/batch.
      required:
      - provider
      - market_ids
      properties:
        provider:
          type: string
          enum:
          - kalshi
          - polymarket
          - opinion
          - predictfun
          - hyperliquid
          - kalshi_offchain
          - dome
        market_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 200
          description: Up to 200 market ids for the given provider.
    MarketBatchResponse:
      type: object
      description: Response body for POST /v1/markets/batch.
      required:
      - exchange_id
      - markets
      - misses
      properties:
        exchange_id:
          type: string
          example: polymarket
        markets:
          type: object
          description: Map of market_id → Market, for every requested id that was found.
          additionalProperties:
            $ref: '#/components/schemas/Market'
        misses:
          type: array
          items:
            type: string
          description: market_ids from the request that were not found.
    MarketIdentifierResolveRequestItem:
      type: object
      required:
      - provider
      - identifier
      - scope
      properties:
        provider:
          type: string
          enum:
          - kalshi
          - polymarket
          - opinion
          - predictfun
          - hyperliquid
          - kalshi_offchain
          - dome
        identifier:
          type: string
          description: Venue-specific identifier to resolve. Must be non-empty after trimming.
          example: '18812649149814341758733697580460697418474693998558159483117'
        scope:
          type: string
          enum:
          - market
          - outcome
          description: '`market` resolves via the venue''s market id/ticker/condition-like identifier;
            `outcome` resolves via an outcome/token id. No other scope values are accepted (case-insensitive
            on input).'
    MarketIdentifierResolveRequestBody:
      type: object
      required:
      - requests
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/MarketIdentifierResolveRequestItem'
          minItems: 1
          maxItems: 200
    MarketIdentifierResolveResult:
      type: object
      required:
      - provider
      - identifier
      - scope
      - found
      - market_id
      properties:
        provider:
          type: string
          description: Provider exactly as submitted in the request (not canonicalized).
          example: kalshi_offchain
        identifier:
          type: string
        scope:
          type: string
          enum:
          - market
          - outcome
        found:
          type: boolean
        market_id:
          type:
          - string
          - 'null'
          description: Canonical Kairos market_id, or null when unresolved.
    MarketIdentifierResolveResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          description: Same length and order as the request's `requests` array.
          items:
            $ref: '#/components/schemas/MarketIdentifierResolveResult'
    MarketListResponse:
      type: object
      description: Response body for GET /v1/markets.
      required:
      - exchange_id
      - markets
      - count
      - next_cursor
      - has_more
      properties:
        exchange_id:
          type: string
          example: kalshi
        markets:
          type: array
          items:
            $ref: '#/components/schemas/Market'
        count:
          type: integer
          description: Number of markets in this page (`markets.length`).
          example: 100
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page, or null when this is the last page.
        has_more:
          type: boolean
    ResolutionsResponse:
      type: object
      description: Map of market_id → resolved YES-side fraction (0–1). Markets with no resolution yet
        are omitted entirely — there is no `null`/`false` placeholder for "unresolved".
      required:
      - resolutions
      properties:
        resolutions:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          example:
            KXBTC-26JUL: 1
            KXETH-26JUL: 0.5
    ResolutionStatus:
      type: object
      description: One-row resolution lifecycle snapshot for a single market.
      required:
      - provider
      - market_id
      - condition_id
      - status
      - proposed_price
      - proposed_at
      - challenge_window_ends_at
      - proposer
      - disputer
      - dispute_count
      - reset_count
      - payout_numerators
      - resolved_ts
      - last_event_ts
      properties:
        provider:
          type: string
          description: Canonical provider name.
          example: polymarket
        market_id:
          type: string
          description: Echoes the requested market_id/ticker.
          example: '516710'
        condition_id:
          type: string
          description: On-chain condition id (CTF venues); empty string for kalshi.
          example: 0xcond123
        status:
          type: string
          description: Lifecycle status. Observed values include
            `proposed`, `disputed`, and `resolved`; not an exhaustive enum.
          example: proposed
        proposed_price:
          type:
          - number
          - 'null'
          description: Normalized proposed settlement price, or null if none proposed yet.
          example: 0.5
        proposed_at:
          type:
          - string
          - 'null'
          description: ISO8601 UTC.
          example: '2026-07-15T09:30:00+00:00'
        challenge_window_ends_at:
          type:
          - string
          - 'null'
          description: ISO8601 UTC. Null until a proposal starts the challenge window.
        proposer:
          type: string
          description: Proposer address; empty string if none.
          example: 0xprop
        disputer:
          type: string
          description: Disputer address; empty string if undisputed.
        dispute_count:
          type: integer
          example: 1
        reset_count:
          type: integer
          example: 0
        payout_numerators:
          type: array
          items:
            type: integer
            format: uint64
          description: Empty array until resolved.
        resolved_ts:
          type:
          - string
          - 'null'
          description: ISO8601 UTC. Null until resolved.
        last_event_ts:
          type: string
          description: ISO8601 UTC timestamp of the most recent lifecycle event.
          example: '2026-07-15T09:30:00+00:00'
    ResolutionEvent:
      type: object
      description: One entry in a market's resolution lifecycle timeline. Optional fields are omitted
        from the JSON entirely when unset/empty/zero, matching the codebase's omit-empty wire style —
        they are NOT emitted as null.
      required:
      - event_type
      - source
      - event_ts
      properties:
        event_type:
          type: string
          description: e.g. proposed, disputed, reset, settled_offchain.
          example: proposed
        source:
          type: string
          description: Origin of the event, e.g. polygon (on-chain UMA) or kalshi_api.
          example: polygon
        event_ts:
          type: string
          description: ISO8601 UTC.
          example: '2026-07-01T10:00:00+00:00'
        price_norm:
          type: number
          description: Normalized price associated with this event, when present.
          example: 1.0
        too_early:
          type: boolean
          description: Only present (and true) when the UMA "too early" flag was set.
        payout_numerators:
          type: array
          items:
            type: integer
            format: uint64
          description: Only present when non-empty.
          example:
          - 1
          - 0
        proposer:
          type: string
          example: 0xprop
        disputer:
          type: string
        bond:
          type: string
          description: Raw on-chain bond amount (base-unit decimal string, not float — avoids precision
            loss).
          example: '500000000000'
        reward:
          type: string
          description: Raw on-chain reward amount (base-unit decimal string).
          example: '5000000'
        expiration_ts:
          type: string
          description: ISO8601 UTC.
          example: '2026-07-01T12:00:00+00:00'
        request_timestamp:
          type: string
          description: ISO8601 UTC.
          example: '2026-07-01T09:00:00+00:00'
        tx_hash:
          type: string
          example: '0xdead'
        block_number:
          type: integer
          format: uint64
          description: Only present when non-zero.
          example: 123
    ResolutionEventsResponse:
      type: object
      required:
      - provider
      - market_id
      - market_key
      - events
      properties:
        provider:
          type: string
          example: kalshi
        market_id:
          type: string
          description: Echoes the requested market_id.
          example: TICK-A
        market_key:
          type: string
          description: The key events were actually queried by — equals market_id for kalshi; equals the
            resolved condition_id for CTF venues.
          example: TICK-A
        events:
          type: array
          description: Chronological, oldest first. Capped at 200 events.
          items:
            $ref: '#/components/schemas/ResolutionEvent'
    Mark:
      type: object
      required:
      - contract_id
      - token_id
      - price
      properties:
        contract_id:
          type: string
          example: '0xabc123'
        token_id:
          type: string
          example: '18812649149814341758733697580460697418474693998558159483117'
        price:
          type: number
          description: Last trade price on the 0–100 scale (matches candles/trades; divide by 100 for
            a 0–1 probability).
          example: 63.5
    MarksResponse:
      type: object
      required:
      - marks
      properties:
        marks:
          type: array
          description: One entry per pair that has ever traded, in request order. Never-traded pairs are
            omitted.
          items:
            $ref: '#/components/schemas/Mark'
    CandleObject:
      type: object
      description: One OHLCV bucket. Prices are on a 0-100 scale (percentage probability).
      required:
      - contract_id
      - timeframe_seconds
      - bucket_start
      - open
      - high
      - low
      - close
      - volume
      properties:
        contract_id:
          type: string
          description: Echo of the request's `contract_id` (the caller-supplied id, not the resolved canonical
            market id).
          example: '21742633143463906290569050155826241533067272736897614950488156847949938836455'
        timeframe_seconds:
          type: integer
          enum:
          - 1
          - 60
          - 300
          - 900
          - 3600
          - 14400
          - 86400
          description: Bucket width in seconds, echoing the request.
          example: 3600
        bucket_start:
          type: string
          description: Bucket start timestamp, UTC, always rendered with an explicit `+00:00` offset (not
            `Z`).
          example: '2026-07-15T00:00:00+00:00'
        open:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Opening price (0-100 scale).
          example: 61.5
        high:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: High price in the bucket (0-100 scale).
          example: 63.0
        low:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Low price in the bucket (0-100 scale).
          example: 60.8
        close:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Closing price (0-100 scale).
          example: 62.4
        volume:
          type: integer
          format: int64
          description: Traded volume in the bucket, provider-native units.
          example: 184230
        token_id:
          type: string
          description: Resolved per-outcome CLOB token id. Omitted entirely from the JSON object when
            empty.
          example: '704721957297303853272349184'
    CandleListResponse:
      type: object
      description: Response body of `GET /v1/candles` in JSON mode.
      required:
      - candles
      properties:
        candles:
          type: array
          items:
            $ref: '#/components/schemas/CandleObject'
          description: Candles in ascending `bucket_start` order. Empty when the aligned window is authoritatively
            empty.
    CandleBatchItem:
      type: object
      description: One series request inside a batch. Same validation rules as the `GET /v1/candles` query
        parameters.
      required:
      - provider
      - contract_id
      - timeframe_seconds
      - start
      - end
      properties:
        provider:
          type: string
          enum:
          - kalshi
          - polymarket
          - opinion
          - predictfun
          - hyperliquid
          - dome
          - kalshi_offchain
          example: polymarket
        contract_id:
          type: string
          maxLength: 128
          example: '21742633143463906290569050155826241533067272736897614950488156847949938836455'
        timeframe_seconds:
          description: Bucket width in seconds. Accepted as a JSON number or a numeric string. Valid values
            1, 60, 300, 900, 3600, 14400, 86400.
          oneOf:
          - type: integer
          - type: string
          example: 3600
        start:
          type: string
          description: Same accepted formats as `GET /v1/candles`'s `start` parameter (RFC 3339, bare
            datetime, or bare date).
          example: '2026-07-15T00:00:00Z'
        end:
          type: string
          description: Same accepted formats as `GET /v1/candles`'s `end` parameter.
          example: '2026-07-16T00:00:00Z'
        outcome:
          description: Zero-based outcome index. Accepted as a JSON number or a numeric string. Defaults
            to 0.
          oneOf:
          - type: integer
          - type: string
          default: 0
          example: 0
    CandleBatchRequest:
      type: object
      description: |
        Request body of `POST /v1/candles/batch`. Provide either `requests` or the legacy `items` alias — if `requests` is non-empty it takes precedence, otherwise `items` is used. At least one entry is required across the two fields, and the effective array may not exceed 200 entries.
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/CandleBatchItem'
          maxItems: 200
        items:
          type: array
          items:
            $ref: '#/components/schemas/CandleBatchItem'
          maxItems: 200
          description: Legacy alias for `requests`, used only when `requests` is absent or empty.
    CandleBatchResult:
      type: object
      description: Result for one input item, at the same array position as the request.
      required:
      - index
      - candles
      properties:
        index:
          type: integer
          description: Zero-based position in the input `requests`/`items` array.
          example: 0
        candles:
          type: array
          items:
            $ref: '#/components/schemas/CandleObject'
          description: Empty when the item's window was authoritatively empty OR when the item errored
            (check `error`).
        error:
          type: string
          description: Present only when this item failed validation or fetch. When present, `candles`
            is always `[]`.
          example: unknown provider "acme"
    CandleBatchResponse:
      type: object
      description: Response body of `POST /v1/candles/batch` in JSON mode.
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CandleBatchResult'
    CandleBinaryFrame:
      type: string
      format: binary
      description: |
        Columnar binary candle frame (`Content-Type: application/x-kairos-candles`), returned by both candle endpoints when negotiated via `?fmt=binary` or an `Accept: application/x-kairos-candles` header. Byte layout (little-endian): `u8 magic=0xCA, u8 version=1, u16 num_results`, then for each section `u32 index, u32 count`, followed by six columnar arrays of length `count`: `u32[] t` (bucket start, epoch seconds), `u16[] o,h,l,c` (prices scaled ×100 of the 0-100 float, clamped to [0, 10000]), and `i64[] vol` (volume ×100). In a batch frame, a failed item sets the high bit (`0x80000000`) of its section's `count` — mask it off before using the count, and treat a set bit as "this series errored" rather than "no data". The error message itself is only available in the JSON response.
    TradeRecord:
      type: object
      description: |
        A single deduplicated trade row. `token_id`, `metadata`, `taker_address`, and `side` are omitted entirely from the JSON (not emitted as null/empty) when the underlying value is empty — `metadata` is additionally omitted when it equals the default `"{}"`.
      required:
      - trade_id
      - contract_id
      - size
      - price
      - outcome
      - timestamp
      properties:
        trade_id:
          type: string
          description: Venue-scoped trade identifier (part of the dedup key together with provider_id
            and contract_id).
          example: '0x9f2ac3f1b0e2f4a9c8d7b6a5f4e3d2c1b0a9f8e7'
        contract_id:
          type: string
          description: Echoes the requested contract_id.
          example: '0x8b1c119419f622e21fc576ec8e9c2c07b2c1b09babf0e1f3d1cb9bfc1a8f9c2'
        size:
          type: integer
          format: int64
          description: Trade size, truncated to an integer.
          example: 250
        price:
          type: number
          description: |
            Trade price on the **0–100 cents scale, for every provider** (never a 0–1 probability, never already-divided dollars). May include sub-cent fractions on venues with sub-penny ticks (e.g. Kalshi). USD notional = size * price / 100.
          minimum: 0
          maximum: 100
          example: 62.5
        outcome:
          type: string
          description: Outcome label as stored on the trade row (venue-dependent free text, e.g. "Yes"/"No").
          example: 'Yes'
        timestamp:
          type: number
          description: Unix timestamp in seconds, with fractional (millisecond) precision preserved.
          example: 1737479998.412
        token_id:
          type: string
          description: Venue outcome-token identifier, when the venue is token-keyed (e.g. Polymarket
            CTF token id). Omitted when empty.
          example: '109451234567890332112345678903321'
        metadata:
          type: string
          description: Raw JSON-encoded metadata blob from the ingestion pipeline, passed through as a
            string (not parsed). Omitted when empty or the literal "{}".
          example: '{"maker_order_id":"0xabc"}'
        taker_address:
          type: string
          description: On-chain taker address, when known. Omitted when empty.
          example: '0xabc1234567890abcdef1234567890abcdef1234'
        side:
          type: string
          description: Canonical trade side as stored on the row. Omitted when empty.
          example: buy
    TradeHistoryResponse:
      type: object
      required:
      - trades
      - has_more
      - oldest_available_ts
      - coverage_hours
      properties:
        trades:
          type: array
          description: Trades in the resolved window, newest first, capped at `limit` entries.
          items:
            $ref: '#/components/schemas/TradeRecord'
        has_more:
          type: boolean
          description: |
            True when the number of trades returned equals the requested `limit`, meaning more trades likely exist beyond this page.
          example: true
        oldest_available_ts:
          type:
          - number
          - 'null'
          description: |
            Unix timestamp (seconds, fractional) of the oldest trade in the returned page, or null when `trades` is empty. Reflects the oldest trade *in this response*, not necessarily the oldest trade ever recorded for the contract.
          example: 1737479950.001
        coverage_hours:
          type: number
          description: |
            Hours between `oldest_available_ts` and the request time, rounded to 1 decimal place. 0.0 when `trades` is empty.
          example: 0.01
    TradeMetrics:
      type: object
      required:
      - volume_usd
      - outcome_0_volume_usd
      - outcome_1_volume_usd
      - outcome_0_volume_share_pct
      - trade_count
      - window_seconds
      - coverage_pct
      properties:
        volume_usd:
          type: number
          description: Total USD notional traded in the window (size * price / 100, summed), rounded to
            2 decimals.
          example: 184032.55
        outcome_0_volume_usd:
          type: number
          description: |
            USD volume attributed to "outcome 0". For Kalshi this is the "yes" side; for all other providers it is whichever token had the highest volume in the window (not guaranteed to be "Yes"). Rounded to 2 decimals.
          example: 121004.1
        outcome_1_volume_usd:
          type: number
          description: |
            USD volume attributed to "outcome 1". For Kalshi this is the "no" side; for all other providers it is the second-highest-volume token in the window. Rounded to 2 decimals.
          example: 63028.45
        outcome_0_volume_share_pct:
          type: number
          description: |
            outcome_0_volume_usd as a percentage of (outcome_0 + outcome_1) volume, rounded to 1 decimal. Defaults to 50.0 when both outcome volumes are zero.
          minimum: 0
          maximum: 100
          example: 65.8
        trade_count:
          type: integer
          format: int64
          description: Number of deduplicated trades in the window.
          example: 5123
        window_seconds:
          type: integer
          description: Echoes the effective `window_seconds` request parameter.
          example: 3600
        coverage_pct:
          type: number
          description: |
            Percentage of the requested window actually covered by data, clamped to [0, 100]. 0 when no trades are found. Rounded to 1 decimal.
          example: 97.2
    TradeMetricsResponse:
      type: object
      required:
      - metrics
      properties:
        metrics:
          $ref: '#/components/schemas/TradeMetrics'

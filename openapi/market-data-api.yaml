  /v1/perpetuals/{venue}/{instrument}/snapshot:
    get:
      operationId: getPerpetualSnapshot
      x-kairos-auth: public
      x-kairos-rate-limit: 6 heavy units per request (the snapshot fans out to several venue resources)
      summary: Get a live perpetual market-data snapshot
      tags:
      - Perpetuals
      description: |
        Production beta, sourced directly from the selected venue by the Market Data API.
        Returns a canonical ordered book, recent trades, one-minute candles,
        funding observations, and typed market state. Financial values are
        exact decimal strings. Prices are direct venue prices, never 0–100
        prediction probabilities. Quantities and volumes retain the declared
        `base_asset` or `contracts` unit. Do not derive notional for contract
        quantities without authoritative instrument metadata, and never apply
        the prediction-market `/ 100` formula. Each request costs 6 units in
        the HEAVY rate-limit bucket because it fans out to multiple venue
        resources.
        Responses are never cacheable by clients; the Market Data API uses a bounded
        one-second replica-local cache to coalesce bursts.
      parameters:
      - name: venue
        in: path
        required: true
        schema:
          type: string
          enum: [hyperliquid, polymarket_perps, kalshi_margin]
      - name: instrument
        in: path
        required: true
        description: |
          Venue-native instrument identifier, such as BTC, 6, or KXBTCPERP.
          Hyperliquid support is limited to standard main-dex perps in every
          environment; HIP-3 `dex:coin` identifiers are rejected. BTC and other
          standard listings are quoted in USDT, while HYPE and PURR are
          USDC-quoted exceptions. All three collateralize and settle in USDC.
          Their canonical identities are `hl-mainnet-btc-usdt`,
          `hl-mainnet-hype-usdc`, and `hl-mainnet-purr-usdc`.
        schema:
          type: string
      - name: depth
        in: query
        description: |
          Requested book depth per side. When omitted the default is the venue's own ceiling —
          20 for `hyperliquid` (its `l2Book` returns no more), 500 for `polymarket_perps` and
          `kalshi_margin`. A value outside [1, 500], or one that is not an integer, is rejected
          with 400.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Live canonical venue snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerpetualSnapshot'
        '400':
          description: |
            `unsupported perpetual venue` (a `venue` outside the enum), `depth must be an integer`, `depth must be between 1 and 500`, or `invalid perpetual instrument` — the instrument is empty, longer than 128 bytes, or does not match the venue's identifier grammar (`^[A-Za-z0-9][A-Za-z0-9._-]*$` for Hyperliquid, which is what rejects HIP-3 `dex:coin`; a positive integer for `polymarket_perps`; `^KX[A-Z0-9]+PERP$` for `kalshi_margin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: invalid perpetual instrument
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: '`internal` / `authentication backend unavailable` — the API-key path could not
            reach the credential store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal
                  message: authentication backend unavailable
        '502':
          description: |
            `upstream` / `perpetual venue data is unavailable or invalid`. Covers every non-validation failure: the venue returned a non-2xx status or an undecodable body, the 12s composite fetch deadline expired, or the assembled snapshot failed canonical validation (crossed or unsorted book, non-exact decimal, unknown market status, bad candle interval, unknown funding sign convention).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/RateLimiterUnavailable'

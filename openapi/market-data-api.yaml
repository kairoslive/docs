components:
  securitySchemes:
    apiKeyClientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: Credential client id (`kairos_ck_...`). Must be sent together with X-Api-Key and X-Api-Secret.
    apiKeyKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 64-char hex API key. Must be sent together with X-Client-Id and X-Api-Secret.
    apiKeySecret:
      type: apiKey
      in: header
      name: X-Api-Secret
      description: 64-char hex API secret. Must be sent together with X-Client-Id and X-Api-Key.
  responses:
    Unauthorized:
      description: |
        No valid credential presented. Every path returns `code: unauthorized`; the triggers differ:

        - An `Authorization` header on a deployment where bearer auth is not enabled (`bearer authentication is not enabled`).
        - A bearer token that fails verification (`invalid or expired session`), or whose token/session has been revoked (`session has been revoked`).
        - An incomplete or wrong API-key header set. Sending *any* of `X-Client-Id`, `X-Api-Key`, `X-Api-Secret` commits the request to the API-key path, so a partial set is rejected rather than silently degrading to anonymous limits (`valid X-Client-Id, X-Api-Key, and X-Api-Secret headers are required`).
        - No credential material at all while the anonymous free tier is unavailable — switched off for the deployment, forced off through the runtime kill switch, or not yet resolvable on a replica that has never read the flag (it fails closed).
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: '`Bearer realm="market-data-api"` on bearer-verification failure, `APIKey realm="market-data-api",
            header="X-Client-Id, X-Api-Key, X-Api-Secret"` on missing/invalid API-key credentials. Absent
            on the revoked-session and bearer-disabled paths.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: valid X-Client-Id, X-Api-Key, and X-Api-Secret headers are required
    IPNotWhitelisted:
      description: API key presented from a source IP not in that credential's whitelist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ip_not_whitelisted
              message: source IP not in credential whitelist
    RateLimited:
      description: |
        Two different gates return this status, both with `code: rate_limited`:

        - **Per-credential (or per-IP, when anonymous) weighted budget exhausted.** The message is `rate limit exceeded`, or, for anonymous callers, `anonymous rate limit exceeded — request an API key for higher limits (…)`. `Retry-After` is the whole number of seconds until the current one-minute window rolls over, floored at 1. All four `X-RateLimit-*` headers are present.
        - **Per-IP admission gate.** An in-process, pre-authentication guard that keeps a flood off the shared credential cache and database. The message is `too many requests from this address` and `Retry-After` is a flat `60`. Because this fires *before* authentication, the response carries **no** `X-RateLimit-*` headers at all.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the caller may retry — window-rollover seconds for the weighted limiter,
            a flat 60 for the IP admission gate.
        X-RateLimit-Bucket:
          schema:
            type: string
            enum:
            - light
            - heavy
        X-RateLimit-Tier:
          schema:
            type: string
            enum:
            - anonymous
            - api-key
            - user
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
            description: Unix timestamp (seconds) when the current window resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: rate limit exceeded
    RateLimiterUnavailable:
      description: |
        The rate limiter is unreachable. Fails CLOSED — the request is rejected rather than let through unmetered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limiter_unavailable
              message: rate limiter temporarily unavailable
  schemas:
    PerpetualExactDecimalString:
      type: string
      pattern: '^(?:0|-?[1-9][0-9]*(?:\.[0-9]*[1-9])?|-?0\.[0-9]*[1-9])$'
      description: |
        Normalized, exact base-10 decimal. No exponent notation, leading zeros,
        trailing fractional zeros, NaN, or infinity. May be negative.
      examples: ['0', '-0.00025', '65192.5']
    PerpetualPositiveDecimalString:
      type: string
      pattern: '^(?:[1-9][0-9]*(?:\.[0-9]*[1-9])?|0\.[0-9]*[1-9])$'

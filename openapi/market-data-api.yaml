  /v1/candles:
    get:
      operationId: getCandles
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit + 1 per 5000 requested bars (window ÷ timeframe, after retention clamping)
      summary: Get a single OHLCV candle series
      tags:
      - Candles
      x-kairos-bucket: light
      description: |
        Returns OHLCV candles for one `(provider, contract_id, timeframe_seconds, outcome)`
        series over `[start, end)`.

        **Alignment.** `start` is floored and `end` is ceiled to the nearest
        `timeframe_seconds` bucket boundary; `end` is additionally clamped to
        `now + 1 bucket`. Degenerate windows (`end <= start` after alignment)
        are extended by exactly one bucket. The requested window is silently
        clamped (not rejected) to the per-timeframe retention ceiling: 1s=1
        day, 1m=30 days, 5m=90 days, 15m=180 days, 1h=365 days, 4h=365 days,
        1d=730 days. For `timeframe_seconds=1`, if the aligned window falls
        entirely before `now - 24h` (the retention window for 1-second
        candles) the endpoint short-circuits to `{"candles":[]}` without
        querying upstream.

        **Timeframes.** Only 1s and 1m candles are stored directly; every
        other timeframe (5m, 15m, 1h, 4h, 1d) is rolled up server-side from
        the 1m base. When the first read comes back empty, `60`, `3600`,
        `14400` and `86400` retry as a rollup of the 1s base (brand-new
        contracts whose only history is 1-second candles); `300` and `900`
        have no such fallback and return an empty series instead. Prices are
        on a 0-100 scale. For providers that are not natively per-token
        (i.e. not `kalshi`, `polymarket`, `dome`, `opinion`, `predictfun`,
        `hyperliquid`), requesting `outcome > 0` inverts prices
        (`price = 100 - price`, high/low swapped) rather than resolving a
        distinct token. The check is on the provider string exactly as
        submitted, so the `kalshi_offchain` alias takes the inverting path
        even though `kalshi` does not — send `kalshi` for Kalshi candles.

        **Rate limiting / cost.** This route is in the `light` rate-limit
        bucket. Larger requests — wider windows, finer timeframes — consume
        more of your quota; a typical chart paint (a few hundred bars) costs
        1 unit.

        **Caching.** `Cache-Control` depends on how the aligned window
        relates to `now`: a window still in progress (`end >= now`) is
        `no-store`; a window entirely in the recent past is cached briefly;
        anything older is cached for longer. Cacheable responses carry a
        strong ETag and honor `If-None-Match`, returning `304` on a match.
        Responses ≥1KB are gzip-encoded when the client sends
        `Accept-Encoding: gzip`.

        **Binary format.** Pass `?fmt=binary` or send
        `Accept: application/x-kairos-candles` to receive a compact
        columnar binary frame instead of JSON. Layout: `u8 magic=0xCA,
        u8 version=1, u16 num_results`, then per result `u32 index,
        u32 count`, followed by the columnar arrays `u32[count] t` (epoch
        seconds), `u16[count] o,h,l,c` (price ×100), `i64[count] vol`
        (×100). A single-series `GET` response always has `num_results=1`.
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
          enum:
          - kalshi
          - polymarket
          - opinion
          - predictfun
          - hyperliquid
          - dome
          - kalshi_offchain
        description: |
          Market-data provider. Case-insensitive. `dome` and `kalshi_offchain` are aliases resolved to `polymarket` and `kalshi` respectively. `opinion` is a disabled provider kept resolvable for historic reads only. Unknown values return `400 invalid_request`.
        example: polymarket
      - name: contract_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
        description: |
          Provider-native contract/market/ticker id. For polymarket this may be either a numeric market id or a `0x`-prefixed condition_id (both resolve to the same series). Empty or >128 chars is rejected with `400 invalid_request`.
        example: '21742633143463906290569050155826241533067272736897614950488156847949938836455'
      - name: timeframe_seconds
        in: query
        required: true
        schema:
          type: integer
          enum:
          - 1
          - 60
          - 300
          - 900
          - 3600
          - 14400
          - 86400
        description: |
          Candle bucket width in seconds. Any value outside this set is rejected with `400 invalid_request`. Only 1 and 60 are stored directly; 300/900/3600/14400/86400 are always served as rollups.
        example: 3600
      - name: start
        in: query
        required: true
        schema:
          type: string
        description: |
          Window start, inclusive (before alignment). Accepts RFC 3339 (`2024-01-15T10:00:00Z` or with a numeric offset), a bare datetime (`2024-01-15T10:00:00`, treated as UTC), or a bare date (`2024-01-15`, treated as UTC midnight). Unparseable values return `400 invalid_request`.
        example: '2026-07-15T00:00:00Z'
      - name: end
        in: query
        required: true
        schema:
          type: string
        description: |
          Window end, exclusive (before alignment). Same accepted formats as `start`. Must be strictly after `start` or the request is rejected with `400 invalid_request: end must be after start`.
        example: '2026-07-16T00:00:00Z'
      - name: outcome
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: |
          Zero-based outcome index (e.g. 0=Yes, 1=No for a binary market, or an index into a multi-outcome market's token list). Defaults to 0. Negative or non-integer values return `400 invalid_request`.
        example: 0
      - name: fmt
        in: query
        required: false
        schema:
          type: string
          enum:
          - binary
        description: 'Set to `binary` to receive the columnar binary frame instead of JSON. Equivalent
          to sending `Accept: application/x-kairos-candles`.'
      responses:
        '200':
          description: |
            Candle series for the requested window. `{"candles":[]}` (empty array, `no-store`) is a valid 200 response, not an error — it means the window is authoritatively empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleListResponse'
              examples:
                hourlyCandles:
                  value:
                    candles:
                    - contract_id: '21742633143463906290569050155826241533067272736897614950488156847949938836455'
                      timeframe_seconds: 3600
                      bucket_start: '2026-07-15T00:00:00+00:00'
                      open: 61.5
                      high: 63.0
                      low: 60.8
                      close: 62.4
                      volume: 184230
                      token_id: '704721957297303853272349184'
            application/x-kairos-candles:
              schema:
                $ref: '#/components/schemas/CandleBinaryFrame'
        '304':
          description: Not Modified — `If-None-Match` matched the current ETag. Empty body.
        '400':
          description: Malformed or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownProvider:
                  value:
                    error:
                      code: invalid_request
                      message: unknown provider "foo"
                badTimeframe:
                  value:
                    error:
                      code: invalid_request
                      message: 'invalid timeframe_seconds (valid: 1, 60, 300, 900, 3600, 14400, 86400)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Upstream candle fetch failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/RateLimiterUnavailable'
  /v1/candles/batch:
    post:
      operationId: postCandlesBatch
      x-kairos-auth: public
      x-kairos-rate-limit: 1 light unit admitted up front + a deferred charge of 1 per 5000 requested bars summed over every item
      summary: Get up to 200 candle series in one request
      tags:
      - Candles
      x-kairos-bucket: light
      description: |
        Batched form of `GET /v1/candles`: fetches up to 200 independent
        `(provider, contract_id, timeframe_seconds, start, end, outcome)`
        series concurrently and returns them in request order, with
        **per-index partial failure** — one item's validation or fetch
        error does not fail the others.

        Each item is validated and aligned exactly as in `GET /v1/candles`
        (same clamping, rollup, and inversion rules). Body accepts either a
        `requests` array or a legacy `items` alias; if `requests` is
        non-empty it is used, otherwise `items` is used.
        `timeframe_seconds` and `outcome` in each item may be a JSON number
        or a numeric string. The request body is capped at 4 MiB.

        **Rate limiting / cost.** Admitted at the base cost of 1
        `light`-bucket unit. Larger batches — more items, wider windows,
        finer timeframes — consume more of your quota; any excess is
        charged as a deferred extra charge against your next request.

        **Caching.** Batch responses are always `Cache-Control: no-store`
        and never carry an ETag.

        **Binary format.** Pass `?fmt=binary` or
        `Accept: application/x-kairos-candles` to receive a single
        multi-result binary frame (`num_results = len(requests)`) — one
        columnar result section per request index, in input order. An item
        that failed sets the high bit (`0x80000000`) of its section's
        `count`, so it stays distinguishable from a genuinely empty window;
        mask the bit off to read the (always zero) count. Per-item error
        messages are only available in the JSON response.

        **Failure semantics.** Returns `500` only when *every* item in the
        batch failed. Otherwise `200` with a mix of populated and
        empty/errored entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandleBatchRequest'
            example:
              requests:
              - provider: polymarket
                contract_id: '21742633143463906290569050155826241533067272736897614950488156847949938836455'
                timeframe_seconds: 3600
                start: '2026-07-15T00:00:00Z'
                end: '2026-07-16T00:00:00Z'
                outcome: 0
              - provider: kalshi
                contract_id: KXHIGHNY-26JUL15-T50
                timeframe_seconds: 60
                start: '2026-07-15T12:00:00Z'
                end: '2026-07-15T13:00:00Z'
      responses:
        '200':
          description: Per-index results (populated, empty, or errored). Order matches the request array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleBatchResponse'
              examples:
                mixedResult:
                  value:
                    results:
                    - index: 0
                      candles:
                      - contract_id: '21742633143463906290569050155826241533067272736897614950488156847949938836455'
                        timeframe_seconds: 3600
                        bucket_start: '2026-07-15T00:00:00+00:00'
                        open: 61.5
                        high: 63.0
                        low: 60.8
                        close: 62.4
                        volume: 184230
                    - index: 1
                      candles: []
                      error: unknown provider "acme"
            application/x-kairos-candles:
              schema:
                $ref: '#/components/schemas/CandleBinaryFrame'
        '400':
          description: Malformed body, empty/oversized `requests` array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooLarge:
                  value:
                    error:
                      code: invalid_request
                      message: batch size 250 exceeds maximum 200
                empty:
                  value:
                    error:
                      code: invalid_request
                      message: requests array is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IPNotWhitelisted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Every item in the batch failed (validation or fetch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: internal
                      message: all batch items failed
        '503':
          $ref: '#/components/responses/RateLimiterUnavailable'
  /v1/trades:
    get:
      operationId: getTradeHistory
      x-kairos-auth: public
      x-kairos-rate-limit: 1 heavy unit per started 250 rows of `limit` (2 units at limit=500)
      summary: Recent trade tape for a contract
      description: |
        Returns the most recent individual trades for a single (provider, contract_id) pair,
        newest first, deduplicated by trade id. Only rows with `price > 0 AND price <= 100 AND size > 0` are eligible.

        **Price unit**: `price` is on the integer-cents scale **0–100 for every provider**
        (Kalshi, Polymarket, predict.fun, Hyperliquid alike) — it is NOT a 0–1 probability and
        NOT already divided into dollars. Multiply `size * price / 100` to get USD notional.
        `price` is returned as a float because some venues (e.g. Kalshi) report sub-penny ticks.

        **Window semantics**: the query window is `[now - window_seconds, before_or_now]`. The
        lower bound is always computed from the *current* server time, not from `before` —
        passing a `before` older than `now - window_seconds` can invert the window. If the
        primary window yields zero rows, the handler transparently retries with an unbounded
        lower bound `[0, before_or_now]` so contracts with no recent activity still return
        their most recent historical trades. `has_more` reflects an internal over-fetch of
        `limit + 1` rows, truncated back to `limit` before serialization.

        **Rate-limit cost (HEAVY bucket)**: priced by requested depth — a larger `limit`
        consumes more of your quota.

        **Caching**: responses are cached for 3s per replica (with singleflight coalescing) to
        absorb duplicate concurrent requests, and the implicit `now` upper bound is quantized to
        that same 3s so the cache is usable at all. The HTTP response itself is
        `Cache-Control: private, max-age=5` with no ETag — this route never returns 304.
